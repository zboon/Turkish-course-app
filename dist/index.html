{id:"b1u1",lv:"B1",n:1,tr:"Bir varmış bir yokmuş",en:"Once upon a time",focus:"öğrenilen geçmiş -mIş",
 vocab:[["evvel zaman içinde","in times long past"],["padişah","sultan"],["fakir","poor"],["akıllı","clever"],["ihtiyar","old man"],["yola çıkmak","to set out"],["sır","secret"],["ödül","reward"],["murada ermek","to attain one's wish"],["meğer","it turns out that"]],
 gram:{t:"-mIş: duyulan geçmiş",en:"The reported / inferential past",
  body:["<code>-mış -miş -muş -müş</code> reports what you did <b>not</b> witness: hearsay, legend, or a conclusion drawn from evidence.",
   "Compare: <b>Yağmur yağdı</b> (I saw it rain) vs <b>Yağmur yağmış</b> (the ground is wet — it must have rained / they say it rained).",
   "Every Turkish folk tale is told in -mIş, which is why the opening formula is <b>Bir varmış, bir yokmuş</b>.",
   "It also carries surprise about yourself: <b>Uyuyakalmışım!</b> — I've gone and fallen asleep!"],
  tbl:[["gitti","he went (I saw it)"],["gitmiş","he went (so I hear / apparently)"],["gidiyormuş","he is going, apparently"],["gidecekmiş","he is going to go, apparently"],["zenginmiş","he is rich, apparently"]],
  eg:[["Bir zamanlar bir padişah varmış.","Once there was a sultan."],["Ali evlenmiş, duydun mu?","Ali got married — did you hear?"],["Çok yorulmuşsun.","You look like you got very tired."]]},
 read:{t:"Keloğlan yola çıkmış",kind:"Halk masalı · anonim, yeniden anlatım",src:"B1 · folk tale, retold for this course",
  note:"Keloğlan — “bald boy” — is the poor, quick-witted hero of hundreds of Anatolian tales. The tales are anonymous folk property and are always narrated in -mIş.",
  lines:[["Bir varmış, bir yokmuş. Evvel zaman içinde, uzak bir köyde Keloğlan yaşarmış.","Once there was, once there wasn't. In times long past, in a distant village, there lived Keloğlan."],
   ["Çok fakirmiş ama akıllıymış; annesiyle küçük bir evde otururmuş.","He was very poor but clever; he lived with his mother in a little house."],
   ["Bir gün annesi ona demiş ki: “Oğlum, şehre git, kendine bir iş bul.”","One day his mother said to him: “Son, go to the city, find yourself work.”"],
   ["Keloğlan bir torba ekmek almış ve yola çıkmış.","Keloğlan took a bag of bread and set out."],
   ["Yolda beyaz sakallı bir ihtiyara rastlamış.","On the road he came upon an old man with a white beard."],
   ["İhtiyar ondan bir parça ekmek istemiş; Keloğlan ekmeğin yarısını vermiş.","The old man asked him for a piece of bread; Keloğlan gave him half of it."],
   ["İhtiyar gülümsemiş: “Sen iyi bir çocuksun. Sana bir sır söyleyeceğim.”","The old man smiled: “You are a good boy. I will tell you a secret.”"],
   ["Meğer o ihtiyar, padişahın kaybolan babasıymış.","It turned out that the old man was the sultan's lost father."],
   ["Keloğlan onu saraya götürmüş, padişah çok sevinmiş ve ona büyük bir ödül vermiş.","Keloğlan took him to the palace, the sultan was overjoyed and gave him a great reward."],
   ["Onlar ermiş muradına, biz çıkalım kerevetine.","They attained their wish; let us climb up to ours."]],
  gloss:{"torba":"bag, sack","rastlamak":"to come across","sakal":"beard","saray":"palace","kerevet":"a wooden bench — the closing formula of Turkish tales"}},
 drill:[
  {t:"mc",q:"You come home and find the window broken. You say:",a:["Cam kırıldı.","Cam kırılmış.","Cam kırılacak.","Cam kırılıyor."],c:1,why:"You did not witness it — inference takes -mIş."},
  {t:"fill",q:"Bir zamanlar bir padişah var___ . (tale opening)",c:"mış",why:"Folk narration is entirely -mIş."},
  {t:"mc",q:"“Ali gelmiş.” implies",a:["I saw Ali arrive","I heard that Ali arrived","Ali will arrive","Ali is arriving now"],c:1,why:"Hearsay or evidence, not witness."},
  {t:"order",q:"Build: “He set out and came upon an old man.”",w:["Yola","çıkmış","ve","bir","ihtiyara","rastlamış"],c:"Yola çıkmış ve bir ihtiyara rastlamış"},
  {t:"mc",q:"“Meğer” introduces",a:["a condition","a revealed truth","a comparison","a polite request"],c:1,why:"“It turned out that…”, the turn of a tale."}],
 speak:"Tell a story you were told but did not see, entirely in -mIş. Ten sentences."},

{id:"b1u2",lv:"B1",n:2,tr:"Olsaydı",en:"If it were",focus:"şart kipi -sA · -sAydI",
 vocab:[["şart","condition"],["keşke","if only"],["saklamak","to store, hide"],["saman","straw"],["zaman","time"],["fırsat","opportunity"],["pişman olmak","to regret"],["vazgeçmek","to give up"],["denemek","to try"],["başarmak","to succeed"]],
 gram:{t:"Üç tür şart",en:"Three kinds of if",
  body:["<b>Real</b> (-(y)sA on a tense): <b>Yarın gelirsen seviniriz.</b> If you come tomorrow, we'll be glad.",
   "<b>Unreal present</b> (-sA + idi): <b>Param olsaydı alırdım.</b> If I had money, I would buy it.",
   "<b>Unreal past</b>: <b>Erken kalksaydım treni kaçırmazdım.</b> If I had got up early, I wouldn't have missed the train.",
   "<b>Keşke</b> + -sAydI is the regret form: <b>Keşke gitmeseydim.</b> If only I hadn't gone."],
  tbl:[["gelirsem","if I come"],["gelsem","if I were to come"],["gelseydim","if I had come"],["gelirdim","I would come"],["gelecektim","I was going to come"]],
  eg:[["Vaktim olsa seninle gelirdim.","If I had time I would come with you."],["Keşke daha çok çalışsaydım.","If only I had studied more."],["Yağmur yağarsa kalırız.","If it rains we'll stay."]]},
 read:{t:"Fırsat ve zaman",kind:"Özgün deneme · with a folk proverb",src:"B1 · 80 kelime",
  lines:[["Hayatta çoğu insan, “Keşke o işi kabul etseydim,” der.","In life most people say, “If only I had taken that job.”"],
   ["Ama pişmanlık, geçmişi değiştiren bir güç değildir.","But regret is not a force that changes the past."],
   ["Eğer bir fırsat bugün kapıyı çalıyorsa, yarını beklememek gerekir.","If an opportunity is knocking at the door today, one should not wait for tomorrow."],
   ["Bir şeyi denemezsen, başarıp başaramayacağını hiçbir zaman bilemezsin.","If you don't try something, you will never know whether you can succeed."],
   ["Elinde az bir şey varsa bile onu sakla; zaman her şeyi değerli yapar.","Even if you have little in your hand, keep it; time makes everything valuable."],
   ["Atalarımız bunu tek bir cümlede söylemiş: Sakla samanı, gelir zamanı.","Our forebears said this in a single sentence: Keep the straw — its time will come."]],
  gloss:{"pişmanlık":"regret","geçmiş":"the past","kapıyı çalmak":"to knock at the door","değerli":"valuable"}},
 drill:[
  {t:"mc",q:"“If I had money, I would buy it.” =",a:["Param olursa alırım.","Param olsaydı alırdım.","Param olsa alacağım.","Param vardı aldım."],c:1,why:"Unreal present: -sAydI + -(A)rdI."},
  {t:"fill",q:"Keşke ona söyle___ . (if only I had told him)",c:"seydim",why:"Keşke + -sAydI marks regret."},
  {t:"mc",q:"“Yarın yağmur yağarsa…” is",a:["a real condition","an unreal condition","a regret","a command"],c:0,why:"A live possibility takes -(y)sA on the aorist."},
  {t:"order",q:"Build: “If it rains we will stay at home.”",w:["Yağmur","yağarsa","evde","kalırız"],c:"Yağmur yağarsa evde kalırız"},
  {t:"mc",q:"“Sakla samanı, gelir zamanı” advises",a:["farming in autumn","keeping what seems useless","sleeping early","sharing with neighbours"],c:1,why:"What looks worthless now will have its day."}],
 speak:"Say five things you would do if you lived in Turkey, and three you wish you had done differently."},

{id:"b1u3",lv:"B1",n:3,tr:"Gördüğüm şey",en:"The thing I saw",focus:"sıfat-fiiller -An · -DIK",
 vocab:[["kaşağı","curry comb (for grooming horses)"],["ahır","stable"],["demir","iron"],["alet","tool"],["kırmak","to break"],["suçlamak","to accuse"],["haksızlık","injustice"],["yalan","lie"],["utanç","shame"],["ömür boyu","for a lifetime"]],
 gram:{t:"-An ve -DIK: Türkçenin ilgi cümleleri",en:"Turkish has no “who / which” — it has participles",
  body:["Turkish builds relative clauses <b>before</b> the noun, with a participle.",
   "<code>-(y)An</code> when the noun is the <b>doer</b>: <b>koşan çocuk</b> — the child who runs; <b>gelen mektup</b> — the letter that came.",
   "<code>-DIK</code> + possessive when the noun is the <b>object</b> or anything else: <b>okuduğum kitap</b> — the book that I read; <b>oturduğumuz ev</b> — the house we live in.",
   "Future equivalent: <code>-(y)AcAK</code> + possessive — <b>okuyacağım kitap</b>, the book I am going to read.",
   "Read them backwards into English: <i>benim / dün / aldığım / kitap</i> → the book that I bought yesterday."],
  tbl:[["-(y)An","doer — ağlayan çocuk"],["-DIK+iyelik","object — sevdiğim şarkı"],["-(y)AcAK+iyelik","future — gideceğimiz yer"],["-mIş","state — kırılmış cam"]],
  eg:[["Bana yardım eden adamı tanımıyorum.","I don't know the man who helped me."],["Babamın getirdiği kaşağı","the curry comb my father brought"],["Oturduğumuz ev çok eski.","The house we live in is very old."]]},
 read:{t:"Kaşağı",kind:"Uyarlama · Ömer Seyfettin, “Kaşağı” (1918)",src:"B1 · adapted and simplified for this course",
  note:"Ömer Seyfettin (1884–1920) wrote the short stories every Turkish schoolchild still reads. “Kaşağı” is his most famous: a boy breaks the stable's iron curry comb, lets his little brother Hasan be blamed, and carries the shame after Hasan dies. The wording here is simplified for B1; the story is public domain.",
  lines:[["Babamın Çerkes köyünden getirdiği kaşağı, demirden yapılmış ağır bir aletti.","The curry comb my father had brought from the Circassian village was a heavy tool made of iron."],
   ["Atları tımar eden seyis onu çok severdi, ama ben o kaşağıdan nefret ederdim.","The groom who tended the horses loved it dearly, but I hated that curry comb."],
   ["Bir gün, kimsenin görmediği bir anda, onu taşa vurup kırdım.","One day, at a moment when nobody was watching, I struck it on a stone and broke it."],
   ["Kırılan parçaları ahırın köşesine attım ve hiçbir şey söylemedim.","I threw the broken pieces into the corner of the stable and said nothing."],
   ["Babam kaşağıyı arayınca, suçladığı kişi küçük kardeşim Hasan oldu.","When my father looked for the comb, the person he accused was my little brother Hasan."],
   ["Hasan ağlayarak “Ben kırmadım,” dedi, ama kimse ona inanmadı.","Hasan said, weeping, “I didn't break it,” but nobody believed him."],
   ["Sustum. Söylemediğim tek bir kelime, kardeşimi yalancı yaptı.","I kept silent. One word I did not say made my brother a liar."],
   ["O gün yaptığım haksızlık, ömrüm boyunca peşimi bırakmadı.","The injustice I did that day never left me for the rest of my life."]],
  gloss:{"tımar etmek":"to groom (a horse)","seyis":"groom, stable hand","nefret etmek":"to hate","susmak":"to fall silent","peşini bırakmamak":"to never leave one alone"}},
 drill:[
  {t:"mc",q:"“the book that I read” =",a:["okuyan kitap","okuduğum kitap","okumak kitabım","kitabı okudum"],c:1,why:"The noun is the object → -DIK + possessive."},
  {t:"mc",q:"“the child who is crying” =",a:["ağladığım çocuk","ağlayan çocuk","ağlamış çocuğu","çocuk ağlıyor"],c:1,why:"The noun is the doer → -(y)An."},
  {t:"fill",q:"Oturduğ___ ev çok eski. (the house WE live in)",c:"umuz",why:"-DIK + biz possessive -ImIz."},
  {t:"order",q:"Build: “the injustice I did that day”",w:["o","gün","yaptığım","haksızlık"],c:"o gün yaptığım haksızlık"},
  {t:"mc",q:"In the story, who is blamed for the broken comb?",a:["the narrator","the groom","Hasan","the father"],c:2,why:"And the narrator's silence is the story's whole weight."}],
 speak:"Describe three people and three objects in your life using -(y)An and -DIK clauses, e.g. “the friend who taught me Turkish”."},

{id:"b1u4",lv:"B1",n:4,tr:"Gülerek",en:"Laughing",focus:"zarf-fiiller -ArAk · -IncA · -mAdAn · -Ip",
 vocab:[["pazar","market; Sunday"],["düdük","whistle"],["çalmak","to play; to steal; to knock"],["etraf","surroundings"],["sarmak","to surround, wrap"],["para","money"],["uzatmak","to hold out"],["kalabalık","crowd"],["dağıtmak","to hand out"],["ısrar etmek","to insist"]],
 gram:{t:"Zarf-fiiller",en:"Linking one verb to another",
  body:["<code>-(y)ArAk</code> — by doing, while doing: <b>koşarak geldi</b>, he came running.",
   "<code>-(y)IncA</code> — when, as soon as: <b>eve gelince ara</b>, call when you get home.",
   "<code>-mAdAn (önce)</code> — without / before doing: <b>söylemeden gitti</b>, he left without saying.",
   "<code>-(y)Ip</code> — joins two verbs of the same subject and tense, so the ending is said only once: <b>alıp götürdü</b>, he took it and carried it off.",
   "<code>-DIktAn sonra</code> — after doing: <b>yemek yedikten sonra</b>."],
  tbl:[["-(y)ArAk","gülerek — laughing"],["-(y)IncA","görünce — on seeing"],["-mAdAn","görmeden — without seeing"],["-(y)Ip","görüp — seeing and…"],["-DIkçA","gördükçe — as one sees"]],
  eg:[["Şarkı söyleyerek yürüyordu.","He was walking along singing."],["Beni görünce kaçtı.","When he saw me he ran off."],["Hiçbir şey söylemeden çıktı.","He went out without saying anything."]]},
 read:{t:"Parayı veren düdüğü çalar",kind:"Halk anlatısı · Nasreddin Hoca (anonim), yeniden anlatım",src:"B1 · folk tale, retold for this course",
  lines:[["Nasreddin Hoca pazara gitmek için hazırlanırken, mahallenin çocukları etrafını sarmış.","As Nasreddin Hoca was getting ready to go to the market, the children of the neighbourhood surrounded him."],
   ["Hepsi bağırarak aynı şeyi istemiş: “Hocam, bize düdük al!”","All of them shouted for the same thing: “Hoca, buy us a whistle!”"],
   ["Hoca gülerek başını sallamış ve yola çıkmış.","The Hoca nodded, laughing, and set off."],
   ["Çocuklardan yalnız biri, hiçbir şey söylemeden ona bir kuruş uzatmış.","Of the children only one, without saying anything, held out a coin to him."],
   ["Hoca pazara varınca tek bir düdük almış.","When the Hoca reached the market he bought a single whistle."],
   ["Dönüp geldikten sonra düdüğü, parayı veren çocuğa vermiş.","After coming back he gave the whistle to the child who had given the money."],
   ["Ötekiler ısrar edip bağırmaya başlamışlar: “Peki ya biz?”","The others insisted and began to shout: “And what about us?”"],
   ["Hoca omuzlarını silkerek cevap vermiş: “Parayı veren düdüğü çalar.”","Shrugging his shoulders, the Hoca answered: “He who pays the money blows the whistle.”"]],
  gloss:{"mahalle":"neighbourhood","kuruş":"a small coin","varmak":"to arrive","öteki":"the other one","omuz silkmek":"to shrug"}},
 drill:[
  {t:"mc",q:"“He came running.” =",a:["Koşunca geldi.","Koşarak geldi.","Koşmadan geldi.","Koşup geldi mi."],c:1,why:"-(y)ArAk = by/while doing."},
  {t:"fill",q:"Beni gör___ kaçtı. (when he saw me)",c:"ünce",why:"gör + ünce (four-way harmony after ö)."},
  {t:"mc",q:"“Hiçbir şey söylemeden çıktı.” =",a:["He went out and said nothing","He went out without saying anything","He said nothing before going out, then spoke","He couldn't say anything"],c:1,why:"-mAdAn = without doing."},
  {t:"order",q:"Build: “After coming back he gave the whistle.”",w:["Dönüp","geldikten","sonra","düdüğü","vermiş"],c:"Dönüp geldikten sonra düdüğü vermiş"},
  {t:"mc",q:"The proverb is used today about",a:["music lessons","who gets to decide — the one who pays","being generous with children","buying cheap goods"],c:1,why:"“He who pays the piper calls the tune”."}],
 speak:"Describe your morning using five linked clauses: kalkınca…, kahvaltı yaparak…, çıkmadan önce…, işe varıp…, döndükten sonra…"},

{id:"b1u5",lv:"B1",n:5,tr:"Ne olduğunu biliyorum",en:"I know what happened",focus:"isim-fiiller -DIğInI · -(y)AcAğInI",
 vocab:[["forsa","galley slave"],["esir","captive"],["kürek","oar"],["kıyı","shore"],["yıl","year"],["kurtulmak","to be saved, escape"],["yüzmek","to swim"],["tanımak","to recognise"],["yaşlı","old (person)"],["vatan","homeland"]],
 gram:{t:"-DIğInI: cümle içinde cümle",en:"Turning a whole sentence into an object",
  body:["To say <i>I know <b>that</b> he came</i>, Turkish nominalises the inner sentence: <b>Onun geldiğ<u>ini</u> biliyorum.</b> The inner subject takes the genitive, the verb takes -DIK + possessive + accusative.",
   "Future: <b>geleceğ<u>ini</u> biliyorum</b> — I know that he will come.",
   "Common frames: <b>…-DIğInI biliyorum / duydum / söyledi / fark ettim / sanıyorum</b>.",
   "Question words stay inside: <b>Ne yaptığını anlamadım.</b> — I didn't understand what you did."],
  tbl:[["geldiğini biliyorum","I know that he came"],["geleceğini duydum","I heard that he will come"],["ne dediğini anlamadım","I didn't get what he said"],["gittiğimi söyledim","I said that I had gone"]],
  eg:[["Onun hasta olduğunu bilmiyordum.","I didn't know he was ill."],["Ne istediğini söyle.","Say what you want."],["Geleceğini sanmıyorum.","I don't think he will come."]]},
 read:{t:"Forsa",kind:"Uyarlama · Ömer Seyfettin, “Forsa” (1919)",src:"B1 · adapted and simplified for this course",
  note:"In Ömer Seyfettin's story an old Turkish sailor spends forty years chained to a foreign galley, escapes, and swims to an island — only to find that the homeland he remembers has changed beyond recognition. Public domain; the wording here is simplified.",
  lines:[["Yaşlı forsa, kırk yıldır aynı küreği çektiğini kimseye söylemezdi.","The old galley slave never told anyone that he had been pulling the same oar for forty years."],
   ["Zincirin ne kadar ağır olduğunu yalnız o bilirdi.","Only he knew how heavy the chain was."],
   ["Bir fırtına gecesi geminin kıyıya yaklaştığını fark etti.","On a stormy night he noticed that the ship was approaching the shore."],
   ["Kurtulabileceğini düşündü ve kendini karanlık suya bıraktı.","He thought that he might be saved, and let himself fall into the dark water."],
   ["Saatlerce yüzdükten sonra bir adaya çıktı.","After swimming for hours he came out onto an island."],
   ["Orada yaşayan insanların dilini anlıyordu, ama onu kimse tanımadı.","He understood the language of the people living there, but nobody recognised him."],
   ["Oğlunun çoktan öldüğünü, evinin yıkıldığını öğrendi.","He learned that his son had long since died and that his house had fallen down."],
   ["Kırk yıl boyunca beklediği vatanın, artık hatırladığı yer olmadığını anladı.","He understood that the homeland he had waited for through forty years was no longer the place he remembered."]],
  gloss:{"zincir":"chain","fırtına":"storm","fark etmek":"to notice","ada":"island","çoktan":"long since","yıkılmak":"to collapse"}},
 drill:[
  {t:"mc",q:"“I know that he came.” =",a:["Onun geldiğini biliyorum.","O geldi biliyorum.","Onun gelmek biliyorum.","Geldiğim biliyorum."],c:0,why:"Genitive subject + -DIK + possessive + accusative."},
  {t:"fill",q:"Ne iste___ söyle. (what you want)",c:"diğini",why:"iste + diğ + in + i."},
  {t:"mc",q:"“Geleceğini duydum.” =",a:["I heard him come","I heard that he will come","I heard what he said","He heard that I came"],c:1,why:"-(y)AcAK marks the future inside the clause."},
  {t:"order",q:"Build: “He noticed that the ship was approaching.”",w:["Geminin","yaklaştığını","fark","etti"],c:"Geminin yaklaştığını fark etti"},
  {t:"mc",q:"The old sailor's tragedy is that",a:["he never escaped","he drowned near the shore","the homeland he returned to no longer existed","he forgot his language"],c:2,why:"Forty years of waiting returned him to a place that had gone."}],
 speak:"Report five things you have learned about Turkey using “…-DIğInI öğrendim / duydum / okudum”."},

{id:"b1u6",lv:"B1",n:6,tr:"Ne için?",en:"What for?",focus:"amaç · -mAk için · -mAsI için",
 vocab:[["amaç","aim"],["sebep","reason"],["niyet","intention"],["çaba","effort"],["hedef","target"],["ulaşmak","to reach"],["sağlamak","to provide, ensure"],["kaçınmak","to avoid"],["uğraşmak","to struggle with"],["yeterli","sufficient"]],
 gram:{t:"Amaç cümleleri",en:"Purpose clauses",
  body:["Same subject → <code>-mAk için</code>: <b>Türkçe öğrenmek için buradayım.</b>",
   "Different subject → <code>-mAsI için</code>: <b>Beni anlaması için yavaş konuştum.</b> — I spoke slowly so that he would understand me.",
   "<code>-mAk üzere</code> is the formal version, and also means “on the point of”: <b>bitmek üzere</b>.",
   "Negative purpose: <code>-mAmAk için</code> — <b>geç kalmamak için erken çıktım</b>.",
   "<code>diye</code> does the same job in speech: <b>üşümesin diye ceket aldım</b> — I bought a jacket so he wouldn't get cold."],
  tbl:[["-mAk için","in order to (same subject)"],["-mAsI için","so that (someone else)"],["-mAmAk için","in order not to"],["… diye","so that (spoken)"],["-mAk üzere","in order to (formal)"]],
  eg:[["Sağlıklı olmak için yürüyorum.","I walk in order to be healthy."],["Çocuklar duymasın diye fısıldadık.","We whispered so the children wouldn't hear."],["Sınavı geçmesi için çok çalıştı.","He worked hard so that he would pass the exam."]]},
 read:{t:"Niçin öğreniyoruz?",kind:"Özgün deneme",src:"B1 · 70 kelime",
  lines:[["İnsanlar bir dili farklı sebeplerle öğrenir.","People learn a language for different reasons."],
   ["Kimi iş bulmak için, kimi sevdiği birini anlamak için başlar.","Some begin in order to find work, some in order to understand someone they love."],
   ["Ama dil, yalnız bir araç olarak görüldüğünde çabuk unutulur.","But a language, when seen only as a tool, is quickly forgotten."],
   ["Kalıcı olması için, dilin içinde bir şey sevmek gerekir: bir şarkı, bir hikâye, bir şehir.","For it to last, one must love something inside the language: a song, a story, a city."],
   ["Unutmamak için her gün küçük bir şey okumak yeterlidir.","In order not to forget, reading one small thing a day is enough."],
   ["Hedef mükemmel konuşmak değil, anlaşılmak olmalıdır.","The aim should not be to speak perfectly but to be understood."]],
  gloss:{"araç":"tool, vehicle","kimi":"some (people)","çabuk":"quickly","mükemmel":"perfect"}},
 drill:[
  {t:"mc",q:"“I came in order to see you.” =",a:["Seni görmek için geldim.","Seni görmen için geldim.","Seni görmeye diye geldim.","Seni görmem geldim."],c:0,why:"Same subject → -mAk için."},
  {t:"fill",q:"Beni anla___ için yavaş konuştum. (so that he would understand)",c:"ması",why:"Different subject → -mAsI için."},
  {t:"mc",q:"“Geç kalmamak için” =",a:["because I was late","in order not to be late","although I was late","when I was late"],c:1,why:"Negative purpose."},
  {t:"order",q:"Build: “We whispered so the children wouldn't hear.”",w:["Çocuklar","duymasın","diye","fısıldadık"],c:"Çocuklar duymasın diye fısıldadık"},
  {t:"mc",q:"“bitmek üzere” means",a:["in order to finish","about to finish","having finished","unable to finish"],c:1,why:"-mAk üzere has both senses; context decides."}],
 speak:"Give six reasons you are learning Turkish, alternating -mAk için and -mAsI için."},

{id:"b1u7",lv:"B1",n:7,tr:"Gidelim mi?",en:"Shall we go?",focus:"istek kipi -(y)A · teklif",
 vocab:[["teklif","proposal"],["karar","decision"],["fikir","idea"],["belki","maybe"],["haydi (hadi)","come on"],["vazgeçmek","to give up"],["denemek","to try"],["kabul etmek","to accept"],["reddetmek","to refuse"],["anlaşmak","to come to an agreement"]],
 gram:{t:"İstek kipi",en:"Let me, let's, shall we",
  body:["<code>-(y)AyIm</code> — let me: <b>gideyim</b>, <b>bakayım</b>, <b>söyleyeyim</b>. As a question it offers: <b>Yardım edeyim mi?</b>",
   "<code>-(y)AlIm</code> — let's: <b>gidelim</b>, <b>başlayalım</b>. As a question it proposes: <b>Çay içelim mi?</b>",
   "Third person <code>-sIn</code> is a wish or an order passed on: <b>gelsin</b> (let him come), <b>Allah razı olsun</b>.",
   "Turkish uses this mood where English uses “shall”, “let's”, and many polite offers — it is everywhere in conversation.",
   "<b>Haydi</b> pushes it along: <b>Hadi gidelim!</b>"],
  tbl:[["gideyim","let me go"],["gidelim","let's go"],["gitsin","let him go"],["gideyim mi?","shall I go?"],["gidelim mi?","shall we go?"]],
  eg:[["Sana bir şey söyleyeyim.","Let me tell you something."],["Bu akşam dışarı çıkalım mı?","Shall we go out tonight?"],["Kim isterse gelsin.","Whoever wants to, let them come."]]},
 read:{t:"Plan yapmak",kind:"Özgün metin · dialogue",src:"B1 · 65 kelime",
  lines:[["— Bu hafta sonu ne yapalım?","What shall we do this weekend?"],
   ["— Bilmem, sen bir fikir söyle.","I don't know, you suggest an idea."],
   ["— Adaya gidelim mi? Havalar güzel.","Shall we go to the island? The weather is good."],
   ["— Olur, ama erken çıkalım, vapur kalabalık oluyor.","All right, but let's leave early, the ferry gets crowded."],
   ["— Ben bilet alayım o zaman.","Let me buy the tickets, then."],
   ["— Sen bilet al, ben de yemek hazırlayayım.","You buy the tickets, and let me prepare the food."],
   ["— Anlaştık. Hadi, yarın sabah dokuzda.","Agreed. Come on then, nine tomorrow morning."]],
  gloss:{"bilmem":"I don't know (short form)","olur":"all right","hazırlamak":"to prepare","anlaştık":"we're agreed"}},
 drill:[
  {t:"mc",q:"“Shall we go?” =",a:["Gideyim mi?","Gidelim mi?","Gitsin mi?","Gider misin?"],c:1,why:"-(y)AlIm is the first person plural."},
  {t:"fill",q:"Sana bir şey söyle___ . (let me tell you)",c:"yeyim",why:"söyle + yeyim."},
  {t:"mc",q:"“Kim isterse gelsin.” =",a:["Who wants to come?","Let whoever wants to come","Nobody may come","He wants to come"],c:1,why:"Third-person -sIn passes on permission."},
  {t:"order",q:"Build: “Let me buy the tickets then.”",w:["Ben","bilet","alayım","o","zaman"],c:"Ben bilet alayım o zaman"},
  {t:"mc",q:"“Yardım edeyim mi?” is",a:["a command","an offer","a refusal","a complaint"],c:1,why:"Shall I help?"}],
 speak:"Plan a weekend with a friend out loud: make six proposals and accept or refuse each."},

{id:"b1u8",lv:"B1",n:8,tr:"Olmalı",en:"It must be",focus:"olasılık · tahmin · -DIr",
 vocab:[["ihtimal","possibility"],["tahmin","guess"],["kesin","certain"],["galiba","probably"],["herhâlde","presumably"],["sanmak","to suppose"],["şüphe","doubt"],["emin","sure"],["imkânsız","impossible"],["mümkün","possible"]],
 gram:{t:"Tahmin dili",en:"Talking about likelihood",
  body:["<code>-mAlI</code> also means “must be”, as a deduction: <b>Evde olmalı</b> — he must be at home.",
   "<code>-DIr</code> in speech is a guess, not a fact: <b>Gelmiştir</b> (he'll have arrived by now), <b>Uyuyordur</b> (he's probably asleep).",
   "Adverbs carry most of the load: <b>galiba, herhâlde, muhtemelen, belki, kesinlikle, sanırım, bence</b>.",
   "<b>-(y)A benzemek</b> and <b>gibi görünmek</b> hedge: <b>Yorgun gibi görünüyorsun.</b>",
   "Degrees of certainty, lowest to highest: <b>belki → galiba → herhâlde → muhtemelen → eminim → kesinlikle</b>."],
  tbl:[["Evde olmalı.","He must be at home."],["Gelmiştir.","He'll have come."],["Galiba unuttu.","He probably forgot."],["Sanırım haklısın.","I think you're right."],["Eminim ki gelir.","I'm sure he'll come."]],
  eg:[["Telefonu kapalı, uyuyordur.","His phone is off — he must be asleep."],["Bu kadar trafikte geç kalmış olmalı.","In this much traffic he must have been delayed."],["Belki yarın görüşürüz.","Maybe we'll see each other tomorrow."]]},
 read:{t:"Gelmedi",kind:"Özgün metin · dialogue",src:"B1 · 65 kelime",
  lines:[["— Yarım saat oldu, hâlâ gelmedi.","It's been half an hour and he still hasn't come."],
   ["— Trafiğe takılmıştır, bu saatte yol kapalıdır.","He'll have been caught in traffic; the road is blocked at this hour."],
   ["— Telefonu da kapalı.","His phone is off too."],
   ["— Şarjı bitmiş olmalı. Galiba unuttu şarj etmeyi.","The battery must have run out. He probably forgot to charge it."],
   ["— Sence gelir mi?","Do you think he'll come?"],
   ["— Eminim gelir. O söz verdiyse gelir.","I'm sure he will. If he gave his word, he'll come."]],
  gloss:{"trafiğe takılmak":"to get stuck in traffic","şarj":"battery charge","söz vermek":"to give one's word"}},
 drill:[
  {t:"mc",q:"“He must be at home.” =",a:["Evde olmalı.","Evde olsun.","Evde olacak.","Evde olurdu."],c:0,why:"-mAlI doubles as deduction."},
  {t:"fill",q:"Telefonu kapalı, uyuyor___ . (he's probably asleep)",c:"dur",why:"-DIr on a verb is a spoken guess."},
  {t:"mc",q:"Which is the least certain?",a:["kesinlikle","eminim","belki","muhtemelen"],c:2,why:"belki < galiba < herhâlde < muhtemelen < eminim < kesinlikle."},
  {t:"order",q:"Build: “He must have got stuck in traffic.”",w:["Trafiğe","takılmış","olmalı"],c:"Trafiğe takılmış olmalı"},
  {t:"mc",q:"“Gelmiştir.” in conversation means",a:["He definitely came","He'll have come by now, I assume","He must come","He had come"],c:1,why:"Written -DIr asserts; spoken -DIr guesses."}],
 speak:"Look at six situations around you and guess aloud what happened, using a different certainty word each time."},

{id:"b1u9",lv:"B1",n:9,tr:"Geçmişin hikâyesi",en:"The story of the past",focus:"birleşik zamanlar · -(I)yordu · -mIştI",
 vocab:[["o sırada","at that moment"],["birden","suddenly"],["sonunda","in the end"],["nihayet","at last"],["önceden","beforehand"],["hatırlamak","to remember"],["unutmak","to forget"],["karşılaşmak","to run into"],["fark","difference"],["olay","event"]],
 gram:{t:"Hikâye birleşik zaman",en:"Setting a scene in the past",
  body:["<code>-(I)yordu</code> holds a background action open: <b>Yağmur yağıyordu.</b>",
   "<code>-mIştI</code> is the pluperfect — what had already happened: <b>Tren kalkmıştı.</b>",
   "<code>-(A)cAktI</code> is what was going to happen but didn't: <b>Gelecektim ama olmadı.</b>",
   "<code>-(A)rdI</code> is the habitual past: <b>Her yaz denize giderdik.</b>",
   "A Turkish narrative paragraph typically opens with -(I)yordu for the scene, advances with -DI, and reaches back with -mIştI."],
  tbl:[["-(I)yordu","was doing"],["-DI","did"],["-mIştI","had done"],["-(A)cAktI","was going to do"],["-(A)rdI","used to do"]],
  eg:[["Ben eve girdiğimde herkes uyuyordu.","When I entered the house everyone was asleep."],["Onu daha önce bir yerde görmüştüm.","I had seen him somewhere before."],["Tam çıkacaktım ki telefon çaldı.","I was just about to leave when the phone rang."]]},
 read:{t:"İstasyonda",kind:"Özgün metin · narrative",src:"B1 · 75 kelime",
  lines:[["O akşam yağmur yağıyordu ve istasyon neredeyse boştu.","That evening it was raining and the station was almost empty."],
   ["Trene binmek için erken gelmiştim, çünkü biletimi önceden almıştım.","I had come early to board the train, because I had bought my ticket beforehand."],
   ["Bankta otururken karşı peronda tanıdık bir yüz gördüm.","While I was sitting on the bench I saw a familiar face on the opposite platform."],
   ["Onu yıllar önce üniversitede tanımıştım, ama adını unutmuştum.","I had known him years before at university, but I had forgotten his name."],
   ["Tam yanına gidecektim ki tren geldi ve aramıza girdi.","I was just about to go over to him when the train came and cut between us."],
   ["Tren kalktığında o perondan çoktan ayrılmıştı.","When the train pulled out he had already left the platform."],
   ["Sonunda adını hatırladım: Kemal. Ama artık çok geçti.","In the end I remembered his name: Kemal. But it was far too late."]],
  gloss:{"neredeyse":"almost","peron":"platform","tanıdık":"familiar, an acquaintance","aramıza girmek":"to come between us"}},
 drill:[

{id:"b1u10",lv:"B1",n:10,tr:"Kelimenin içi",en:"Inside the word",focus:"yapım ekleri · sözcük türetme",
 vocab:[["kök","root"],["ek","suffix"],["türetmek","to derive"],["anlam","meaning"],["iş","work, job"],["göz","eye"],["yol","road, way"],["baş","head, chief"],["söz","word, speech"],["el","hand"]],
 gram:{t:"Yapım ekleri",en:"Word-building: the biggest shortcut in Turkish",
  body:["Turkish builds thousands of words from a few hundred roots. Learn the machinery and your vocabulary multiplies.",
   "<code>-CI</code> maker or doer: <b>göz → gözcü</b> (lookout), <b>yol → yolcu</b>, <b>iş → işçi</b>, <b>kitap → kitapçı</b>.",
   "<code>-lIk</code> abstract noun or thing-for: <b>güzel → güzellik</b>, <b>göz → gözlük</b> (spectacles), <b>tuz → tuzluk</b> (salt cellar).",
   "<code>-lI</code> with, <code>-sIz</code> without: <b>şekerli / şekersiz</b>, <b>anlamlı / anlamsız</b>.",
   "<code>-CA</code> language or manner: <b>Türkçe</b>, <b>yavaşça</b>, <b>bence</b>.",
   "Verb from noun: <code>-lA</code> — <b>su → sulamak</b> (to water), <b>baş → başlamak</b>. Noun from verb: <code>-Im</code>, <code>-GI</code>, <code>-mA</code> — <b>ölçmek → ölçü</b>, <b>sormak → soru</b>, <b>bilmek → bilgi</b>."],
  tbl:[["-CI","doer — balıkçı"],["-lIk","abstract — dostluk"],["-lI / -sIz","with / without"],["-CA","manner, language"],["-lA-","noun → verb"],["-GI / -Im","verb → noun"]],
  eg:[["Gözlükçüden yeni gözlük aldım.","I bought new glasses from the optician."],["Bu sözün hiçbir anlamı yok.","This word has no meaning at all."],["Yavaşça kapıyı kapattı.","He closed the door slowly."]]},
 read:{t:"Bir kökten bir orman",kind:"Özgün deneme",src:"B1 · 70 kelime",
  lines:[["Türkçede kelimeler ezberlenmez, kurulur.","In Turkish words are not memorised, they are built."],
   ["“Göz” kökünden gözlük, gözlükçü, gözcü, gözlem ve gözlemci çıkar.","From the root “göz” come spectacles, optician, lookout, observation and observer."],
   ["“Yol” kökü ise yolcu, yolculuk, yollamak ve yolsuzluk verir.","The root “yol” gives traveller, journey, to send, and corruption."],
   ["Bir ekin anlamını bir kez öğrenen kişi, yüzlerce kelimeyi bir daha sözlükte aramaz.","Someone who learns the meaning of one suffix once will not look up hundreds of words again."],
   ["Bu yüzden Türkçe, ezber dili değil, mantık dilidir.","For this reason Turkish is not a language of rote but of logic."],
   ["Bilmediğiniz bir kelimeyi parçalarına ayırın; çoğu zaman anlamı içinden çıkar.","Take a word you don't know apart into its pieces; most of the time the meaning comes out of it."]],
  gloss:{"ezberlemek":"to memorise","gözlem":"observation","yolsuzluk":"corruption","parçalarına ayırmak":"to take apart","mantık":"logic"}},
 drill:[
  {t:"mc",q:"“kitapçı” is",a:["a library","a bookseller","a bookshelf","a reader"],c:1,why:"-CI makes the doer or seller."},
  {t:"fill",q:"göz + ___ = gözlük (spectacles)",c:"lük",why:"-lIk makes a thing-for."},
  {t:"mc",q:"“anlamsız” means",a:["meaningful","meaningless","meaning","to mean"],c:1,why:"-sIz = without."},
  {t:"order",q:"Build: “In Turkish words are not memorised, they are built.”",w:["Türkçede","kelimeler","ezberlenmez","kurulur"],c:"Türkçede kelimeler ezberlenmez kurulur"},
  {t:"mc",q:"“yolsuzluk” literally breaks down as",a:["road + with + ness","road + without + ness","traveller + ness","to send + ness"],c:1,why:"Roadlessness — the standard word for corruption."}],
 speak:"Take five roots you know and build three words from each out loud, explaining what they mean."},

{id:"b2u1",lv:"B2",n:1,tr:"Yapıldı, yaptırıldı",en:"Built, and had built",focus:"edilgen ve ettirgen çatı",
 vocab:[["yaptırmak","to have built"],["inşa etmek","to construct"],["kubbe","dome"],["mimar","architect"],["yüzyıl","century"],["dönem","period, era"],["onarmak","to repair"],["korumak","to protect"],["ziyaret etmek","to visit"],["eser","work (of art or building)"]],
 gram:{t:"Edilgen ve ettirgen",en:"Passive and causative",
  body:["<b>Passive</b>: <code>-Il</code> after most consonants (<b>yapıl-</b>), <code>-In</code> after l or a vowel (<b>alın-</b>, <b>oku<u>n</u>-</b>). The agent, if named, takes <b>tarafından</b>.",
   "<b>Causative</b>: <code>-DIr</code>, <code>-t</code>, <code>-Ir</code>, <code>-Art</code> — making someone do it. <b>yaz-</b> write → <b>yazdır-</b> have written; <b>öl-</b> die → <b>öldür-</b> kill.",
   "Both can stack, which is very Turkish: <b>yap-tır-ıl-mış</b> — “it was had-built”, the standard formula on every mosque plaque.",
   "Formal written Turkish prefers the passive to a vague subject: <b>Bu eser 1550'de inşa edilmiştir.</b>"],
  tbl:[["yapmak","yapılmak — to be made"],["yapmak","yaptırmak — to have made"],["yazmak","yazdırılmak — to be had written"],["görmek","görülmek / göstermek"],["bilmek","bilinmek — to be known"]],
  eg:[["Bu cami Mimar Sinan tarafından yaptırıldı.","This mosque was built by Mimar Sinan."],["Mektubu ona yazdırdım.","I had him write the letter."],["Her yıl milyonlarca kişi tarafından ziyaret edilmektedir.","It is visited by millions every year."]]},
 read:{t:"Bir kubbenin tarihi",kind:"Özgün bilgilendirici metin",src:"B2 · informative prose written for this course",
  lines:[["Ayasofya, altıncı yüzyılda İmparator Justinianus tarafından yaptırıldı.","Hagia Sophia was built by the Emperor Justinian in the sixth century."],
   ["Devrin iki mimarına, o güne kadar görülmemiş bir kubbe çizdirildi.","Two architects of the age were made to design a dome the like of which had not been seen."],
   ["Yapı, 1453'ten sonra camiye çevrildi ve yüzyıllar boyunca onarıldı.","The building was converted into a mosque after 1453 and was repaired over the centuries."],
   ["Depremlerde zarar gören kubbe, her seferinde yeniden inşa edildi.","The dome, damaged in earthquakes, was rebuilt each time."],
   ["Duvarlardaki mozaikler uzun bir dönem sıva ile kapatıldı; yirminci yüzyılda yeniden açıldı.","The mosaics on the walls were covered with plaster for a long period; in the twentieth century they were uncovered again."],
   ["Bugün bu eser, dünyanın her yerinden gelen ziyaretçiler tarafından görülmektedir.","Today this work is seen by visitors coming from all over the world."],
   ["Korunması, yalnız bir ülkenin değil, ortak bir mirasın meselesidir.","Its protection is the concern not of one country alone but of a shared heritage."]],
  gloss:{"devir":"age, era","çevirmek":"to turn, convert","deprem":"earthquake","sıva":"plaster","miras":"inheritance, heritage","mesele":"matter, question"}},
 drill:[
  {t:"mc",q:"Passive of “yazmak” =",a:["yazdırmak","yazılmak","yazmak","yazınmak"],c:1,why:"-Il after a consonant: yazılmak."},
  {t:"fill",q:"Bu cami 1557'de inşa ed___ . (was built — formal -mIştIr)",c:"ilmiştir",why:"et- → ed- + il + miş + tir."},
  {t:"mc",q:"“Mektubu yazdırdım” means",a:["I wrote the letter","I had the letter written","The letter was written","I will write the letter"],c:1,why:"-DIr is the causative."},
  {t:"order",q:"Build: “It is visited by millions every year.”",w:["Her","yıl","milyonlarca","kişi","tarafından","ziyaret","edilmektedir"],c:"Her yıl milyonlarca kişi tarafından ziyaret edilmektedir"},
  {t:"mc",q:"Why does formal Turkish favour the passive?",a:["It is shorter","It avoids naming a subject and sounds impersonal","It is older","It avoids harmony"],c:1,why:"Plaques, laws and academic prose all lean on it."}],
 speak:"Describe a building in your town in the passive: when it was built, by whom, what has been done to it since."},

{id:"b2u2",lv:"B2",n:2,tr:"Yapmalıyım",en:"I must",focus:"gereklilik · zorunda · -sA da",
 vocab:[["gerekmek","to be necessary"],["zorunda","obliged to"],["ihtiyaç","need"],["alışkanlık","habit"],["sabır","patience"],["düzenli","regular"],["tekrar etmek","to repeat"],["ilerlemek","to progress"],["hata","mistake"],["cesaret","courage"]],
 gram:{t:"Gereklilik",en:"Necessity, obligation, concession",
  body:["<code>-mAlI</code> — internal obligation, what I ought to do: <b>çalışmalıyım</b>.",
   "<b>zorunda / mecbur</b> — external obligation, no choice: <b>gitmek zorundayım</b>, I have to go.",
   "<b>gerek / lazım</b> with the verbal noun: <b>gitmem gerek</b>, I need to go — literally “my going is necessary”.",
   "Concession: <code>-sA da</code> — even if: <b>yorgun olsam da geleceğim.</b> And <code>-mAsInA rağmen</code> — despite: <b>yorgun olmasına rağmen geldi.</b>"],
  tbl:[["çalışmalıyım","I ought to work"],["çalışmam gerek","I need to work"],["çalışmak zorundayım","I am forced to work"],["çalışmasam da","even if I don't work"],["çalışmasına rağmen","despite working"]],
  eg:[["Daha çok dinlemelisin.","You should listen more."],["Bugün erken çıkmak zorundayım.","I have to leave early today."],["Zor olsa da vazgeçmedim.","Even though it was hard, I didn't give up."]]},
 read:{t:"Bir dil nasıl öğrenilir?",kind:"Özgün deneme",src:"B2 · essay written for this course",
  lines:[["Bir dili öğrenmek isteyen kişi, önce sabırlı olmayı öğrenmelidir.","Whoever wants to learn a language must first learn to be patient."],
   ["Günde on dakika okumak, haftada bir kez üç saat çalışmaktan çok daha etkilidir.","Reading ten minutes a day is far more effective than studying three hours once a week."],
   ["Hata yapmaktan korkmamak gerekir; hata yapmayan kişi konuşmuyor demektir.","One should not be afraid of making mistakes; a person who makes none is not speaking at all."],
   ["Kelime ezberlemek zorunda kalsanız da, kelimeleri cümle içinde öğrenmek daha kalıcıdır.","Even if you have to memorise words, learning them inside sentences lasts longer."],
   ["Zor olmasına rağmen, her gün biraz okumak alışkanlık hâline gelir.","Although it is hard, reading a little every day becomes a habit."],
   ["İlerlediğinizi fark etmeseniz bile ilerlemektesiniz.","Even if you don't notice that you are progressing, you are progressing."],
   ["Asıl mesele cesaret: bildiğiniz kadarıyla konuşmaya başlamalısınız.","The real question is courage: you must start speaking with what you know."]],
  gloss:{"etkili":"effective","kalıcı":"lasting","hâline gelmek":"to turn into","asıl":"the real, the main","bildiğiniz kadarıyla":"as far as you know"}},
 drill:[
  {t:"mc",q:"“I have no choice but to go.” =",a:["Gitmeliyim.","Gitmek zorundayım.","Gitsem de.","Gideceğim."],c:1,why:"zorunda = external compulsion."},
  {t:"fill",q:"Daha çok çalış___ . (you ought to work)",c:"malısın",why:"-mAlI + -sIn."},
  {t:"mc",q:"“Yorgun olmasına rağmen geldi.” =",a:["He came because he was tired","He came although he was tired","He was tired so he didn't come","If he is tired he will come"],c:1,why:"-mAsInA rağmen = despite."},
  {t:"order",q:"Build: “One should not be afraid of making mistakes.”",w:["Hata","yapmaktan","korkmamak","gerekir"],c:"Hata yapmaktan korkmamak gerekir"},
  {t:"mc",q:"“Gitmem gerek” literally means",a:["I must go","my going is necessary","let me go","I was going to go"],c:1,why:"Verbal noun + possessive + gerek."}],
 speak:"Give five pieces of advice with -mAlI, then three things you are obliged to do with zorunda."},

{id:"b2u3",lv:"B2",n:3,tr:"İstanbul'da bir akşam",en:"An evening in Istanbul",focus:"bağlaçlar · -DIktAn sonra · -DIğI için",
 vocab:[["vapur","ferry"],["iskele","landing stage"],["martı","seagull"],["kalabalık","crowd"],["sokak lambası","street lamp"],["susmak","to fall silent"],["karşı kıyı","the opposite shore"],["alacakaranlık","dusk"],["ıslak","wet"],["ömür","life, lifetime"]],
 gram:{t:"Cümleleri bağlamak",en:"Linking longer sentences",
  body:["Reason: <code>-DIğI için</code> — <b>geç kaldığım için</b>, because I was late. Also <b>çünkü</b> (after the clause) and <b>bu yüzden</b> (so).",
   "Time: <code>-DIktAn sonra</code>, <code>-mAdAn önce</code>, <code>-DIğI zaman / -DIğIndA</code>, <code>-(y)AlI</code> (since).",
   "Contrast: <b>ama, fakat, ancak, oysa, hâlbuki, buna rağmen</b>. <b>ancak</b> is the formal “however”.",
   "Addition: <b>hem… hem…, ne… ne…, ya… ya…, sadece… değil, aynı zamanda…</b>"],
  tbl:[["-DIğI için","because"],["-DIktAn sonra","after"],["-mAdAn önce","before"],["-DIğIndA","when"],["-(y)AlI","ever since"],["ancak / oysa","however / whereas"]],
  eg:[["Yağmur yağdığı için çıkmadık.","We didn't go out because it was raining."],["Vapur kalktıktan sonra sustu.","After the ferry left, he fell silent."],["Hem yorgun hem mutluydu.","He was both tired and happy."]]},
 read:{t:"Vapur",kind:"Uyarlama · Ahmet Rasim'in İstanbul yazılarından esinlenilmiştir",src:"B2 · in the manner of Ahmet Rasim (1864–1932), written for this course",
  note:"Ahmet Rasim wrote thousands of short newspaper sketches of daily Istanbul life. This passage is not his text but is written in that tradition — the ferry sketch is a genre of its own in Turkish prose.",
  lines:[["Akşam vapuru iskeleden kalktıktan sonra şehir birden küçüldü.","After the evening ferry left the landing stage, the city suddenly grew small."],
   ["Hava soğuk olduğu için çoğu yolcu içeri girdi; ben güvertede kaldım.","Because the air was cold most passengers went inside; I stayed on deck."],
   ["Martılar, ekmek atan çocukların etrafında dönüyordu.","The seagulls were wheeling around the children who were throwing bread."],
   ["Karşı kıyının lambaları, biz yaklaştıkça birer birer yandı.","The lamps of the opposite shore came on one by one as we drew nearer."],
   ["Ne konuşan vardı ne de konuşmak isteyen; herkes susmuştu.","There was neither anyone talking nor anyone wishing to; everyone had fallen silent."],
   ["Alacakaranlıkta deniz, hem kurşun rengi hem de ılıktı.","At dusk the sea was both lead-coloured and warm."],
   ["İstanbul'u anlamak isteyen kişi, bir kez olsun bu vapura binmelidir.","Anyone who wants to understand Istanbul should board this ferry at least once."],
   ["Çünkü bu şehir, karadan değil, sudan bakıldığında kendini anlatır.","Because this city tells itself not when seen from land, but from the water."]],
  gloss:{"güverte":"deck","yaklaştıkça":"as we drew nearer","kurşun rengi":"lead-coloured","ılık":"lukewarm","bir kez olsun":"at least once"}},
 drill:[
  {t:"mc",q:"“Because it was raining, we didn't go out.” =",a:["Yağmur yağdı için çıkmadık.","Yağmur yağdığı için çıkmadık.","Yağmur yağdıktan sonra çıkmadık.","Yağmur yağarsa çıkmadık."],c:1,why:"-DIK + possessive + için."},
  {t:"fill",q:"Yemek ye___ sonra çıktık. (after eating)",c:"dikten",why:"-DIktAn sonra."},
  {t:"mc",q:"“ne … ne …” means",a:["either … or","both … and","neither … nor","not only … but also"],c:2,why:"And the verb stays positive in Turkish."},
  {t:"order",q:"Build: “Anyone who wants to understand Istanbul should board this ferry.”",w:["İstanbul'u","anlamak","isteyen","bu","vapura","binmelidir"],c:"İstanbul'u anlamak isteyen bu vapura binmelidir"},
  {t:"mc",q:"“yaklaştıkça” means",a:["although we approached","as we approached, more and more","before we approached","if we approach"],c:1,why:"-DIkçA = the more … the more."}],
 speak:"Describe an evening journey of your own in eight linked sentences, using -DIktAn sonra, -DIğI için and one hem…hem."},

{id:"b2u4",lv:"B2",n:4,tr:"Deyimler",en:"Idioms",focus:"deyimler ve mecaz",
 vocab:[["göz atmak","to glance at"],["kulak asmamak","to pay no heed"],["eli açık","generous"],["ağzı sıkı","discreet, tight-lipped"],["kafa yormak","to rack one's brains"],["burnu büyük","arrogant"],["etekleri zil çalmak","to be overjoyed"],["pabucu dama atılmak","to be cast aside"],["göze girmek","to win favour"],["ipe un sermek","to make excuses"]],
 gram:{t:"Beden sözlüğü",en:"The body as a dictionary",
  body:["Turkish idiom is built overwhelmingly on body parts. Learn them in families and hundreds fall into place at once.",
   "<b>göz</b> (eye): göz atmak glance, göze girmek win favour, gözü kara reckless, göz yummak turn a blind eye.",
   "<b>el</b> (hand): eli açık generous, el atmak take on, elden çıkarmak get rid of, eli boş empty-handed.",
   "<b>kafa / baş</b>: kafa yormak think hard, başa çıkmak cope, baş göz etmek marry off.",
   "An idiom is fixed: you cannot change its parts. <b>kulak asmamak</b> exists; <i>kulak koymamak</i> does not."],
  tbl:[["göz","atmak, yummak, girmek"],["el","açık, atmak, çıkarmak"],["ağız","sıkı, açmak, aramak"],["kulak","asmamak, kabartmak"],["ayak","uydurmak, diremek"]],
  eg:[["Raporuna bir göz attım.","I glanced at your report."],["Sözlerime kulak asmadı.","He paid no attention to what I said."],["Bu işe çok kafa yordum.","I racked my brains over this."]]},
 read:{t:"Yeni komşu",kind:"Özgün metin · deyim yoğun anlatı",src:"B2 · idiom-dense narrative written for this course",
  lines:[["Yeni komşumuz taşındığı gün herkes perdenin arkasından göz attı.","The day our new neighbour moved in, everyone glanced out from behind the curtains."],
   ["Kapıcı, adamın burnu büyük olduğunu söyledi; ama kimse ona kulak asmadı.","The caretaker said the man was arrogant, but nobody paid him any heed."],
   ["Bir hafta sonra apartmanın bozuk asansörüne el attı ve masrafı kendi ödedi.","A week later he took on the building's broken lift and paid the cost himself."],
   ["Meğer eli açık, ama ağzı sıkı bir adammış: yardım eder, sonra hiç konuşmazmış.","It turned out he was a generous man but a discreet one: he would help, then never speak of it."],
   ["Kapıcının pabucu bir anda dama atıldı; artık kimse onun dedikodusuna inanmıyordu.","The caretaker was cast aside in an instant; nobody believed his gossip any more."],
   ["Komşumuz kısa sürede herkesin gözüne girdi.","In a short time our neighbour won everyone's favour."],
   ["Şimdi biri onun hakkında kötü bir şey söylese, apartmanın etekleri zil çalmıyor artık.","Now if someone says something bad about him, the building is no longer delighted to hear it."],
   ["Çünkü iyilik, ipe un sermeyen insanların dilidir.","Because kindness is the language of people who do not make excuses."]],
  gloss:{"taşınmak":"to move house","kapıcı":"building caretaker","masraf":"expense","dedikodu":"gossip","iyilik":"kindness"}},
 drill:[
  {t:"mc",q:"“kulak asmamak” =",a:["to go deaf","to pay no attention","to whisper","to eavesdrop"],c:1,why:"Literally “not to hang an ear”."},
  {t:"mc",q:"Someone who is “eli açık” is",a:["clumsy","generous","unemployed","talkative"],c:1,why:"Open-handed."},
  {t:"fill",q:"Raporuna bir göz ___ . (I glanced at it)",c:"attım",why:"göz atmak, past first person."},
  {t:"order",q:"Build: “He won everyone's favour in a short time.”",w:["Kısa","sürede","herkesin","gözüne","girdi"],c:"Kısa sürede herkesin gözüne girdi"},
  {t:"mc",q:"“pabucu dama atıldı” describes someone who has",a:["lost their shoes","been replaced or dropped","climbed a roof","become rich"],c:1,why:"The shoe on the roof: no longer wanted."}],
 speak:"Tell a short story about a neighbour or colleague using at least six idioms from this unit."},

{id:"b2u5",lv:"B2",n:5,tr:"Dedi ki",en:"He said that",focus:"aktarım · nasihat metinleri",
 vocab:[["nasihat","counsel, advice"],["öğüt","advice"],["tüccar","merchant"],["yolcu","traveller"],["servet","fortune"],["akıl","reason, wisdom"],["denemek","to test"],["pişman","regretful"],["kıymet","value"],["uymak","to follow, comply"]],
 gram:{t:"Söz aktarımı",en:"Reporting what was said",
  body:["<b>Direct</b>: the words unchanged plus <b>dedi</b> — <b>“Geleceğim,” dedi.</b> Turkish puts <i>dedi</i> after the quotation.",
   "<b>Indirect</b>: nominalise it — <b>Geleceğini söyledi.</b> He said that he would come.",
   "<b>söylemek</b> takes the nominalised clause; <b>demek</b> takes direct speech or <b>… diye</b>: <b>Gel diye bağırdı.</b>",
   "<b>ki</b> lets you keep the original order for emphasis, an older and more literary frame: <b>Dedi ki: bu iş olmaz.</b>",
   "Reporting a command: <b>gitmemi söyledi</b> — he told me to go."],
  tbl:[["“Geliyorum,” dedi.","direct"],["Geldiğini söyledi.","indirect, past"],["Geleceğini söyledi.","indirect, future"],["Gitmemi söyledi.","told me to go"],["Dedi ki…","literary frame"]],
  eg:[["Hasta olduğunu söyledi.","He said he was ill."],["Bana beklememi söyledi.","He told me to wait."],["“Ne olur gitme,” dedi.","“Please don't go,” he said."]]},
 read:{t:"Üç nasihat",kind:"Uyarlama · halk hikâyesi geleneğinden",src:"B2 · retold from the traditional tale for this course",
  note:"The three-counsels tale travels across the whole Islamic literary world and turns up in Turkish folk collections and in Ömer Seyfettin's generation of short-story writers. This retelling is written for this course.",
  lines:[["Yaşlı bir tüccar, ölmeden önce oğluna üç nasihat verdiğini söylemiş.","An old merchant said that before dying he had given his son three counsels."],
   ["Birincisi: kimseye, hakkında hiçbir şey bilmediğin bir konuda söz verme, demiş.","The first: do not give your word, he said, on a matter you know nothing about."],
   ["İkincisi: öfkeliyken karar verme; öfke geçer, karar kalır.","The second: do not decide while angry; anger passes, the decision remains."],
   ["Üçüncüsü: kıymetini bilmediğin bir şeyi, bir başkası istedi diye satma.","The third: do not sell a thing whose value you do not know just because someone else wants it."],
   ["Oğul, babasının haklı olduğunu yıllar sonra anlamış.","The son understood that his father had been right only years later."],
   ["Çünkü üç nasihate de uymadığını, her seferinde pişman olduğunda fark etmiş.","Because he noticed that he had followed none of the three counsels each time he came to regret it."],
   ["Sonunda kendi oğluna dönüp demiş ki: “Ben sana bunları söyleyeceğim, ama sen yine de deneyeceksin.”","In the end he turned to his own son and said: “I shall tell you these things, but you will try them anyway.”"],
   ["Akıl, aktarılan bir servet değil, tekrar tekrar kazanılan bir şeymiş.","Wisdom, it seems, is not a fortune handed down but something earned over and over."]],
  gloss:{"söz vermek":"to give one's word","öfke":"anger","haklı":"in the right","yine de":"all the same","aktarılmak":"to be handed on"}},
 drill:[
  {t:"mc",q:"“He said he was ill.” =",a:["“Hastayım,” söyledi.","Hasta olduğunu söyledi.","Hasta dedi ki.","Hastalığını dedi."],c:1,why:"söylemek takes the nominalised clause."},

  {t:"order",q:"Build: “He said that his father had been right.”",w:["Babasının","haklı","olduğunu","söyledi"],c:"Babasının haklı olduğunu söyledi"},
  {t:"mc",q:"The tale's closing point is that wisdom",a:["can be inherited","must be re-earned by each person","is useless","belongs to merchants"],c:1,why:"“…tekrar tekrar kazanılan bir şey”."}],
 speak:"Report a conversation you had this week twice: once in direct speech, once entirely indirect."},

{id:"b2u6",lv:"B2",n:6,tr:"Söylenenlere göre",en:"By all accounts",focus:"rivayet birleşik zaman -mIş + imiş",
 vocab:[["söylenti","rumour"],["dedikodu","gossip"],["iddia","claim"],["güvenilir","reliable"],["kaynak","source"],["yaymak","to spread"],["duyulmak","to be heard of"],["abartmak","to exaggerate"],["doğrulamak","to confirm"],["yalanlamak","to deny"]],
 gram:{t:"Rivayet birleşik zaman",en:"Stacking -mIş onto another tense",
  body:["Any tense can be put at second hand by adding <b>-(y)mIş</b>: <b>geliyormuş</b> (they say he's coming), <b>gelecekmiş</b>, <b>gelirmiş</b>, <b>gelmeliymiş</b>, <b>zenginmiş</b>.",
   "This is not the same as plain <b>geldi → gelmiş</b>. Here the <i>whole</i> tense is reported: <b>Dün akşam çalışıyormuş</b> — apparently he was working last night.",
   "The same slot takes <b>-(y)DI</b> for narration (<b>geliyordu</b>) and <b>-(y)sA</b> for condition (<b>geliyorsa</b>). Three moods, one slot.",
   "Reporting frames: <b>söylendiğine göre, duyduğuma göre, iddiaya göre, güya, sözde, sözüm ona</b> — the last three are openly sceptical.",
   "In journalism the neutral frame is <b>…-DIğI öne sürüldü / bildirildi / açıklandı</b>."],
  tbl:[["geliyormuş","apparently coming"],["gelecekmiş","apparently will come"],["gelirmiş","apparently does come"],["gelmiş olmalıymış","apparently must have come"],["güya","supposedly"]],
  eg:[["Duyduğuma göre taşınıyorlarmış.","From what I hear they're moving."],["Güya çok zenginmiş.","He's supposedly very rich."],["Toplantı ertelenmiş.","The meeting has been postponed, apparently."]]},
 read:{t:"Mahallede konuşulanlar",kind:"Özgün metin · narrative",src:"B2 · 80 kelime",
  lines:[["Köşedeki eski evi bir şirket almış; yıkacaklarmış.","A company has apparently bought the old house on the corner; they are going to pull it down."],
   ["Kimin söylediği belli değil, ama herkes biliyormuş.","Who said it is not clear, but everyone apparently knows."],
   ["Bakkal, adamların geçen hafta ölçü aldığını görmüş.","The grocer saw the men taking measurements last week."],
   ["Kapıcıya göre yerine sekiz katlı bir bina yapılacakmış.","According to the caretaker an eight-storey building is to be put up in its place."],
   ["Güya belediye izin vermemiş, ama kimse belgeyi görmemiş.","The council supposedly refused permission, but nobody has seen the document."],
   ["Söylenti yayıldıkça büyüyor; her anlatan bir kat ekliyor.","As the rumour spreads it grows; each teller adds a storey."],
   ["Sonunda kimse ne duyduğunu değil, ne duymak istediğini anlatır oldu.","In the end nobody was relating what they had heard but what they wanted to hear."]],
  gloss:{"yıkmak":"to demolish","ölçü almak":"to take measurements","belediye":"municipality","belge":"document","kat":"storey; layer"}},
 drill:[
  {t:"mc",q:"“Apparently he is coming.” =",a:["Geliyor.","Geliyormuş.","Gelmiş.","Gelirmiş."],c:1,why:"The whole present tense is reported."},
  {t:"fill",q:"Toplantı ertelen___ . (has apparently been postponed)",c:"miş",why:"Passive + -mIş."},
  {t:"mc",q:"“Güya” adds",a:["certainty","open scepticism","politeness","urgency"],c:1,why:"So-called, supposedly."},
  {t:"order",q:"Build: “From what I hear they are moving.”",w:["Duyduğuma","göre","taşınıyorlarmış"],c:"Duyduğuma göre taşınıyorlarmış"},
  {t:"mc",q:"The three suffixes that share one slot after a tense are",a:["-mAk, -mA, -Iş","-(y)mIş, -(y)DI, -(y)sA","-lAr, -lIk, -lI","-DIr, -CI, -CA"],c:1,why:"Report, narrate, condition."}],
 speak:"Report five things you have heard second-hand, marking each with a different degree of scepticism."},

{id:"b2u7",lv:"B2",n:7,tr:"Tam o sırada",en:"Just at that moment",focus:"-IncA · -DIğIndA · -ken · -DIkçA",
 vocab:[["sıra","turn; moment"],["anda","in the instant"],["ansızın","all of a sudden"],["gürültü","noise"],["avlu","courtyard"],["seslenmek","to call out"],["telaş","fluster, rush"],["şaşırmak","to be astonished"],["koşuşmak","to run about"],["yatışmak","to calm down"]],
 gram:{t:"Zaman farkları",en:"Four ways to say “when”",
  body:["<code>-(y)IncA</code> — as soon as, on doing. Neutral and very common: <b>eve gelince</b>.",
   "<code>-DIğIndA</code> — when, at the time that. Slightly more formal and more precise about the occasion: <b>eve geldiğinde</b>.",
   "<code>-(y)ken</code> — while, in the middle of: <b>eve gelirken</b> (on the way home) — note this is the aorist stem, not the past.",
   "<code>-DIkçA</code> — whenever / the more: <b>eve geldikçe</b> (each time he comes).",
   "<code>-DIğI sırada / anda / zaman</code> — pinning the exact moment. And <code>-(y)AlI</code> for “ever since”.",
   "Careful: <b>gelince</b> and <b>gelirken</b> are not interchangeable — one is the arrival, the other the journey."],
  tbl:[["-(y)IncA","as soon as"],["-DIğIndA","when"],["-(y)ken","while"],["-DIkçA","whenever / the more"],["-DIğI anda","the instant that"],["-(y)AlI","ever since"]],
  eg:[["Kapıyı açınca herkes sustu.","When he opened the door everyone fell silent."],["Ben çıkarken o giriyordu.","As I was leaving he was coming in."],["Onu gördükçe annesini hatırlıyorum.","Every time I see him I remember his mother."]]},
 read:{t:"Avludaki telaş",kind:"Uyarlama · Hüseyin Rahmi Gürpınar'ın mahalle sahneleri geleneğinde",src:"B2 · written in that tradition for this course",
  note:"Hüseyin Rahmi Gürpınar (1864–1944) built his novels out of Istanbul courtyard life — neighbours, noise and comedy. This scene is written in that manner rather than taken from him.",
  lines:[["Öğle sıcağında avlu sessizdi; kadınlar pencerelerini açmış, perdelerini indirmişti.","In the noon heat the courtyard was silent; the women had opened their windows and lowered their curtains."],
   ["Ben tam merdivenden inerken üst kattan bir gürültü koptu.","Just as I was coming down the stairs a noise broke out from the upper floor."],
   ["Kapı açılınca herkes bir anda avluya döküldü.","When the door opened everyone poured into the courtyard at once."],
   ["Komşu kadın, oğlunun sesini duyduğu anda elindeki tabağı düşürdü.","The neighbour woman dropped the plate in her hand the instant she heard her son's voice."],
   ["Telaş büyüdükçe kimse kimseyi dinlemiyordu.","As the fluster grew nobody was listening to anybody."],
   ["Sonra, olayın ne olduğu anlaşıldığında, hepsi birden güldü.","Then, when it became clear what the incident was, they all laughed at once."],
   ["Çocuk sadece tavandaki kediyi indirmeye çalışıyormuş.","The boy had only been trying to get the cat down from the ceiling beam."],
   ["O günden beri avluya her girdiğimde o kahkahayı hatırlarım.","Ever since that day, every time I enter the courtyard I remember that laughter."]],
  gloss:{"indirmek":"to lower, take down","kopmak":"to break out","dökülmek":"to pour out","tavan":"ceiling","kahkaha":"laughter"}},
 drill:[
  {t:"mc",q:"“As I was leaving…” =",a:["Çıkınca","Çıkarken","Çıktığımda","Çıktıkça"],c:1,why:"-ken is the ongoing journey, not the moment."},
  {t:"fill",q:"Kapıyı aç___ herkes sustu. (as soon as he opened)",c:"ınca",why:"-(y)IncA."},
  {t:"mc",q:"“Onu gördükçe” =",a:["when I saw him","every time I see him","before I saw him","although I saw him"],c:1,why:"-DIkçA is repeated occasion."},
  {t:"order",q:"Build: “The instant she heard her son's voice she dropped the plate.”",w:["Oğlunun","sesini","duyduğu","anda","tabağı","düşürdü"],c:"Oğlunun sesini duyduğu anda tabağı düşürdü"},
  {t:"mc",q:"“O günden beri” means",a:["until that day","ever since that day","on that day","because of that day"],c:1,why:"-DAn beri marks the starting point."}],
 speak:"Narrate an incident using all four “when” forms, and say aloud why each one fits where it does."},

{id:"b2u8",lv:"B2",n:8,tr:"Türk kahvesi",en:"Turkish coffee",focus:"isim tamlamaları · zincirleme",
 vocab:[["fincan","small cup"],["telve","coffee grounds"],["köpük","foam"],["kavurmak","to roast"],["öğütmek","to grind"],["demlemek","to brew"],["gelenek","tradition"],["ikram","offering, hospitality"],["yudum","sip"],["tat","taste"]],
 gram:{t:"İsim tamlaması",en:"Noun + noun, and the difference a suffix makes",
  body:["<b>Belirtisiz</b> (indefinite) — a kind of thing. Only the second noun is marked: <b>Türk kahve<u>si</u></b> (Turkish coffee, the genre), <b>ders kitabı</b>, <b>otobüs durağı</b>.",
   "<b>Belirtili</b> (definite) — a particular thing belonging to a particular owner. Both are marked: <b>Türk'<u>ün</u> kahve<u>si</u></b> (the Turk's coffee), <b>öğretmen<u>in</u> kitab<u>ı</u></b>.",
   "The difference is real: <b>çocuk odası</b> is a nursery; <b>çocuğun odası</b> is that child's room.",
   "<b>Zincirleme</b> — the chain. Turkish stacks them freely: <b>Türk Dil Kurumu Başkanlığı</b>, <b>İstanbul Üniversitesi Edebiyat Fakültesi</b>. Read them from the end backwards.",
   "A plural inside a chain marks the whole class: <b>öğrenci işleri</b>, <b>dış ilişkiler</b>."],
  tbl:[["Türk kahvesi","Turkish coffee (a kind)"],["Türk'ün kahvesi","the Turk's coffee"],["çocuk odası","a nursery"],["çocuğun odası","that child's room"],["otobüs durağı","bus stop"]],
  eg:[["Kahve fincanı boş.","The coffee cup is empty."],["Kahvenin fincanı nerede?","Where is the cup of the coffee?"],["Beyoğlu Belediyesi Kültür Müdürlüğü","the Culture Directorate of Beyoğlu Municipality"]]},
 read:{t:"Bir fincanın kırk yıl hatırı",kind:"Özgün bilgilendirici metin · geleneksel deyişle",src:"B2 · informative prose written for this course",
  lines:[["Türk kahvesinin hazırlanışı, kahve çekirdeğinin kavrulmasıyla başlar.","The preparation of Turkish coffee begins with the roasting of the coffee bean."],
   ["Çekirdekler toz hâline gelinceye kadar öğütülür; bu incelik, köpüğün sırrıdır.","The beans are ground until they become powder; this fineness is the secret of the foam."],
   ["Cezvedeki su ısınırken kahve ve şeker eklenir, kaynatılmaz.","While the water in the pot heats, the coffee and sugar are added, and it is not boiled."],
   ["Fincanın üstünde köpük yoksa, ev sahibi utanır — gelenek böyledir.","If there is no foam on top of the cup, the host is ashamed — such is the tradition."],
   ["Kahve, yanında bir bardak su ve bir lokum ile ikram edilir.","The coffee is served with a glass of water and a piece of lokum beside it."],
   ["Telve fincanın dibinde kalır; kimileri onunla fal bakar.","The grounds stay at the bottom of the cup; some read fortunes in them."],
   ["“Bir fincan kahvenin kırk yıl hatırı vardır” sözü, misafirlik kültürünün özetidir.","The saying “a cup of coffee is remembered for forty years” is the summary of the culture of hospitality."]],
  gloss:{"çekirdek":"bean, seed","cezve":"the long-handled coffee pot","kaynatmak":"to boil","ev sahibi":"host","lokum":"Turkish delight","fal bakmak":"to read fortunes"}},
 drill:[
  {t:"mc",q:"“a nursery (children's room)” =",a:["çocuğun odası","çocuk odası","çocuk oda","odanın çocuğu"],c:1,why:"Indefinite compound: only the second noun marked."},
  {t:"fill",q:"öğretmen___ kitabı (the teacher's book)",c:"in",why:"Definite compound marks the owner too."},
  {t:"mc",q:"“otobüs durağı” is",a:["the bus's stop","a bus stop (a kind of thing)","stopping the bus","at the bus stop"],c:1,why:"A category, not a possession."},
  {t:"order",q:"Build: “The preparation of Turkish coffee begins with roasting.”",w:["Türk","kahvesinin","hazırlanışı","kavurmayla","başlar"],c:"Türk kahvesinin hazırlanışı kavurmayla başlar"},
  {t:"mc",q:"A long chain like “İstanbul Üniversitesi Edebiyat Fakültesi” is read",a:["left to right","from the end backwards","alphabetically","by the plural"],c:1,why:"The Faculty of Letters of the University of Istanbul."}],
 speak:"Describe how a drink or dish is made in your own culture, using at least six noun compounds."},

{id:"b2u9",lv:"B2",n:9,tr:"Yavaş yavaş",en:"Little by little",focus:"ikilemeler · pekiştirme",
 vocab:[["ikileme","reduplication, word pair"],["derin","deep"],["ıssız","deserted"],["şırıl şırıl","babbling (of water)"],["mırıl mırıl","murmuring"],["paramparça","in pieces"],["apar topar","in a great rush"],["er geç","sooner or later"],["ara sıra","now and then"],["tıka basa","stuffed full"]],
 gram:{t:"İkilemeler",en:"Word pairs, the texture of Turkish",
  body:["Turkish doubles words constantly, and the pairs are fixed — you cannot invent or reorder them.",
   "<b>Same word twice</b> — manner or gradualness: <b>yavaş yavaş</b>, <b>güzel güzel</b>, <b>koşa koşa</b>, <b>bakına bakına</b>.",
   "<b>Near-opposites</b> — approximation or totality: <b>er geç</b>, <b>aşağı yukarı</b>, <b>iyi kötü</b>, <b>ölüm kalım</b>.",
   "<b>Rhyming or m-pairs</b> — “and such”: <b>çoluk çocuk</b>, <b>eski püskü</b>, <b>kitap mitap</b> (books and stuff). The m-pair is dismissive.",
   "<b>Sound words</b> — <b>şırıl şırıl</b>, <b>gümbür gümbür</b>, <b>fısıl fısıl</b>; Turkish has hundreds and they are ordinary prose, not baby talk.",
   "<b>Intensified adjectives</b> double the first syllable with a consonant: <b>apaçık</b>, <b>simsiyah</b>, <b>yemyeşil</b>, <b>tertemiz</b>."],
  tbl:[["yavaş yavaş","gradually"],["er geç","sooner or later"],["eski püskü","old and tattered"],["şırıl şırıl","babbling"],["tertemiz","spotless"],["apar topar","in a rush"]],
  eg:[["Çocuklar koşa koşa geldi.","The children came running."],["Ev tertemizdi.","The house was spotless."],["Apar topar çıktık.","We left in a great rush."]]},
 read:{t:"Yayla sabahı",kind:"Özgün tasvir metni",src:"B2 · descriptive prose written for this course",
  lines:[["Yayla sabahları ıssız ve yemyeşildir.","Mornings on the high pasture are deserted and deep green."],
   ["Dere, taşların arasından şırıl şırıl akar.","The stream runs babbling between the stones."],
   ["Kadınlar erkenden kalkar, mırıl mırıl konuşarak süt sağar.","The women get up early and milk, talking in murmurs."],
   ["Çoluk çocuk, eski püskü hırkalarla ateşin başında toplanır.","Young and old gather round the fire in old and tattered cardigans."],
   ["Sis ağır ağır kalkar; dağın tepesi bir anda apaçık görünür.","The mist lifts slowly; the mountain top is all at once utterly clear."],
   ["Öğleye doğru herkes tıka basa yer ve gölgede uzanır.","Towards noon everyone eats their fill and stretches out in the shade."],
   ["Akşam olunca, er geç, aynı sessizlik geri gelir.","When evening comes, sooner or later, the same silence returns."]],
  gloss:{"yayla":"high summer pasture","dere":"stream","sağmak":"to milk","hırka":"cardigan","sis":"mist","gölge":"shade"}},
 drill:[
  {t:"mc",q:"“apar topar” means",a:["carefully","in a great rush","one by one","little by little"],c:1,why:"Headlong, without preparation."},
  {t:"fill",q:"Ev ___ temizdi. (spotless — intensified)",c:"ter",why:"tertemiz: the doubled first syllable with r."},
  {t:"mc",q:"“kitap mitap” conveys",a:["many books","books and such, dismissively","a book title","two books"],c:1,why:"The m-pair is casual and slightly dismissive."},
  {t:"order",q:"Build: “The children came running.”",w:["Çocuklar","koşa","koşa","geldi"],c:"Çocuklar koşa koşa geldi"},
  {t:"mc",q:"“er geç” =",a:["early morning","sooner or later","never","at once"],c:1,why:"A near-opposite pair meaning inevitability."}],
 speak:"Describe a place you know well in eight sentences, using at least six word pairs."},

{id:"b2u10",lv:"B2",n:10,tr:"Resmî yazı",en:"Writing formally",focus:"dilekçe · e-posta · resmî üslup",
 vocab:[["dilekçe","petition, formal application"],["başvuru","application"],["ilgili","concerned, relevant"],["ekte","attached"],["arz etmek","to submit respectfully"],["talep","request"],["gereği","what is required"],["saygılarımla","yours sincerely"],["imza","signature"],["tarih","date"]],
 gram:{t:"Resmî yazının kalıpları",en:"The fixed frames of official writing",
  body:["A <b>dilekçe</b> is a fixed genre. It opens with the office addressed in capitals, states the request in one sentence, and closes with a set formula.",
   "The classic closing is <b>Gereğini arz ederim.</b> or <b>Gereğinin yapılmasını saygılarımla arz ederim.</b> — and it is always first person singular.",
   "E-mail is softer but still formal: <b>Sayın … Bey / Hanım,</b> → <b>… konusunda bilgi almak istiyorum.</b> → <b>İlginiz için teşekkür ederim.</b> → <b>Saygılarımla,</b>",
   "Register markers: passive throughout, <b>-mAktAdIr</b>, <b>tarafımdan / tarafınızca</b>, <b>ekte sunulmuştur</b>, <b>ilgi: … sayılı yazınız</b>.",
   "Never use <b>-DIr</b> or <b>arz ederim</b> in a message to a friend; it reads as a joke."],
  tbl:[["Sayın … ,","Dear …"],["… arz ederim.","I respectfully submit"],["Ekte sunulmuştur.","It is attached herewith"],["Gereğini rica ederim.","I request that the necessary be done"],["Saygılarımla","Yours sincerely"]],
  eg:[["Konuyla ilgili belgeler ekte sunulmuştur.","The documents concerning the matter are attached."],["Başvurumun değerlendirilmesini arz ederim.","I submit my application for consideration."],["İlginiz için şimdiden teşekkür ederim.","Thank you in advance for your attention."]]},
 read:{t:"İki metin",kind:"Özgün örnek metinler",src:"B2 · model petition and e-mail",
  lines:[["ANKARA ÜNİVERSİTESİ REKTÖRLÜĞÜNE","TO THE RECTORATE OF ANKARA UNIVERSITY"],
   ["Üniversitenizin Türkoloji bölümünde açılan yaz kursuna katılmak istiyorum.","I wish to take part in the summer course opened in your university's Turcology department."],
   ["Gerekli belgeler dilekçemin ekinde sunulmuştur.","The necessary documents are submitted attached to my petition."],
   ["Başvurumun değerlendirilmesi hususunda gereğini saygılarımla arz ederim.","I respectfully submit that the necessary be done regarding the consideration of my application."],
   ["Sayın Yılmaz Bey,","Dear Mr Yılmaz,"],
   ["Geçen hafta görüştüğümüz proje hakkında bilgi almak istiyorum.","I would like to get information about the project we discussed last week."],
   ["Uygun olduğunuz bir zamanda kısa bir toplantı yapabilir miyiz?","Could we have a short meeting at a time convenient for you?"],
   ["İlginiz için teşekkür eder, iyi çalışmalar dilerim. Saygılarımla,","Thank you for your attention and I wish you good work. Yours sincerely,"]],
  gloss:{"rektörlük":"rectorate","husus":"matter, point","uygun":"suitable","iyi çalışmalar":"a standard sign-off to a working colleague"}},
 drill:[
  {t:"mc",q:"A dilekçe normally closes with",a:["Görüşürüz.","Gereğini arz ederim.","Kolay gelsin.","Sevgiler."],c:1,why:"Fixed and invariable."},
  {t:"fill",q:"Belgeler ekte ___ . (are submitted)",c:"sunulmuştur",why:"Passive + formal -mIştIr."},
