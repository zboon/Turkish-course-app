{id:"c1u1",lv:"C1",n:1,tr:"Yazı dili",en:"The written register",focus:"-mAktA · -mAksIzIn · resmî üslup",
 vocab:[["lisan","language (older word for dil)"],["sade","plain, simple"],["terkip","compound, construction"],["kaide","rule"],["taklit","imitation"],["millî","national"],["ihtiyaç","need"],["şive","accent, dialect"],["ısrar","insistence"],["tasfiye","purging, cleansing"]],
 gram:{t:"Yüksek üslup ekleri",en:"The suffixes of formal prose",
  body:["<code>-mAktA</code> replaces -(I)yor in formal, legal and academic writing: <b>artmaktadır</b> — it is increasing. It carries no extra meaning, only register.",
   "<code>-mAksIzIn</code> is the formal <i>without doing</i>, in place of -mAdAn: <b>izin almaksızın</b>.",
   "<code>-mAktAdIr / -mIştIr / -AcAktIr</code>: the <b>-DIr</b> suffix on a verb makes an impersonal, official assertion. Never use it in speech.",
   "<code>-mAk üzere</code> — in order to, or about to: <b>bitmek üzere</b> (about to finish), <b>incelenmek üzere</b> (in order to be examined).",
   "The higher the register, the more Arabic-derived the vocabulary: <i>lisan</i> for <i>dil</i>, <i>kaide</i> for <i>kural</i>, <i>ihtiyaç</i> for <i>gereksinim</i>."],
  tbl:[["artıyor","artmaktadır"],["almadan","almaksızın"],["geldi","gelmiştir"],["bitmek üzere","about to finish"],["…-dığı takdirde","in the event that…"]],
  eg:[["Başvurular 15 Mart'a kadar kabul edilmektedir.","Applications are accepted until 15 March."],["İzin almaksızın girilemez.","No entry without permission."],["Rapor, incelenmek üzere kurula gönderilmiştir.","The report has been sent to the board to be examined."]]},
 read:{t:"Yeni bir dil",kind:"Uyarlama · Ömer Seyfettin'in “Yeni Lisan” (1911) yazısından",src:"C1 · adapted and paraphrased for this course",
  note:"In 1911 Ömer Seyfettin and his circle at the journal Genç Kalemler argued that written Turkish had become an artificial mixture of Arabic and Persian constructions, unreadable to the people who spoke the language. The argument reshaped modern Turkish prose. The original article is public domain; what follows is a paraphrase in modern Turkish.",
  lines:[["Bizim yazı dilimiz, konuşulan dilden ayrılmış, kendi başına yaşayan yapay bir dil hâline gelmiştir.","Our written language has broken away from the spoken one and become an artificial language living on its own."],
   ["Bir milletin kendi diliyle yazamaması kadar tuhaf bir hâl düşünülemez.","No situation stranger than a nation being unable to write in its own language can be imagined."],
   ["Arapça ve Farsçadan alınan terkipler, cümleyi süslediğini sanan yazarlar tarafından ısrarla kullanılmaktadır.","Compounds taken from Arabic and Persian are insistently used by writers who believe they are adorning the sentence."],
   ["Oysa süs değil, açıklık aranmalıdır; anlaşılmayan bir cümle, ne kadar güzel olursa olsun, ölüdür.","Yet not adornment but clarity should be sought; a sentence that is not understood, however beautiful, is dead."],
   ["Halkın ağzındaki kelimeleri küçümsemeksizin, yeni bir yazı dili kurulabilir.","Without belittling the words in the mouth of the people, a new written language can be built."],
   ["İstanbul'da konuşulan şive, bu dilin tabii ölçüsü olarak alınmalıdır.","The accent spoken in Istanbul should be taken as the natural measure of this language."],
   ["Yabancı kaideleri atmak, yabancı kelimeleri atmak demek değildir.","Discarding foreign rules does not mean discarding foreign words."],
   ["Dil, taklit edilerek değil, kullanılarak millîleşir.","A language becomes national not by being imitated but by being used."]],
  gloss:{"yapay":"artificial","tuhaf":"strange","süslemek":"to adorn","küçümsemek":"to belittle","tabii":"natural","ölçü":"measure, standard"}},
 drill:[
  {t:"mc",q:"Formal equivalent of “artıyor” is",a:["artmakta","artmaktadır","artmıştır","artacaktır"],c:1,why:"-mAktAdIr is the impersonal formal present."},
  {t:"fill",q:"İzin al___ girilemez. (without taking permission — formal)",c:"maksızın",why:"-mAksIzIn is the formal -mAdAn."},
  {t:"mc",q:"“…incelenmek üzere gönderilmiştir” means",a:["it was sent after examination","it was sent in order to be examined","it is about to be examined","it cannot be examined"],c:1,why:"-mAk üzere = in order to."},
  {t:"order",q:"Build: “A language becomes national by being used.”",w:["Dil","kullanılarak","millîleşir"],c:"Dil kullanılarak millîleşir"},
  {t:"mc",q:"The article's central claim is that",a:["Turkish should reject all foreign words","the written language must rejoin the spoken one","Istanbul Turkish is inferior","Persian grammar is more beautiful"],c:1,why:"Foreign rules, not foreign words, were the target."}],
 speak:"Take a paragraph of your own casual Turkish and say it again in formal register: -mAktAdIr, -mAksIzIn, passive throughout."},

{id:"c1u2",lv:"C1",n:2,tr:"Eski söz",en:"Ancient speech",focus:"-DIkçA · -Ar…-mAz · -CAsInA",
 vocab:[["oğuz","Oghuz (the western Turkic tribes)"],["boy","tribe, clan"],["yiğit","brave young man"],["ad koymak","to bestow a name"],["han","khan, ruler"],["boğa","bull"],["meydan","open square, arena"],["dua etmek","to pray for"],["kılıç","sword"],["destan","epic"]],
 gram:{t:"Üç edebî zarf-fiil",en:"Three literary converbs",
  body:["<code>-DIkçA</code> — the more … the more, or as long as: <b>okudukça anlıyorum</b>, the more I read the more I understand.",
   "<code>-Ar …-mAz</code> — the instant that: <b>görür görmez</b>, the moment he saw. The verb is repeated, positive then negative.",
   "<code>-CAsInA</code> — as if: <b>bilmiyormuşçasına baktı</b>, he looked as if he did not know.",
   "<code>-(y)AlI</code> — ever since: <b>geleli üç gün oldu</b>, it is three days since he came.",
   "Old epic Turkish also inverts the normal order and puts the verb first for weight: <b>Söyledi Dede Korkut…</b>"],
  tbl:[["-DIkçA","as / the more"],["-Ar …-mAz","the instant"],["-CAsInA","as if"],["-(y)AlI","since"],["-mAktansA","rather than"]],
  eg:[["Baktıkça daha çok seviyorum.","The more I look the more I love it."],["Kapıyı açar açmaz anladım.","The moment I opened the door I understood."],["Ölürcesine yoruldum.","I am tired to death."]]},
 read:{t:"Boğaç Han'a ad verilmesi",kind:"Uyarlama · Dede Korkut Kitabı (15.–16. yy. yazmaları)",src:"C1 · retold in modern Turkish for this course",
  note:"The Book of Dede Korkut is the great epic cycle of the Oghuz Turks, written down in the fifteenth or sixteenth century from far older oral material. In Oghuz custom a boy has no name until he has earned one. This is the opening of the first tale, retold in modern Turkish.",
  lines:[["Bayındır Han, yılda bir kez bütün Oğuz beylerine şölen verirmiş.","Bayındır Khan would give a feast for all the Oghuz lords once a year."],
   ["Oğlu olanı ak otağa, kızı olanı kızıl otağa, hiç çocuğu olmayanı kara otağa oturturmuş.","He would seat the man with a son in the white tent, the man with a daughter in the red, and the man with no child at all in the black."],
   ["Dirse Han kara otağa oturtulduğunu görür görmez ayağa kalkmış.","The moment Dirse Khan saw that he had been seated in the black tent, he rose to his feet."],
   ["Yıllarca dua etmişler; sonunda bir oğulları olmuş, ama çocuğun daha adı yokmuş.","For years they prayed; at last they had a son, but the boy still had no name."],
   ["Oğuz'da kural şuydu: bir yiğit, kendi başıyla bir iş başarmadıkça ad alamazdı.","The rule among the Oghuz was this: a young man could not receive a name until he had accomplished something by his own head."],
   ["Bir gün meydanda azgın bir boğa salıverilmiş; herkes kaçarcasına dağılmış.","One day a maddened bull was let loose in the square; everyone scattered as if fleeing."],
   ["Çocuk kaçmamış; boğanın alnına yumruğunu dayamış ve hayvan yıkılana kadar geri çekilmemiş.","The boy did not flee; he set his fist against the bull's forehead and did not draw back until the animal fell."],
   ["Dede Korkut gelmiş, çocuğun başını okşamış ve demiş ki: “Adın Boğaç olsun.”","Dede Korkut came, stroked the boy's head, and said: “Let your name be Boğaç.”"],
   ["Ad verildikçe erkek olunurmuş; ad, Oğuz'da bir armağan değil, bir hükümmüş.","One became a man as a name was bestowed; among the Oghuz a name was not a gift but a judgement."]],
  gloss:{"şölen":"feast","otağ":"the great tent of a chief","azgın":"maddened, wild","salıvermek":"to let loose","yumruk":"fist","okşamak":"to stroke","hüküm":"judgement, verdict"}},
 drill:[
  {t:"mc",q:"“The moment he saw it, he understood.” =",a:["Görünce anladı.","Görür görmez anladı.","Gördükçe anladı.","Göreli anladı."],c:1,why:"-Ar …-mAz is the instant-of construction."},
  {t:"fill",q:"Okudu___ daha çok anlıyorum. (the more I read)",c:"kça",why:"-DIkçA."},
  {t:"mc",q:"“kaçarcasına dağıldılar” =",a:["they scattered in order to flee","they scattered as if fleeing","they fled after scattering","they could not scatter"],c:1,why:"-CAsInA = as if."},
  {t:"order",q:"Build: “A young man could not take a name until he had accomplished something.”",w:["Bir","yiğit","bir","iş","başarmadıkça","ad","alamazdı"],c:"Bir yiğit bir iş başarmadıkça ad alamazdı"},
  {t:"mc",q:"In Oghuz custom a name is",a:["given at birth","inherited from the father","earned by a deed","bought from the khan"],c:2,why:"Hence the whole first tale."}],
 speak:"Describe a turning point in your life using -Ar…-mAz, -DIkçA and -(y)AlI at least once each."},

{id:"c1u3",lv:"C1",n:3,tr:"Akademik Türkçe",en:"Academic Turkish",focus:"adlaştırma · -mAsI · uzun cümle",
 vocab:[["hars","culture (older term)"],["medeniyet","civilisation"],["kavram","concept"],["ayrım","distinction"],["toplum","society"],["aktarım","transmission"],["değer","value"],["yöntem","method"],["varsayım","hypothesis"],["sonuç","conclusion"]],
 gram:{t:"Adlaştırma",en:"Nominalisation, the engine of academic style",
  body:["Academic Turkish turns verbs into nouns and stacks them: <code>-mA</code> (the act), <code>-mAsI</code> (its being done), <code>-DIğI</code> (the fact that).",
   "<b>Dilin değişmesi kaçınılmazdır.</b> — The changing of language is inevitable.",
   "<b>Bu kavramın yanlış anlaşılmış olması, tartışmayı güçleştirmektedir.</b> — The fact that this concept has been misunderstood makes the discussion harder.",
   "Frames to memorise: <b>…-DIğI görülmektedir</b> (it is seen that), <b>…-mAsI gerekmektedir</b> (it is necessary that), <b>…-DIğI ileri sürülmektedir</b> (it is argued that), <b>…açısından</b> (from the standpoint of), <b>…bakımından</b> (in respect of).",
   "The main verb waits at the very end. Read the sentence backwards to find it first."],
  tbl:[["-mA","okuma — reading"],["-mAsI","okuması — his reading of it"],["-DIğI","okuduğu — that he read"],["-mAktAdIr","formal present"],["…-A göre","according to"]],
  eg:[["Bu durumun incelenmesi gerekmektedir.","This situation needs to be examined."],["Araştırmanın sonucu, varsayımı doğrulamaktadır.","The result of the research confirms the hypothesis."],["Kültürel aktarımın ailede başladığı görülmektedir.","It is seen that cultural transmission begins in the family."]]},
 read:{t:"Hars ve medeniyet",kind:"Uyarlama · Ziya Gökalp'in kültür kuramından",src:"C1 · paraphrased for this course",
  note:"Ziya Gökalp (1876–1924) built early Turkish sociology around a distinction between hars (a people's own culture) and medeniyet (the international, transferable apparatus of civilisation). Whether the distinction holds is still argued; it is paraphrased here as a specimen of academic prose.",
  lines:[["Gökalp'e göre hars ile medeniyet arasındaki ayrım, toplum kuramının temel meselelerinden biridir.","For Gökalp, the distinction between culture and civilisation is one of the basic questions of social theory."],
   ["Hars, bir milletin kendiliğinden ürettiği duygu, dil ve estetik değerlerin bütünü olarak tanımlanmaktadır.","Culture is defined as the whole of the feelings, language and aesthetic values a nation produces of itself."],
   ["Medeniyet ise akılla kurulan, ölçülebilen ve milletler arasında aktarılabilen bilgi ve teknikten oluşmaktadır.","Civilisation, by contrast, consists of knowledge and technique built by reason, measurable, and transferable between nations."],
   ["Bu ayrımın önemi, bir toplumun teknik almakla kimliğini kaybetmeyeceği varsayımına dayanmasındadır.","The importance of this distinction lies in its resting on the assumption that a society will not lose its identity by adopting technique."],
   ["Ancak kavramların bu kadar keskin ayrılabileceği görüşü, sonraki araştırmacılarca eleştirilmiştir.","However, the view that the concepts can be separated so sharply has been criticised by later researchers."],
   ["Dilin, hem hars hem de medeniyet alanına ait olduğu ileri sürülmektedir.","It is argued that language belongs both to the domain of culture and to that of civilisation."],
   ["Bu tartışmanın bugün de sürmesi, sorunun çözülmediğini göstermektedir.","That this debate continues today shows that the problem has not been resolved."]],
  gloss:{"kendiliğinden":"of itself, spontaneously","dayanmak":"to rest on","keskin":"sharp","eleştirmek":"to criticise","sürmek":"to continue"}},
 drill:[
  {t:"mc",q:"“It is argued that…” =",a:["…-DIğI görülmektedir","…-DIğI ileri sürülmektedir","…-mAsI gerekmektedir","…-mAktAdIr"],c:1,why:"ileri sürmek = to put forward, to argue."},
  {t:"fill",q:"Bu durumun incelen___ gerekmektedir. (needs to be examined)",c:"mesi",why:"-mA + possessive -sI."},
  {t:"mc",q:"In a long academic sentence, the main verb is",a:["first","second","near the middle","at the very end"],c:3,why:"Which is why you read backwards."},
  {t:"order",q:"Build: “It is seen that cultural transmission begins in the family.”",w:["Kültürel","aktarımın","ailede","başladığı","görülmektedir"],c:"Kültürel aktarımın ailede başladığı görülmektedir"},
  {t:"mc",q:"Gökalp's medeniyet is",a:["a nation's own feeling","transferable technique and knowledge","religious practice","folk poetry"],c:1,why:"And hars is the untransferable half."}],
 speak:"Summarise an argument you have read recently in five nominalised academic sentences."},

{id:"c1u4",lv:"C1",n:4,tr:"Sessiz adam",en:"The silent man",focus:"edebî anlatı · iç ses",
 vocab:[["silik","faded, unremarkable"],["dikkat çekmek","to draw attention"],["defter","notebook"],["sıradan","ordinary"],["merak","curiosity"],["gizlemek","to conceal"],["fark etmek","to notice"],["hayret","astonishment"],["yalnızlık","loneliness"],["ruh","soul"]],
 gram:{t:"Anlatıcının sesi",en:"The narrator's voice",
  body:["Literary Turkish narration moves between the witnessed past <b>-DI</b> (the events) and the habitual past <b>-(A)rdI</b> (what used to happen), with <b>-mIştI</b> for what had happened before.",
   "<b>-(I)yordu</b> holds a scene open; <b>-DI</b> advances it. Watch how a paragraph alternates.",
   "Inner speech is marked by <b>sanki</b> (as if), <b>galiba / herhâlde</b> (presumably), <b>âdeta</b> (virtually), and by the -mIş of realisation: <b>meğer tanımıyormuşum.</b>",
   "<b>ki</b> opens an explanatory afterthought — a Persian-derived move much used in the novel: <b>Öyle bir adamdı ki…</b>"],
  tbl:[["-DI","he did (event)"],["-(A)rdI","he used to do"],["-(I)yordu","he was doing"],["-mIştI","he had done"],["-mIş","so it turns out"]],
  eg:[["Her sabah aynı saatte gelirdi.","He used to come at the same hour each morning."],["Sanki beni görmemişti.","It was as if he had not seen me."],["Öyle sessizdi ki varlığı fark edilmezdi.","He was so quiet that his presence went unnoticed."]]},
 read:{t:"Kürk Mantolu Madonna'nın başı",kind:"Uyarlama · Sabahattin Ali, “Kürk Mantolu Madonna” (1943)",src:"C1 · the opening situation, retold in simplified form for this course",
  note:"Sabahattin Ali (1907–1948) is one of the most widely read Turkish novelists. His narrator shares an office with Raif Efendi, a translator so self-effacing that nobody suspects the inner life recorded in his notebook. The passage below is a retelling of that opening, not the author's own wording.",
  lines:[["Şimdiye kadar tanıdığım insanlar arasında en sıradan görüneni Raif Efendi'ydi.","Of all the people I have known, the one who seemed most ordinary was Raif Efendi."],
   ["Bizim odada yıllardır aynı masada oturur, kimseyle gereğinden fazla konuşmazdı.","He had sat at the same desk in our room for years and spoke to nobody more than necessary."],
   ["Ona bir iş verildiğinde itiraz etmez, verilmediğinde de sormazdı.","When he was given work he did not object, and when he was not, he did not ask."],
   ["Ceketinin eskiliği, bakışlarının silikliği, hepsi onu görünmez kılıyordu.","The wear of his jacket, the faintness of his gaze — all of it made him invisible."],
   ["İnsanların çoğu, sessiz bir adamın içinde hiçbir şey olmadığını sanır.","Most people suppose that inside a silent man there is nothing at all."],
   ["Oysa asıl gizlenen hayatlar, gürültü yapmayan hayatlardır.","Yet the lives that are truly hidden are the ones that make no noise."],
   ["Onun bir defter tuttuğunu öğrendiğimde hayretten donup kaldım.","When I learned that he kept a notebook, I froze in astonishment."],
   ["Meğer yıllarca yanımda oturan bu adamı, bir gün bile tanımamışım.","It turns out that this man who sat beside me for years, I had not known for a single day."]],
  gloss:{"gereğinden fazla":"more than necessary","itiraz etmek":"to object","eskilik":"worn state","görünmez kılmak":"to render invisible","donup kalmak":"to freeze on the spot"}},
 drill:[
  {t:"mc",q:"“He used to come every morning.” =",a:["Her sabah geldi.","Her sabah gelirdi.","Her sabah geliyordu.","Her sabah gelmişti."],c:1,why:"-(A)rdI is the habitual past."},
  {t:"fill",q:"Sanki beni gör___ . (as if he had not seen me)",c:"memişti",why:"gör + me + miş + ti."},
  {t:"mc",q:"“Meğer tanımamışım.” conveys",a:["a plan","a late realisation about oneself","a command","a polite refusal"],c:1,why:"The -mIş of discovery, applied to the speaker."},
  {t:"order",q:"Build: “He was so quiet that his presence went unnoticed.”",w:["Öyle","sessizdi","ki","varlığı","fark","edilmezdi"],c:"Öyle sessizdi ki varlığı fark edilmezdi"},
  {t:"mc",q:"The novel's premise is that Raif Efendi",a:["is secretly wealthy","hides a whole inner life behind dullness","is a criminal","cannot speak Turkish"],c:1,why:"The notebook is the hinge of the book."}],
 speak:"Describe someone you underestimated, moving between -DI, -(A)rdI and -mIştI."},

{id:"c1u5",lv:"C1",n:5,tr:"Seyahatname",en:"The book of travels",focus:"eski anlatı · tasvir",
 vocab:[["seyahat","travel"],["rüya","dream"],["şefaat","intercession"],["nakletmek","to relate, transmit"],["gezmek","to wander, tour"],["acayip","strange, wondrous"],["kale","fortress"],["ziyaretgâh","place of pilgrimage"],["methetmek","to praise"],["kalem almak","to take up the pen"]],
 gram:{t:"Tasvir ve abartı",en:"Description and the art of exaggeration",
  body:["Classical Turkish travel prose piles up descriptive phrases in threes and fours, and reaches for <b>öyle … ki</b>, <b>o kadar … ki</b>, <b>değme</b>, <b>âdeta</b>.",
   "Verbs of relating: <b>nakletmek, rivayet etmek, zikretmek, beyan etmek</b> — all higher-register replacements for <i>anlatmak, söylemek</i>.",
   "The narrative past of such texts is <b>-mIş</b> or the neutral <b>-DI</b>, and adjectives commonly follow Persian izafet: <b>bâb-ı âlî</b> (the sublime porte), <b>hüsn-i hat</b> (fine calligraphy).",
   "Note the frozen phrase <b>ol / işbu / mezkûr</b> — that, this here, the aforementioned — still met in legal Turkish."],
  tbl:[["nakletmek","to relate"],["rivayet","account, report"],["mezkûr","aforementioned"],["âdeta","virtually"],["değme","any ordinary"]],
  eg:[["O kadar büyük bir kaleydi ki gözle ucu görülmezdi.","It was so great a fortress that the eye could not find its end."],["Rivayet olunur ki…","It is related that…"],["Bu acayip hâli beyan etmek kalem ile mümkün değildir.","To set forth this wondrous state is not possible with a pen."]]},
 read:{t:"Rüyadaki söz",kind:"Uyarlama · Evliya Çelebi, Seyahatnâme (17. yy.)",src:"C1 · retold in modern Turkish for this course",
  note:"Evliya Çelebi (1611–after 1682) spent forty years travelling the Ottoman world and filled ten volumes with what he saw, heard, and improved upon. He opens the Seyahatnâme with a dream in which he means to ask for intercession, şefaat, and asks instead for travel, seyahat — and is granted both. Retold here in modern Turkish.",
  lines:[["Bir gece rüyamda kendimi kalabalık bir mecliste buldum.","One night in my dream I found myself in a crowded assembly."],
   ["Orada bulunanların yüzleri öyle nurluydu ki bakmaya takat getiremedim.","The faces of those present were so luminous that I could not summon the strength to look."],
   ["Heyecandan dilim dolaştı ve “şefaat” diyecek yerde “seyahat” dedim.","In my excitement my tongue tangled, and where I meant to say “intercession” I said “travel”."],
   ["Meclistekiler gülümseyerek birbirlerine baktılar.","Those in the assembly looked at one another, smiling."],
   ["Bana dediler ki: “Şefaat de sana verildi, seyahat de. Gördüğünü yaz.”","They said to me: “Both intercession and travel are given you. Write what you see.”"],
   ["Uyandığımda gördüğüm rüyayı bir hocaya naklettim; o da beni yola teşvik etti.","When I woke I related the dream to a teacher, and he urged me onto the road."],
   ["Ondan sonra kırk yıl gezdim: nice şehirler, nice kaleler, nice ziyaretgâhlar gördüm.","After that I wandered forty years: many a city, many a fortress, many a place of pilgrimage I saw."],
   ["Gördüklerimi, değme kalemin methetmeye gücü yetmeyecek şekilde yazmaya çalıştım.","I tried to write what I saw in a way no ordinary pen would have the strength to praise."]],
  gloss:{"meclis":"assembly, gathering","nurlu":"luminous","takat":"strength","dili dolaşmak":"for one's tongue to tangle","teşvik etmek":"to urge on","nice":"many a"}},
 drill:[
  {t:"mc",q:"Evliya's famous slip was between",a:["seyahat and ziyaret","şefaat and seyahat","kale and kalem","rüya and dua"],c:1,why:"Intercession for travel — and he got both."},
  {t:"fill",q:"O kadar büyüktü ___ ucu görünmezdi. (so big that…)",c:"ki",why:"o kadar … ki is the classical intensifier."},
  {t:"mc",q:"“nakletmek” is a higher-register",a:["anlatmak","gitmek","görmek","yazmak"],c:0,why:"To relate, to transmit an account."},
  {t:"order",q:"Build: “I wandered forty years and saw many a city.”",w:["Kırk","yıl","gezdim","ve","nice","şehirler","gördüm"],c:"Kırk yıl gezdim ve nice şehirler gördüm"},
  {t:"mc",q:"“mezkûr” means",a:["hidden","aforementioned","forbidden","blessed"],c:1,why:"Still alive in legal Turkish."}],
 speak:"Describe a place you have visited in the manner of a seyahatname: three descriptive clauses per sentence, and one öyle … ki."},

{id:"c1u6",lv:"C1",n:6,tr:"Şart ve hüküm",en:"Terms and provisions",focus:"-DIğI takdirde · -mAsI hâlinde · suretiyle",
 vocab:[["takdirde","in the event that"],["hâlinde","in the case of"],["suretiyle","by means of"],["hüküm","provision, judgement"],["yürürlük","force, effect"],["fesih","termination"],["taraf","party"],["yükümlülük","obligation"],["ihlal","violation"],["geçerli","valid"]],
 gram:{t:"Resmî şart yapıları",en:"Conditions in official Turkish",
  body:["<code>-DIğI takdirde</code> and <code>-mAsI hâlinde</code> both mean “in the event that” and replace <b>-sA</b> in contracts and regulations: <b>ödeme yapılmadığı takdirde</b>.",
   "<code>-mAk suretiyle</code> — by means of doing: <b>yazılı bildirmek suretiyle</b>.",
   "<code>-mAk kaydıyla / şartıyla</code> — on condition that: <b>bir hafta önce haber vermek kaydıyla</b>.",
   "<b>gerek … gerek(se)</b> — both … and: <b>gerek işveren gerekse çalışan</b>. <b>gerek</b> here is not “necessary”.",
   "<b>ilgili, söz konusu, mezkûr, işbu</b> — the said, the aforementioned, this present. <b>işbu sözleşme</b> = this contract."],
  tbl:[["-DIğI takdirde","in the event that"],["-mAsI hâlinde","in the case of"],["-mAk suretiyle","by means of"],["-mAk kaydıyla","on condition that"],["işbu","this present"],["söz konusu","the said"]],
  eg:[["Sözleşme, imzalandığı tarihte yürürlüğe girer.","The contract enters into force on the date it is signed."],["Yükümlülüklerin ihlali hâlinde sözleşme feshedilir.","In the case of violation of the obligations the contract is terminated."],["Taraflar, yazılı bildirmek suretiyle sözleşmeyi sona erdirebilir.","The parties may end the contract by giving written notice."]]},
 read:{t:"Kira sözleşmesinden",kind:"Özgün örnek metin · sözleşme üslubunda",src:"C1 · specimen contract clauses written for this course",
  lines:[["İşbu sözleşme, imzalandığı tarihte yürürlüğe girer ve bir yıl süreyle geçerlidir.","This present contract enters into force on the date of signature and is valid for one year."],
   ["Kiracı, kira bedelini her ayın beşinci gününe kadar ödemekle yükümlüdür.","The tenant is obliged to pay the rent by the fifth day of each month."],
   ["Ödemenin iki ay üst üste yapılmaması hâlinde sözleşme kendiliğinden feshedilmiş sayılır.","In the case of payment not being made two months in succession, the contract is deemed terminated automatically."],
   ["Taraflardan biri, en az otuz gün önce yazılı bildirimde bulunmak suretiyle sözleşmeyi sona erdirebilir.","One of the parties may end the contract by giving written notice at least thirty days in advance."],
   ["Söz konusu bildirim, noter aracılığıyla yapıldığı takdirde geçerli kabul edilir.","The said notification is deemed valid in the event that it is made through a notary."],
   ["Gerek kiracı gerekse ev sahibi, mecurun bakımından müştereken sorumludur.","Both the tenant and the landlord are jointly responsible for the upkeep of the leased property."],
   ["İşbu sözleşmeden doğan uyuşmazlıklarda İstanbul mahkemeleri yetkilidir.","In disputes arising from this contract the Istanbul courts are competent."]],
  gloss:{"kiracı":"tenant","bedel":"price, amount due","üst üste":"in succession","noter":"notary","mecur":"the leased property (legal term)","uyuşmazlık":"dispute"}},
 drill:[
  {t:"mc",q:"“in the event that payment is not made” =",a:["ödeme yapılmazsa","ödeme yapılmadığı takdirde","ödeme yapmadan","ödeme yaparak"],c:1,why:"Both are correct Turkish; the second is the contract register."},
  {t:"fill",q:"Yazılı bildirmek ___ sözleşme sona erdirilebilir. (by means of)",c:"suretiyle",why:"-mAk suretiyle."},
  {t:"mc",q:"“işbu” means",a:["therefore","this present","however","henceforth"],c:1,why:"Only in legal texts."},
  {t:"order",q:"Build: “This contract enters into force on the date it is signed.”",w:["İşbu","sözleşme","imzalandığı","tarihte","yürürlüğe","girer"],c:"İşbu sözleşme imzalandığı tarihte yürürlüğe girer"},
  {t:"mc",q:"In “gerek kiracı gerekse ev sahibi”, gerek means",a:["necessary","both … and","neither","in need"],c:1,why:"A correlative pair, not the adjective."}],
 speak:"State five house rules as contract clauses, then say each again as you would to a flatmate."},

{id:"c1u7",lv:"C1",n:7,tr:"Mevlid geleneği",en:"The Mevlid tradition",focus:"edebî tasvir · teşbih · dinî üslup",
 vocab:[["mevlid","the nativity poem, and the gathering where it is read"],["kandil","holy night; oil lamp"],["cemaat","congregation"],["okuyucu","reciter"],["nur","light, radiance"],["müjde","glad tidings"],["salavat","the formula of blessing on the Prophet"],["huşu","reverent awe"],["makam","melodic mode"],["irticalen","extempore"]],
 gram:{t:"Tasvir ve benzetme",en:"Description and simile in devotional prose",
  body:["Simile frames: <b>… gibi</b>, <b>âdeta</b>, <b>sanki</b>, <b>-cAsInA</b>, and the older <b>misali</b>: <b>güneş misali</b>.",
   "Devotional register borrows heavily from Arabic and prefers doublets: <b>hürmet ve muhabbetle</b>, <b>huşu içinde</b>, <b>aşk u şevk ile</b>.",
   "The aorist states custom: <b>okunur, toplanılır, ikram edilir</b> — the passive aorist is the natural tense for describing a rite.",
   "Note the vocabulary of gathering: <b>cemaat</b> (those present), <b>kandil</b> (a holy night), <b>mevlithan</b> (the one who recites).",
   "This is the same register you meet in any devotional text; learning it opens a whole shelf of Turkish prose."],
  tbl:[["… gibi / misali","like"],["sanki / âdeta","as if / virtually"],["huşu içinde","in reverent awe"],["okunur","it is recited"],["-CAsInA","as though"]],
  eg:[["Cemaat, huşu içinde dinler.","The congregation listens in reverent awe."],["Ses, âdeta bir su gibi yayılırdı.","The voice would spread virtually like water."],["Mevlid, kandil gecelerinde okunur.","The Mevlid is recited on the holy nights."]]},
 read:{t:"Bir mevlid gecesi",kind:"Özgün metin · geleneğin tasviri",src:"C1 · descriptive prose written for this course",
  note:"Süleyman Çelebi composed the Vesîletü'n-Necât in Bursa in 1409; it is the poem Turks mean by “Mevlid”. This passage describes the gathering and the custom rather than reproducing the verse — the poem itself is best met whole, recited.",
  lines:[["Mevlid, bir kitap olmaktan çok bir gecedir.","The Mevlid is less a book than a night."],
   ["Kandil akşamlarında cemaat, halı serilmiş bir odaya sessizce toplanır.","On the eves of the holy nights the congregation gathers quietly in a room spread with carpets."],
   ["Mevlithan, makamla okumaya başladığında oda âdeta genişler.","When the reciter begins to chant in the melodic mode, the room virtually widens."],
   ["Veladet bahrine gelindiğinde herkes ayağa kalkar; salavat, bir dalga gibi sıralar boyunca yükselir.","When the section of the nativity is reached everyone rises; the blessing swells like a wave along the rows."],
   ["Süleyman Çelebi'nin dili sade olduğu için, altı yüz yıl sonra bile anlaşılır.","Because Süleyman Çelebi's language is plain, it is understood even six hundred years later."],
   ["Sonunda şerbet ve lokum ikram edilir, dua edilir, sessizce dağılınır.","At the end sherbet and lokum are served, a prayer is made, and the company disperses quietly."],
   ["Metni okumak başka, o odada bulunmak başkadır.","Reading the text is one thing; being in that room is another."]],
  gloss:{"halı":"carpet","serilmiş":"spread out","veladet":"birth, nativity","bahir":"a section of a long poem","dağılmak":"to disperse","şerbet":"a sweet drink"}},
 drill:[
  {t:"mc",q:"“Mevlid kandil gecelerinde okunur.” uses",a:["past tense","passive aorist for custom","future","imperative"],c:1,why:"The natural tense for describing a rite."},
  {t:"fill",q:"Ses, bir dalga ___ yükseldi. (like a wave)",c:"gibi",why:"gibi follows the noun."},
  {t:"mc",q:"Süleyman Çelebi's Mevlid dates from",a:["1209","1409","1609","1809"],c:1,why:"Composed in Bursa in 1409."},
  {t:"order",q:"Build: “The congregation listens in reverent awe.”",w:["Cemaat","huşu","içinde","dinler"],c:"Cemaat huşu içinde dinler"},
  {t:"mc",q:"Why is the poem still understood today?",a:["It was rewritten","Its language was plain from the start","It is in Arabic","It is short"],c:1,why:"Plain fifteenth-century Turkish has aged very well."}],
 speak:"Describe a ceremony you have attended using the passive aorist and three similes."},

{id:"c1u8",lv:"C1",n:8,tr:"Haber dili",en:"The language of news",focus:"başlık dili · aktarım · edilgen",
 vocab:[["haber","news item"],["manşet","headline"],["muhabir","correspondent"],["açıklama","statement"],["yetkili","official"],["iddia etmek","to allege"],["duyurmak","to announce"],["görüşme","talks, meeting"],["artış","increase"],["düşüş","decline"]],
 gram:{t:"Gazete Türkçesi",en:"How a Turkish news sentence is built",
  body:["Headlines drop endings and verbs: <b>Zamda geri adım</b>, <b>Görüşmeler yarın</b>, <b>Kar kapıda</b>. Read them as noun phrases.",
   "Attribution is everything: <b>…-DIğI bildirildi / açıklandı / öne sürüldü / iddia edildi / öğrenildi</b>. Each marks a different distance from the fact.",
   "Sources: <b>yetkililere göre</b>, <b>edinilen bilgiye göre</b>, <b>adının açıklanmasını istemeyen bir kaynak</b>.",
   "Numbers: <b>yüzde 3'lük artış</b>, <b>3 puan düştü</b>, <b>yarı yarıya azaldı</b>.",
   "The news past is <b>-DI</b> for what is established and <b>-mIş</b> or <b>-DIğI öne sürüldü</b> for what is claimed. Watch which one a paper chooses — it is the paper's position."],
  tbl:[["bildirildi","it was reported"],["açıklandı","it was announced"],["öne sürüldü","it was alleged"],["öğrenildi","it was learned"],["yalanlandı","it was denied"]],
  eg:[["Görüşmelerin yarın başlayacağı bildirildi.","It was reported that the talks will begin tomorrow."],["Yetkililere göre artış geçici.","According to officials the increase is temporary."],["İddialar dün yalanlandı.","The allegations were denied yesterday."]]},
 read:{t:"Üç kısa haber",kind:"Özgün örnek metinler · haber üslubunda",src:"C1 · specimen news items written for this course",
  lines:[["KAR KAPIDA: Meteoroloji, hafta sonu için kuvvetli kar yağışı uyarısında bulundu.","SNOW AT THE DOOR: The meteorological service issued a warning of heavy snowfall for the weekend."],
   ["Yetkililer, sürücülerin zorunlu olmadıkça yola çıkmamasını istedi.","Officials asked drivers not to set out unless it was necessary."],
   ["Edinilen bilgiye göre, iki ilde okullar tatil edilecek.","According to information obtained, schools in two provinces will be closed."],
   ["EKONOMİ: Enflasyonun geçen aya kıyasla yüzde üçlük bir düşüş gösterdiği açıklandı.","ECONOMY: It was announced that inflation showed a decline of three per cent compared with last month."],
   ["Uzmanlar, bu düşüşün mevsimsel olduğunu öne sürüyor.","Experts allege that this decline is seasonal."],
   ["KÜLTÜR: Kayıp sanılan bir el yazmasının Konya'da bulunduğu öğrenildi.","CULTURE: It was learned that a manuscript thought lost has been found in Konya."],
   ["Eserin on beşinci yüzyıla ait olduğu, ancak incelemenin sürdüğü belirtildi.","It was stated that the work belongs to the fifteenth century, but that examination is continuing."]],
  gloss:{"uyarı":"warning","zorunlu":"compulsory, necessary","il":"province","kıyasla":"compared with","el yazması":"manuscript","belirtmek":"to state"}},
 drill:[
  {t:"mc",q:"Which frame puts the greatest distance between paper and claim?",a:["açıklandı","bildirildi","öne sürüldü","öğrenildi"],c:2,why:"It was alleged — the paper does not vouch for it."},
  {t:"fill",q:"Görüşmelerin yarın başlayacağı ___ . (was reported)",c:"bildirildi",why:"Nominalised clause + passive."},
  {t:"mc",q:"“Kar kapıda” is a headline meaning",a:["Snow at the door — snow is imminent","The door is snowy","Close the door, it's snowing","Snow has ended"],c:1,why:"Headlines are verbless noun phrases."},
  {t:"order",q:"Build: “It was learned that the manuscript was found in Konya.”",w:["El","yazmasının","Konya'da","bulunduğu","öğrenildi"],c:"El yazmasının Konya'da bulunduğu öğrenildi"},
  {t:"mc",q:"“yüzde üçlük bir düşüş” =",a:["a three per cent decline","three declines","the third decline","a decline to three"],c:0,why:"yüzde + number, then -lIk to make it an adjective."}],
 speak:"Report three things that happened this week as news items, changing the attribution frame each time."},

{id:"c1u9",lv:"C1",n:9,tr:"Karagöz ile Hacivat",en:"Shadow theatre",focus:"konuşma dili · söz oyunu · yanlış anlama",
 vocab:[["gölge oyunu","shadow play"],["perde","screen; curtain"],["tuzlu","salty; overpriced"],["kafiye","rhyme"],["nükte","witticism"],["şaka","joke"],["kasıt","intent"],["anlaşmazlık","misunderstanding"],["ukala","know-all"],["kabadayı","swaggering tough"]],
 gram:{t:"Sözlü Türkçenin sesleri",en:"How spoken Turkish actually sounds",
  body:["Contractions you will hear constantly but rarely see written: <b>ne yapıyorsun → napıyorsun</b>, <b>ne oldu → n'oldu</b>, <b>bir şey → bişey</b>, <b>geliyorum → geliyom</b> (regional), <b>söyleyeceğim → söylicem</b>.",
   "<b>Devrik cümle</b> — the verb moved off the end — is normal in speech: <b>Gelmedi ki adam.</b>",
   "Karagöz's comedy is built on <b>cinas</b> (pun) and deliberate mishearing: Hacivat speaks an ornate Ottoman, Karagöz hears it as plain words and answers the wrong question.",
   "The genre's fixed openings are worth knowing: Hacivat's <b>Hay Hak!</b>, and the call <b>Yâr bana bir eğlence!</b>",
   "Learning to hear the joke means hearing two registers at once — which is exactly the C1 listening skill."],
  tbl:[["napıyorsun","ne yapıyorsun"],["n'oldu","ne oldu"],["bişey","bir şey"],["gelmicem","gelmeyeceğim"],["valla","vallahi"]],
  eg:[["Napıyorsun sen ya?","What on earth are you doing?"],["Gelmedi ki adam.","But the man didn't come."],["Bişey söylicem sana.","I'm going to tell you something."]]},
 read:{t:"Perde kurulur",kind:"Uyarlama · geleneksel Karagöz oyunları üslubunda",src:"C1 · dialogue written in the traditional manner for this course",
  note:"Karagöz and Hacivat are the two figures of Ottoman shadow theatre, played behind a lit screen. Hacivat is educated and speaks in ornate compounds; Karagöz is blunt and mishears him on purpose. The plays are anonymous traditional repertoire.",
  lines:[["HACİVAT: Hay Hak! Vakt-i şerif hayrolsun, efendim.","HACİVAT: Hay Hak! May the noble hour be blessed, sir."],
   ["KARAGÖZ: Ne diyon sen ya? Vakit mi çaldın?","KARAGÖZ: What are you on about? Did you steal the time?"],
   ["HACİVAT: Estağfurullah, bendeniz bir muhavere arz edecektim.","HACİVAT: Heaven forbid, your servant was about to offer a conversation."],
   ["KARAGÖZ: Muhabbeti bırak da derdini söyle.","KARAGÖZ: Leave the sweet talk and tell me your trouble."],
   ["HACİVAT: Şu karşıki hanede bir bahçe tanzim ettirdim.","HACİVAT: I have had a garden laid out in yonder house."],
   ["KARAGÖZ: Bahçeyi tanzim ettirdin de bana ne? Bir tane fidan verdin mi?","KARAGÖZ: You had a garden laid out — what's that to me? Did you give me a single sapling?"],
   ["HACİVAT: Aman efendim, sizi de davet edecektim.","HACİVAT: Goodness, sir, I was going to invite you too."],
   ["KARAGÖZ: Davet ucuz, ziyafet tuzlu. Sen önce kapıyı aç da görelim.","KARAGÖZ: Invitations are cheap, the feast is pricey. Open the door first and let's see."]],
  gloss:{"vakt-i şerif":"the noble hour (a formal greeting)","estağfurullah":"not at all, heaven forbid","bendeniz":"your servant, I (humble)","muhavere":"conversation, dialogue","hane":"house","tanzim etmek":"to lay out, arrange","fidan":"sapling","ziyafet":"feast"}},
 drill:[
  {t:"mc",q:"The joke works because Hacivat speaks",a:["a foreign language","ornate Ottoman that Karagöz mishears as plain words","too quietly","in rhyme only"],c:1,why:"Two registers colliding is the whole genre."},
  {t:"fill",q:"“Ne yapıyorsun” in fast speech becomes ___ .",c:"napıyorsun",why:"A contraction you will hear constantly."},
  {t:"mc",q:"“Gelmedi ki adam.” is",a:["ungrammatical","an inverted spoken sentence","a question","formal"],c:1,why:"Devrik cümle — the verb leaves the end."},
  {t:"order",q:"Build: “Leave the sweet talk and tell me your trouble.”",w:["Muhabbeti","bırak","da","derdini","söyle"],c:"Muhabbeti bırak da derdini söyle"},
  {t:"mc",q:"“bendeniz” is",a:["rude","an old humble word for “I”","plural","a place"],c:1,why:"Persian bende, servant, + -niz."}],
 speak:"Take any sentence of formal Turkish and mishear it deliberately, Karagöz-style, three different ways."},

{id:"c1u10",lv:"C1",n:10,tr:"Makale yapısı",en:"The shape of a paper",focus:"akademik metin · alıntı · sonuç",
 vocab:[["çalışma","study"],["yöntem","method"],["bulgu","finding"],["veri","data"],["örneklem","sample"],["sınırlılık","limitation"],["alıntı","citation, quotation"],["kaynakça","bibliography"],["öneri","recommendation"],["katkı","contribution"]],
 gram:{t:"Makalenin kalıpları",en:"The frames of an academic article",
  body:["<b>Amaç</b>: <b>Bu çalışmanın amacı … incelemektir.</b> / <b>Bu makalede … ele alınmaktadır.</b>",
   "<b>Yöntem</b>: <b>Veriler … yoluyla toplanmıştır.</b> / <b>Örneklem … kişiden oluşmaktadır.</b>",
   "<b>Bulgu</b>: <b>Elde edilen bulgulara göre …</b> / <b>… olduğu görülmüştür.</b>",
   "<b>Tartışma</b>: <b>Bu sonuç, …-nın bulgularıyla örtüşmektedir / çelişmektedir.</b>",
   "<b>Sonuç</b>: <b>Sonuç olarak …</b> / <b>Bu çalışmanın sınırlılıklarından biri …</b> / <b>İleride yapılacak çalışmalarda … önerilmektedir.</b>",
   "Citation in Turkish: <b>Gökalp'e göre (1923)</b>, <b>… (Gökalp, 1923: 45)</b>, <b>yukarıda anılan çalışma</b>, <b>a.g.e.</b> (the same work cited above)."],
  tbl:[["ele almak","to take up, to treat"],["…-DAn oluşmak","to consist of"],["örtüşmek","to coincide with"],["çelişmek","to contradict"],["a.g.e.","op. cit."]],
  eg:[["Bu makalede Osmanlı seyahatnameleri ele alınmaktadır.","This article treats Ottoman travel accounts."],["Bulgular önceki çalışmalarla örtüşmektedir.","The findings coincide with previous studies."],["Sonuç olarak, konunun yeniden incelenmesi önerilmektedir.","In conclusion, a re-examination of the subject is recommended."]]},
 read:{t:"Bir özet",kind:"Özgün örnek metin · akademik özet",src:"C1 · specimen abstract written for this course",
  lines:[["Bu çalışmanın amacı, on yedinci yüzyıl Osmanlı seyahat metinlerinde şehir tasvirinin işlevini incelemektir.","The aim of this study is to examine the function of city description in seventeenth-century Ottoman travel texts."],
   ["Çalışmada, Evliya Çelebi'nin Seyahatnâme'sinden seçilen kırk bölüm nitel içerik çözümlemesiyle ele alınmıştır.","In the study, forty sections selected from Evliya Çelebi's Seyahatnâme are treated through qualitative content analysis."],
   ["Elde edilen bulgulara göre tasvirler, coğrafî bilgi vermekten çok okuru ikna etme işlevi taşımaktadır.","According to the findings obtained, the descriptions carry the function of persuading the reader rather than giving geographical information."],
   ["Bu sonuç, metni yalnızca bir belge olarak okuyan önceki yaklaşımlarla çelişmektedir.","This result contradicts earlier approaches that read the text merely as a document."],
   ["Çalışmanın sınırlılıklarından biri, örneklemin tek bir yazarla sınırlı tutulmasıdır.","One of the limitations of the study is that the sample is confined to a single author."],
   ["İleride yapılacak çalışmalarda aynı yöntemin başka seyyahlara uygulanması önerilmektedir.","In future studies the application of the same method to other travellers is recommended."]],
  gloss:{"işlev":"function","nitel":"qualitative","çözümleme":"analysis","coğrafî":"geographical","yaklaşım":"approach","seyyah":"traveller"}},
 drill:[
  {t:"mc",q:"“The aim of this study is to examine…” =",a:["Bu çalışma incelemek.","Bu çalışmanın amacı incelemektir.","Bu çalışmayı inceliyorum.","Bu çalışma incelenir."],c:1,why:"The standard opening frame."},
  {t:"fill",q:"Bulgular önceki çalışmalarla ___ . (coincide)",c:"örtüşmektedir",why:"örtüşmek + formal -mAktAdIr."},
  {t:"mc",q:"“a.g.e.” stands for",a:["a footnote number","the same work cited above","a publisher","anonymous"],c:1,why:"adı geçen eser."},
  {t:"order",q:"Build: “One of the limitations of the study is the sample.”",w:["Çalışmanın","sınırlılıklarından","biri","örneklemdir"],c:"Çalışmanın sınırlılıklarından biri örneklemdir"},
  {t:"mc",q:"Which section would “Elde edilen bulgulara göre” open?",a:["the aim","the method","the findings","the bibliography"],c:2,why:"Findings."}],
 speak:"Summarise any article you have read as a six-sentence Turkish abstract, one sentence per section."},

{id:"c2u1",lv:"C2",n:1,tr:"Osmanlıca katmanlar",en:"The Ottoman layers",focus:"terkipler · Arapça-Farsça söz varlığı",
 vocab:[["vicdan","conscience"],["hürriyet","liberty"],["cemiyet","society (older)"],["müessese","institution"],["tahammül","endurance"],["ıstırap","suffering"],["mukaddes","sacred"],["şayan","worthy of"],["bilâhare","subsequently"],["sarf etmek","to expend"]],
 gram:{t:"Terkip ve tabaka",en:"Compounds, and the three lexical layers",
  body:["Modern Turkish carries three stacked vocabularies for many concepts: the Turkic word, the Ottoman Arabic-Persian word, and the twentieth-century coinage. <b>ihtimal / olasılık</b>, <b>cevap / yanıt</b>, <b>hayat / yaşam</b>, <b>sual / soru</b>.",
   "They are rarely exact synonyms: the Ottoman word is usually graver, more formal, more literary. Choosing between them <i>is</i> style.",
   "Persian izafet reverses Turkish order — the head comes first: <b>hüsn-i niyet</b> (good intention), <b>hâl-i hazır</b> (the present state), <b>dâr-ül-fünun</b> (the house of sciences, the old name of Istanbul University).",
   "Arabic plurals survive in fixed phrases: <b>evrak</b> (papers), <b>ahval</b> (circumstances), <b>edebiyat</b>, <b>malumat</b>.",
   "Reading Tanzimat prose means holding a very long sentence in the head until its verb arrives."],
  tbl:[["hayat","yaşam"],["cevap","yanıt"],["ihtimal","olasılık"],["hürriyet","özgürlük"],["cemiyet","toplum"],["müessese","kurum"]],
  eg:[["Vicdan hürriyeti mukaddes bir haktır.","Freedom of conscience is a sacred right."],["Bu hâl, tahammül edilir gibi değildi.","This state was not to be endured."],["Buna dair malumatı bilâhare arz edeceğim.","I shall submit information on this subsequently."]]},
 read:{t:"Hürriyet üzerine",kind:"Uyarlama · Tanzimat dönemi gazete yazısı üslubunda",src:"C2 · written in the manner of Namık Kemal's generation",
  note:"Namık Kemal (1840–1888) and the Young Ottoman journalists forged a public political prose in Turkish, borrowing the sentence-shapes of French argument and the vocabulary of Arabic-Persian learning. This passage is written in that manner rather than quoted from it.",
  lines:[["İnsanın en tabii hakkı, hiç şüphesiz, kendi vicdanına göre yaşamak hakkıdır.","Man's most natural right is, beyond doubt, the right to live according to his own conscience."],
   ["Bu hakkı bir cemiyetten kaldırdığınız gün, o cemiyete ait bütün müesseseler mânâsını kaybeder.","The day you remove this right from a society, every institution belonging to that society loses its meaning."],
   ["Zira kanun, hürriyeti korumak için mevcuttur; hürriyet, kanuna tahammül etmek için değil.","For the law exists in order to protect liberty; liberty does not exist in order to endure the law."],
   ["Bir milletin ıstırabı, çektiği sıkıntının büyüklüğünden değil, sesini duyuramamasından doğar.","A nation's suffering arises not from the greatness of the hardship it bears but from its inability to make its voice heard."],
   ["Kalem, bu sesin en zayıf, fakat en kalıcı âletidir.","The pen is the weakest, yet the most enduring, instrument of that voice."],
   ["Şu hâlde yazmak, sarf edilen bir emek değil, ödenen bir borçtur.","In that case writing is not a labour expended but a debt discharged."],
   ["Bilâhare gelecek nesiller, bizim sükûtumuzu da yazılarımız kadar okuyacaklardır.","Subsequent generations will read our silence as much as our writings."]],
  gloss:{"zira":"for, because (formal)","mevcut":"existing, present","doğmak":"to be born, to arise","şu hâlde":"in that case","sükût":"silence"}},

  {t:"mc",q:"Modern equivalent of “hürriyet” is",a:["hüküm","özgürlük","hüner","hürmet"],c:1,why:"The Language Reform coinage from öz + gür."},
  {t:"mc",q:"“hüsn-i niyet” is built on",a:["Turkish possessive order","Persian izafet, head first","an Arabic plural","a verbal noun"],c:1,why:"Head + -i + modifier, the reverse of Turkish."},
  {t:"fill",q:"Bu hâle tahammül ___ değildi. (was not to be endured)",c:"edilir gibi",why:"A fixed literary frame: -Ir gibi değil."},
  {t:"order",q:"Build: “The law exists in order to protect liberty.”",w:["Kanun","hürriyeti","korumak","için","mevcuttur"],c:"Kanun hürriyeti korumak için mevcuttur"},
  {t:"mc",q:"“zira” belongs to which register?",a:["street slang","neutral spoken","formal / literary","children's books"],c:2,why:"Formal çünkü."}],
 speak:"Argue a position twice in two minutes: once in plain modern Turkish, once in the graver Ottoman-leaning register."},

{id:"c2u2",lv:"C2",n:2,tr:"Atasözleriyle düşünmek",en:"Thinking in proverbs",focus:"atasözü · tartışma dili",
 vocab:[["atasözü","proverb"],["özlü söz","aphorism"],["kanıt","evidence"],["savunmak","to defend a position"],["çürütmek","to refute"],["varsaymak","to assume"],["çelişki","contradiction"],["genelleme","generalisation"],["tutarlı","consistent"],["ikna etmek","to persuade"]],
 gram:{t:"Tartışma dili",en:"The language of argument",
  body:["Position: <b>kanımca, bana kalırsa, şahsen, bence</b>. Concession: <b>her ne kadar … olsa da, kabul etmek gerekir ki, doğrudur ancak…</b>",
   "Refutation: <b>…-DIğI iddia edilse de</b>, <b>bu görüş şu sebeple tutarsızdır</b>, <b>tam tersine</b>, <b>oysa gerçek şudur ki…</b>",
   "Turkish argument leans hard on proverbs as shared premises — and the stock is large enough to contradict itself, which is a useful rhetorical fact.",
   "<b>Bir taşla iki kuş vurmak</b> against <b>iki karpuz bir koltuğa sığmaz</b>: the proverb you pick is already your argument."],
  tbl:[["Damlaya damlaya göl olur.","Small steady effort accumulates."],["Acele işe şeytan karışır.","Haste invites the devil."],["Bir elin nesi var, iki elin sesi var.","Two hands make a sound."],["Ateş olmayan yerden duman çıkmaz.","No smoke without fire."],["Görünen köy kılavuz istemez.","An obvious thing needs no guide."]],
  eg:[["Her ne kadar zor olsa da denemek gerekir.","However hard it may be, one must try."],["Bu görüş, kendi içinde bir çelişki barındırmaktadır.","This view harbours a contradiction within itself."],["Tam tersine, veriler bunu çürütmektedir.","On the contrary, the data refute it."]]},
 read:{t:"Atasözleri birbirini yalanlar mı?",kind:"Özgün deneme",src:"C2 · essay written for this course",
  lines:[["Atasözlerinin bilgeliğine güvenenler, çoğu zaman aynı kültürün onlara zıt bir söz de ürettiğini fark etmezler.","Those who trust the wisdom of proverbs often fail to notice that the same culture has produced a saying to contradict them."],
   ["“Bir elin nesi var, iki elin sesi var” derken dayanışmayı överiz; “Nerede çokluk, orada bokluk” derken aynı çokluğu suçlarız.","When we say “one hand has nothing, two hands make a sound” we praise cooperation; when we say “where there is a crowd there is a mess” we blame that same crowd."],
   ["Bu, halk aklının tutarsızlığı değil, duruma bağlılığıdır.","This is not an inconsistency of popular reason but its dependence on circumstance."],
   ["Atasözü bir kanıt değil, bir çerçevedir; kanıtı yerine geçtiğinde tartışma biter.","A proverb is not evidence but a frame; when it stands in place of evidence, the argument is over."],
   ["Her ne kadar özlü sözler düşünmeyi kolaylaştırsa da, çoğu zaman düşünmenin yerine geçer.","However much aphorisms make thinking easier, they more often take the place of thinking."],
   ["Bir görüşü savunurken hangi atasözünü seçtiğimiz, o görüşün kendisi kadar bilgi vericidir.","Which proverb we choose while defending a position is as informative as the position itself."],
   ["Tam tersine, hiçbir atasözü kullanmadan bir fikri anlatabilmek, o fikri gerçekten anladığımızın kanıtıdır.","On the contrary, being able to explain an idea without using any proverb is the proof that we have really understood it."]],
  gloss:{"bilgelik":"wisdom","zıt":"opposite","dayanışma":"solidarity","çerçeve":"frame","yerine geçmek":"to take the place of","bilgi verici":"informative"}},
 drill:[
  {t:"mc",q:"“Her ne kadar zor olsa da” =",a:["because it is hard","however hard it may be","if it is hard","so that it is hard"],c:1,why:"A concessive frame."},
  {t:"fill",q:"Tam ___ , veriler bunu çürütüyor. (on the contrary)",c:"tersine",why:"tam tersine."},
  {t:"mc",q:"“Ateş olmayan yerden duman çıkmaz” is used to",a:["deny a rumour","suggest a rumour has some basis","warn about fire","praise honesty"],c:1,why:"No smoke without fire."},
  {t:"order",q:"Build: “A proverb is not evidence but a frame.”",w:["Atasözü","bir","kanıt","değil","bir","çerçevedir"],c:"Atasözü bir kanıt değil bir çerçevedir"},
  {t:"mc",q:"The essay's claim is that contradictory proverbs show",a:["folk wisdom is worthless","proverbs are context-bound frames, not proofs","Turkish is illogical","proverbs should be banned"],c:1,why:"“…tutarsızlığı değil, duruma bağlılığıdır.”"}],
 speak:"Defend a position for two minutes without using a single proverb; then defend the opposite using three."},

{id:"c2u3",lv:"C2",n:3,tr:"Konuşma nüansı",en:"The grain of speech",focus:"ya · işte · hani · canım · ki",
 vocab:[["hani","you know, where is"],["işte","there you are; precisely"],["canım","my dear; come on"],["yahu","hey, come now"],["bakar mısınız","excuse me (calling)"],["valla","honestly"],["neyse","anyway"],["falan","and so on, sort of"],["demek ki","so it means"],["ya","hey; or; what about"]],
 gram:{t:"Küçük kelimeler",en:"The small words that carry the tone",
  body:["<b>ya</b> — at the start, an appeal (<i>ya sen?</i> what about you?); at the end, insistence (<i>söyledim ya!</i> I told you!).",
   "<b>işte</b> — pointing: <i>işte bu</i> (that's exactly it), or resigned summary: <i>öyle işte</i> (that's how it is).",
   "<b>hani</b> — “you know the one…”: <i>hani şu adam vardı ya</i>. Also reproach: <i>hani gelecektin?</i> — you were supposed to come.",
   "<b>canım</b> — softens or dismisses: <i>yok canım!</i> (surely not!). <b>yahu</b> — friendly exasperation.",
   "<b>ki</b> at the end of a clause carries doubt: <i>gelmedi ki</i> — but he didn't come. <b>-DIr</b> guesses: <i>gelmiştir</i>, he'll have arrived by now.",
   "These words rarely appear in textbooks and are most of what makes speech sound Turkish."],
  tbl:[["ya","appeal / insistence"],["işte","exactly / that's that"],["hani","you know / but you said"],["canım","softening or dismissal"],["yahu","come on now"],["neyse","anyway, let it go"]],
  eg:[["Söyledim ya, gelmeyeceğim.","I told you, I'm not coming."],["Hani gelecektin?","But you said you'd come?"],["Yok canım, o kadar da değil.","Come on, it's not that bad."]]},
 read:{t:"Balıkçı kahvesi",kind:"Uyarlama · Sait Faik'in İstanbul öyküleri geleneğinde",src:"C2 · dialogue written for this course",
  note:"Sait Faik Abasıyanık (1906–1954) wrote the small lives of Istanbul's shores in a conversational Turkish that changed the short story. This dialogue is written in that tradition, not taken from him.",
  lines:[["— Hani şu Yorgo vardı ya, kahvenin önünde ağ örerdi.","— You know that Yorgo, the one who used to mend nets in front of the café."],
   ["— Ne olmuş ona?","— What's become of him?"],
   ["— Gitmiş işte. Adaya taşınmış, kimseye söylememiş.","— He's just gone. Moved to the island, told nobody."],
   ["— Yok canım! Elli yıldır bu iskelede oturuyordu.","— Surely not! He'd been sitting on this landing for fifty years."],
   ["— Valla öyle. Oğlu almış götürmüş.","— Honestly, that's how it is. His son came and took him."],
   ["— Ya kayığı? Kayığını da mı sattı yahu?","— And his boat? He sold the boat as well?"],
   ["— Satmadı ki. Bıraktı. Şurada duruyor, bak.","— He didn't sell it, though. He left it. It's standing right there, look."],
   ["— Demek ki dönecek. Adam kayığını bırakıyorsa döner.","— So he'll be back, then. If a man leaves his boat, he comes back."],
   ["— Belki. Neyse, çayını iç, soğuyor.","— Maybe. Anyway, drink your tea, it's going cold."]],
  gloss:{"ağ örmek":"to mend / weave nets","taşınmak":"to move house","kayık":"rowing boat","şurada":"just there","soğumak":"to go cold"}},
 drill:[
  {t:"mc",q:"“Söyledim ya!” conveys",a:["a question","insistence that you already said it","a polite offer","uncertainty"],c:1,why:"Final ya presses the point."},
  {t:"mc",q:"“Hani gelecektin?” is",a:["a plan","a reproach about a broken promise","a location question","a greeting"],c:1,why:"“But you said you'd come.”"},
  {t:"fill",q:"Satmadı ___ . Bıraktı. (but he didn't sell it)",c:"ki",why:"Clause-final ki marks contradiction of an assumption."},
  {t:"order",q:"Build: “Come on, it's not that bad.”",w:["Yok","canım","o","kadar","da","değil"],c:"Yok canım o kadar da değil"},
  {t:"mc",q:"“Gelmiştir.” in speech usually means",a:["he definitely came","he'll have arrived, I presume","he must come","he was coming"],c:1,why:"-DIr on a verb is a spoken guess."}],
 speak:"Record two minutes of unscripted speech and count how many of these particles you used. Aim for at least six."},

{id:"c2u4",lv:"C2",n:4,tr:"Tasavvufun dili",en:"The language of the mystics",focus:"mecaz · öğretici hikâye",
 vocab:[["gönül","the heart (as seat of feeling)"],["nefis","the lower self"],["hakikat","truth, reality"],["perde","veil, curtain"],["derviş","dervish"],["mürşit","guide, master"],["ayna","mirror"],["kibir","pride"],["tevazu","humility"],["menkıbe","edifying tale"]],
 gram:{t:"Mecaz ve öğreti",en:"Metaphor as argument",
  body:["Turkish mystical prose argues by image, and those images have entered the ordinary language: <b>gönül</b> not <i>kalp</i>, <b>perde</b> for what hides the truth, <b>ayna</b> for the polished self, <b>yol</b> for a whole life's discipline.",
   "Grammatically it favours the aorist <b>-(A)r</b> for timeless truths (<b>damla denize düşer</b>), the imperative for the reader, and <b>ki</b>-clauses for the turn of the lesson.",
   "Frames of the teaching tale: <b>Derler ki…</b>, <b>Bir gün…</b>, <b>Sormuşlar…, demiş.</b> Note the impersonal plural <b>sormuşlar</b> — “they asked”, meaning nobody in particular.",
   "The genre name is <b>menkıbe</b>; the point always arrives in the last line and is never explained afterwards."],
  tbl:[["-(A)r","timeless truth"],["Derler ki…","it is said that"],["sormuşlar","people asked"],["gönül","heart, inner self"],["nefis","ego, lower self"]],
  eg:[["Ayna ne kadar temizse, o kadar iyi gösterir.","The cleaner the mirror, the better it shows."],["Derler ki, arayan bulur.","It is said that the one who seeks, finds."],["Perde kalkınca kimse bir şey soramaz.","When the veil lifts, nobody can ask anything."]]},
 read:{t:"Karanlıktaki fil",kind:"Uyarlama · Mevlânâ'nın Mesnevî'sindeki hikâyeden",src:"C2 · retold in modern Turkish for this course",
  note:"The elephant in the dark is among the best-known teaching stories of the Mesnevî of Mevlânâ Celâleddin Rûmî (1207–1273), and reaches Turkish through centuries of translation and retelling. This is a modern retelling, not a translation of any one version.",
  lines:[["Derler ki, bir şehre uzak bir ülkeden bir fil getirmişler.","It is said that an elephant was brought to a city from a distant country."],
   ["Hayvanı karanlık bir ahıra koymuşlar; halk onu görmeye koşmuş.","They put the animal in a dark stable; the people ran to see it."],
   ["Karanlıkta göz işe yaramadığı için herkes elini uzatmış.","Since the eye is of no use in the dark, everyone stretched out a hand."],
   ["Hortumuna dokunan, “Bu hayvan bir oluğa benziyor,” demiş.","The one who touched its trunk said, “This animal is like a waterspout.”"],
   ["Kulağını tutan, “Hayır, büyük bir yelpaze bu,” diye itiraz etmiş.","The one who held its ear objected, “No, this is a great fan.”"],
   ["Ayağını yoklayan ise, “İkiniz de yanılıyorsunuz, bu bir sütundur,” demiş.","And the one who felt its leg said, “Both of you are mistaken; this is a column.”"],
   ["Her biri doğru söylüyormuş, çünkü her biri gerçekten dokunduğunu anlatıyormuş.","Each of them was speaking truly, for each was describing what he had genuinely touched."],
   ["Yine de hiçbiri fili bilmiyormuş; çünkü bir bütünü, parçasına dokunarak bilmek mümkün değilmiş.","Yet none of them knew the elephant; for it is not possible to know a whole by touching its part."],
   ["Ellerinde bir mum olsaydı, sözlerindeki ayrılık kalmazdı.","Had there been a candle in their hands, the difference in their words would have vanished."]],
  gloss:{"ahır":"stable","hortum":"trunk","oluk":"waterspout, gutter","yelpaze":"fan","yoklamak":"to feel, to probe","mum":"candle","ayrılık":"difference, separation"}},
 drill:[
  {t:"mc",q:"“Derler ki” introduces",a:["a personal memory","a traditional account","a command","a question"],c:1,why:"The impersonal plural of transmitted stories."},
  {t:"fill",q:"Ellerinde bir mum ___ , ayrılık kalmazdı. (if there had been)",c:"olsaydı",why:"Unreal past condition."},
  {t:"mc",q:"The tale argues that",a:["darkness is evil","partial experience produces honest but incomplete accounts","elephants are dangerous","touch is better than sight"],c:1,why:"Each hand reports truly; none reports the whole."},
  {t:"order",q:"Build: “It is not possible to know a whole by touching its part.”",w:["Bir","bütünü","parçasına","dokunarak","bilmek","mümkün","değildir"],c:"Bir bütünü parçasına dokunarak bilmek mümkün değildir"},
  {t:"mc",q:"“nefis” in this vocabulary means",a:["delicious","the lower self","breath of life","a poem"],c:1,why:"Though in everyday Turkish nefis does also mean delicious — context decides."}],
 speak:"Retell a teaching story you know in Turkish, ending on the lesson without explaining it."},

{id:"c2u5",lv:"C2",n:5,tr:"Kendi sesin",en:"Your own voice",focus:"üslup seçimi · serbest yazı",
 vocab:[["üslup","style"],["tercih","preference, choice"],["sezgi","intuition"],["yoğunluk","density, intensity"],["ölçü","measure"],["dolaylı","indirect"],["açıklık","clarity"],["tekrar","repetition"],["ritim","rhythm"],["kesinlik","certainty"]],
 gram:{t:"Üslup kararları",en:"The decisions that make a style",
  body:["At C2 the grammar is no longer the problem; the choice between two correct forms is. Each choice below is a register decision, not a rule.",
   "<b>Sentence length.</b> Turkish tolerates enormous subordination before the verb. Long = formal, argued, written. Short = spoken, literary, urgent.",
   "<b>-DIr or nothing.</b> <i>Bu doğrudur</i> is official; <i>bu doğru</i> is human.",
   "<b>Passive or agent.</b> <i>Yapılmıştır</i> hides a hand; <i>yaptılar</i> shows one. Bureaucratic Turkish hides; literary Turkish shows.",
   "<b>Ottoman or coinage.</b> <i>ihtimal</i> or <i>olasılık</i>, <i>şart</i> or <i>koşul</i> — the pair's gravity differs even when the sense does not.",
   "<b>Word order.</b> The slot just before the verb is the stressed one: <b>Ben yarın İstanbul'a gidiyorum</b> vs <b>İstanbul'a yarın ben gidiyorum</b>."],
  tbl:[["uzun cümle","argued, formal"],["kısa cümle","urgent, literary"],["-DIr","official"],["edilgen","impersonal"],["devrik cümle","spoken, poetic"]],
  eg:[["Gidiyorum ben.","(inverted — spoken, emphatic)"],["Bu mesele, incelenmesi gereken bir konudur.","(official)"],["Bunu incelemek lazım.","(plain)"]]},
 read:{t:"Sessizliğin tercümesi",kind:"Özgün deneme · kurs kapanışı",src:"C2 · closing essay written for this course",
  lines:[["Bir dili gerçekten öğrendiğinizi, kelimeleri bildiğinizde değil, hangi kelimeyi kullanmayacağınızı bildiğinizde anlarsınız.","You know you have truly learned a language not when you know the words, but when you know which word you will not use."],
   ["Türkçenin en zor tarafı ekleri değildir; ekler, öğrenilir ve biter.","The hardest part of Turkish is not its suffixes; suffixes are learned and done with."],
   ["Zor olan, fiilin cümlenin sonunda beklemesine alışmak, yani bir düşünceyi sonuna kadar taşıyabilmektir.","What is hard is getting used to the verb waiting at the end of the sentence — that is, being able to carry a thought all the way to its end."],
   ["Bu yüzden Türkçe konuşan biri, cümlesini bitirmeden ne diyeceğini gerçekten bilmek zorundadır.","For this reason someone speaking Turkish must really know what they are going to say before they finish the sentence."],
   ["Belki de bu dilin sabrı buradan gelir; belki de atasözlerinin bu kadar kısa olması bundandır.","Perhaps the patience of this language comes from here; perhaps that is why its proverbs are so short."],
   ["Okuduğunuz her metin, size bir kelime değil, bir ölçü bıraktı: ne zaman susulacağının ölçüsünü.","Every text you have read left you not a word but a measure: the measure of when to fall silent."],
   ["Şimdi sıra sizde. Yazın, konuşun, yanılın; çünkü yanılmayan kimse bu dilde hiçbir şey söylememiştir.","Now it is your turn. Write, speak, be wrong; for the one who is never wrong has said nothing at all in this language."]],
  gloss:{"tercüme":"translation","taraf":"side, aspect","alışmak":"to get used to","bundandır":"that is why","sıra sizde":"it's your turn","yanılmak":"to be mistaken"}},
 drill:[
  {t:"mc",q:"Which is the official register?",a:["Bunu incelemek lazım.","Bu mesele incelenmelidir.","Bunu bir bakalım.","İncele şunu."],c:1,why:"Passive + -mAlIdIr."},
  {t:"mc",q:"In “Gidiyorum ben”, the inversion signals",a:["a grammatical error","spoken emphasis","the future","a question"],c:1,why:"Devrik cümle — normal in speech and poetry."},
  {t:"fill",q:"The stressed slot in a Turkish sentence is the one ___ the verb.",c:"before",why:"Immediately preverbal position carries focus."},
  {t:"order",q:"Build: “Now it is your turn. Write, speak, be wrong.”",w:["Şimdi","sıra","sizde","yazın","konuşun","yanılın"],c:"Şimdi sıra sizde yazın konuşun yanılın"},
  {t:"mc",q:"The essay says the hardest thing about Turkish is",a:["vowel harmony","holding a thought until the final verb","the alphabet","Arabic loanwords"],c:1,why:"Everything else is learned and done with."}],
 speak:"Write 300 words on any subject, then rewrite them in the opposite register. Read both aloud and keep the one that sounds like you."},

{id:"c2u6",lv:"C2",n:6,tr:"Osmanlıca belgeler",en:"Ottoman documents",focus:"kalıp ifadeler · resmî hitap",
 vocab:[["arîza","a petition to a superior"],["ferman","imperial decree"],["berat","patent, warrant"],["divan","the imperial council"],["tuğra","the sultan's monogram"],["mühür","seal"],["rica","request"],["ol babda","in that matter"],["bâkî","the rest, remaining"],["duacınız","your well-wisher"]],
 gram:{t:"Belge kalıpları",en:"The formulae of Ottoman officialdom",
  body:["Ottoman documents are mostly formula. Learn the frames and the content becomes easy.",
   "Opening: <b>Devletlü, inayetlü, merhametlü … efendim hazretleri</b>. Closing: <b>Ol babda emr ü ferman hazret-i men lehü'l-emrindir.</b> — in that matter the command belongs to him whose is the command.",
   "Self-reference is humble: <b>bendeniz, kulunuz, duacınız, âciz</b>. The superior is <b>zât-ı âlîniz, hazretleri</b>.",
   "Verbs sit in high-register forms: <b>arz olunur, ifade kılınmıştır, tahrir olundu, ricasıyla</b>.",

const APP_VERSION="v2.00";

/* ===================== storage ===================== */
const KEY="turkce-course-v1";
let S={done:{},seen:{},place:null,star:[],tested:{},days:[],theme:null,srs:{},rate:0.85};
function load(){
  try{const r=localStorage.getItem(KEY); if(r){const o=JSON.parse(r); if(o&&typeof o==="object") S=Object.assign(S,o);}}catch(e){}
  if(!S.done)S.done={}; if(!S.seen)S.seen={}; if(!S.star)S.star=[]; if(!S.tested)S.tested={}; if(!S.days)S.days=[]; if(!S.srs)S.srs={};
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function touchDay(){const t=today(); if(S.days[S.days.length-1]!==t){S.days.push(t); if(S.days.length>400)S.days=S.days.slice(-400); save();}}
function streak(){
  if(!S.days.length)return 0;
  const set=new Set(S.days), d=new Date();
  const key=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  if(!set.has(key(d)))d.setDate(d.getDate()-1);
  let n=0;
  while(set.has(key(d))&&n<400){n++;d.setDate(d.getDate()-1);}
  return n;
}

const $=s=>document.querySelector(s);

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fold(s){
  return String(s).replace(/İ/g,"i").replace(/I/g,"i").replace(/ı/g,"i").replace(/Ş/g,"s").replace(/ş/g,"s")
   .replace(/Ğ/g,"g").replace(/ğ/g,"g").replace(/Ü/g,"u").replace(/ü/g,"u").replace(/Ö/g,"o").replace(/ö/g,"o")
   .replace(/Ç/g,"c").replace(/ç/g,"c").replace(/[âÂ]/g,"a").replace(/[îÎ]/g,"i").replace(/[ûÛ]/g,"u")
   .toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function unitsOf(lv){return UNITS.filter(u=>u.lv===lv);}
function unit(id){return UNITS.find(u=>u.id===id);}
function isDone(id){return !!S.done[id];}
function lvDone(lv){return unitsOf(lv).filter(u=>isDone(u.id)).length;}
function lvPct(lv){const a=unitsOf(lv);return a.length?Math.round(100*lvDone(lv)/a.length):0;}
function allPct(){return Math.round(100*UNITS.filter(u=>isDone(u.id)).length/UNITS.length);}
function currentLevel(){for(const l of LEVELS){if(lvPct(l.id)<100)return l.id;}return "C2";}
function nextUnit(){for(const u of UNITS){if(!isDone(u.id))return u;}return null;}

/* ===================== voice ===================== */
const VOICE={rate:0.85,mode:null,idx:0,tid:null,ready:false};
function ttsOK(){return typeof window!=="undefined"&&"speechSynthesis"in window;}
function trVoice(){
  if(!ttsOK())return null;
  let vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
  return vs.find(v=>/^tr/i.test(v.lang))||null;
}
if(ttsOK()){try{speechSynthesis.onvoiceschanged=function(){VOICE.ready=true;};}catch(e){}}
function say(text,rate,onend){
  if(!ttsOK())return false;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=trVoice(); if(v)u.voice=v;
    u.lang="tr-TR"; u.rate=rate||VOICE.rate;
    if(onend)u.onend=onend;
    speechSynthesis.speak(u); return true;
  }catch(e){return false;}
}
function sayLine(i){
  stopPlay();
  const u=unit(V.u); if(!u)return;
  hilite(i,true); say(u.read.lines[i][0]);
}
function sayWord(t){stopPlay();say(t,0.8);}
function hilite(i,once){
  const box=document.getElementById("passage"); if(!box)return;
  const all=box.querySelectorAll(".ln");
  for(let k=0;k<all.length;k++)all[k].classList.remove("now");
  const el=document.getElementById("ln"+i);
  if(el){el.classList.add("now"); if(!once)try{el.scrollIntoView({block:"center",behavior:"smooth"});}catch(e){}}
}
function vstat(t){const e=document.getElementById("vstat"); if(e)e.textContent=t;}
function playFrom(i,mode){
  stopPlay();
  if(!ttsOK()){vstat("Bu tarayıcıda ses yok · no speech on this browser");return;}
  VOICE.mode=mode; VOICE.idx=i||0; markMode(); stepPlay();
}
function stepPlay(){
  const u=unit(V.u); if(!u||!VOICE.mode)return stopPlay();
  const lines=u.read.lines;
  if(VOICE.idx>=lines.length){vstat("Bitti · finished");return stopPlay();}
  const i=VOICE.idx, t0=Date.now();
  hilite(i);
  vstat((VOICE.mode==="shadow"?"Gölge · ":"Dinle · ")+(i+1)+"/"+lines.length);
  const ok=say(lines[i][0],VOICE.rate,function(){
    if(!VOICE.mode)return;
    const dur=Math.max(700,Date.now()-t0);
    if(VOICE.mode==="shadow")vstat("Şimdi sen · your turn ("+(i+1)+"/"+lines.length+")");
    const gap=VOICE.mode==="shadow"?dur+500:300;
    VOICE.tid=setTimeout(function(){if(!VOICE.mode)return;VOICE.idx++;stepPlay();},gap);
  });
  if(!ok)stopPlay();
}
function stopPlay(){
  VOICE.mode=null;
  if(VOICE.tid){clearTimeout(VOICE.tid);VOICE.tid=null;}
  if(ttsOK()){try{speechSynthesis.cancel();}catch(e){}}
  markMode();
}
function markMode(){
  ["btn-listen","btn-shadow"].forEach(function(id){
    const b=document.getElementById(id); if(!b)return;
    const on=(id==="btn-listen"&&VOICE.mode==="listen")||(id==="btn-shadow"&&VOICE.mode==="shadow");
    b.classList.toggle("on",on);
  });
  if(!VOICE.mode)vstat("");
}
function setRate(r){VOICE.rate=r;S.rate=r;save();const m=VOICE.mode,i=VOICE.idx;stopPlay();
  document.querySelectorAll(".spd").forEach(function(b){b.classList.toggle("on",Math.abs(parseFloat(b.dataset.r)-r)<0.01);});
  if(m)playFrom(i,m);}

/* ===================== review queue (SRS) ===================== */
const STEPS=[0,1,2,4,8,16,32,64,120];
function dayNum(){return Math.floor(Date.now()/86400000);}
function srsAdd(k){if(!S.srs)S.srs={};if(!S.srs[k])S.srs[k]={b:0,d:dayNum()};}
function srsDrop(k){if(S.srs)delete S.srs[k];}
function dueList(){
  if(!S.srs)S.srs={};
  const n=dayNum();
  return S.star.filter(function(k){const r=S.srs[k];return !r||r.d<=n;});
}
function grade(k,g){
  if(!S.srs)S.srs={};
  const r=S.srs[k]||{b:0,d:dayNum()};
  if(g===0)r.b=0; else if(g===1)r.b=Math.min(r.b+1,STEPS.length-1); else r.b=Math.min(r.b+2,STEPS.length-1);
  r.d=dayNum()+STEPS[r.b]; S.srs[k]=r; save();
}
let RV=null;
function startReview(){
  const q=shuffle(dueList());
  if(!q.length){V={view:"words"};render();return;}
  RV={q:q,i:0,show:false,done:0}; V={view:"review"}; window.scrollTo(0,0); render();
}
function rvFlip(){RV.show=true;render();}
function rvGrade(g){grade(RV.q[RV.i],g);RV.done++;RV.i++;RV.show=false;window.scrollTo(0,0);render();}
function renderReview(){
  if(RV.i>=RV.q.length){
    app().innerHTML=bar("Tekrar","Bitti",true)+'<div class="wrap"><div class="score"><div class="big pass">'+RV.done+'</div>'+
      '<p class="sub">kelime tekrar edildi · words reviewed</p></div>'+
      '<p class="sub" style="text-align:center">'+dueList().length+' kelime bugün hâlâ bekliyor.</p>'+
      '<button class="btn" onclick="startReview()">Devam</button><button class="btn ghost" onclick="home()">Ana sayfa</button></div>';
    return;
  }
  const k=RV.q[RV.i], p=k.split("|"), r=(S.srs&&S.srs[k])||{b:0};
  let h=bar("Tekrar",(RV.i+1)+" / "+RV.q.length,true)+'<div class="wrap">';
  h+='<div class="prog">'+RV.q.map(function(_,i){return '<i class="'+(i<RV.i?"ok":"")+'"></i>';}).join('')+'</div>';
  h+='<div class="card" style="text-align:center;padding:2.4rem 1rem">'+
    '<p class="mark" style="font-size:2rem;margin:0">'+esc(p[0])+'</p>'+
    '<button class="sbtn" style="margin-top:.7rem" onclick="sayWord(\''+p[0].replace(/'/g,"\\'")+'\')">'+IC.spk+' dinle</button>'+
    (RV.show?'<p class="sub" style="margin-top:1rem;font-size:1.05rem">'+esc(p[1])+'</p>':'')+
    '<p class="tiny" style="margin-top:.8rem">kutu '+(r.b+1)+' / '+STEPS.length+'</p></div>';
  if(!RV.show)h+='<button class="btn" onclick="rvFlip()">Göster</button>';
  else h+='<div class="btn-row"><button class="btn ghost" onclick="rvGrade(0)">Zor</button>'+
    '<button class="btn" onclick="rvGrade(1)">İyi</button>'+
    '<button class="btn gold" onclick="rvGrade(2)">Kolay</button></div>'+
    '<p class="tiny" style="text-align:center;margin-top:.6rem">Zor: bugün tekrar · İyi: '+STEPS[Math.min(((S.srs&&S.srs[k]||{b:0}).b)+1,STEPS.length-1)]+' gün sonra</p>';
  h+='</div>';
  app().innerHTML=h;
}
