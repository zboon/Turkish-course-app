<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Türkçe · A1–C2</title>
<meta name="description" content="A self-paced Turkish course from A1 to C2, built around graded reading from Turkish literature.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F0EDE4; --card:#FAF8F3; --sunk:#E7E2D6;
  --ink:#1B2430; --ink2:#4A5566; --faint:#8A93A1;
  --line:#D8D2C4;
  --cobalt:#1D3F73; --cobalt-soft:#E3E8F1;
  --turk:#2C8B86; --turk-soft:#DDEDEB;
  --bole:#A6382C; --bole-soft:#F3E0DC;
  --gold:#B8873B; --gold-soft:#F2E7D0;
  --shadow:0 1px 0 rgba(27,36,48,.05);
  --r:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111821; --card:#18212C; --sunk:#0C1219;
    --ink:#E9E4D8; --ink2:#AEB6C1; --faint:#78828F;
    --line:#2A3542;
    --cobalt:#7FA6DE; --cobalt-soft:#1B2A3F;
    --turk:#4FBFB6; --turk-soft:#13302F;
    --bole:#E08476; --bole-soft:#33201D;
    --gold:#D8AC62; --gold-soft:#2C2416;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#111821; --card:#18212C; --sunk:#0C1219;
  --ink:#E9E4D8; --ink2:#AEB6C1; --faint:#78828F;
  --line:#2A3542;
  --cobalt:#7FA6DE; --cobalt-soft:#1B2A3F;
  --turk:#4FBFB6; --turk-soft:#13302F;
  --bole:#E08476; --bole-soft:#33201D;
  --gold:#D8AC62; --gold-soft:#2C2416;
  --shadow:none;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px); overflow-anchor:none}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Karla',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--cobalt)}
::selection{background:var(--gold-soft)}
:focus-visible{outline:2px solid var(--turk); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- chrome ---------- */
.bar{
  position:sticky; top:0; z-index:40;
  padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.bar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:.5rem;padding:.55rem .9rem}
.icon-btn{
  display:grid;place-items:center;width:34px;height:34px;flex:0 0 auto;
  background:none;border:1px solid var(--line);border-radius:9px;color:var(--ink2);
}
.icon-btn svg{width:17px;height:17px}
.bar-title{flex:1;min-width:0;text-align:center;font-weight:600;font-size:.95rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title small{display:block;font-weight:500;font-size:.72rem;color:var(--faint);letter-spacing:.02em}
.wrap{max-width:620px;margin:0 auto;padding:1.1rem .9rem 5rem}

/* ---------- hero ---------- */
.hero{padding:1.6rem 0 .4rem;text-align:center}
.mark{
  font-family:'Crimson Pro',Georgia,serif; font-weight:600;
  font-size:clamp(2.6rem,12vw,3.4rem); line-height:1; letter-spacing:-.01em; margin:0;
}
.mark .dot{color:var(--bole)}
.tag{margin:.45rem 0 0;color:var(--faint);font-size:.83rem}

/* the road: A1 -> C2 */
.road{margin:1.5rem 0 .3rem;position:relative}
.road-line{position:absolute;left:6%;right:6%;top:13px;height:2px;background:var(--line)}
.road-fill{position:absolute;left:6%;top:13px;height:2px;background:var(--turk);transition:width .6s ease}
.road-stops{position:relative;display:flex;justify-content:space-between;padding:0 6%}
.stop{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:.35rem;width:2.4rem}
.stop i{
  width:13px;height:13px;border-radius:50%;background:var(--paper);
  border:2px solid var(--line);display:block;margin-top:7px;transition:.2s;
}
.stop.done i{background:var(--turk);border-color:var(--turk)}
.stop.here i{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.stop b{font-size:.72rem;font-weight:600;color:var(--faint);letter-spacing:.04em}
.stop.done b,.stop.here b{color:var(--ink)}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:.95rem 1rem;margin:.6rem 0;
}
button.card,a.card{display:block;width:100%;text-align:left;text-decoration:none;color:inherit}
.row{display:flex;align-items:center;gap:.75rem}
.grow{flex:1;min-width:0}
.chev{color:var(--faint);flex:0 0 auto}
h2.sec{
  font-family:'Karla',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.06em;
  color:var(--faint);margin:1.7rem .2rem .5rem;
}
.lead{font-weight:600;font-size:1.02rem;margin:0}
.sub{color:var(--ink2);font-size:.84rem;margin:.15rem 0 0}
.tiny{color:var(--faint);font-size:.76rem}

/* continue ribbon */
.resume{border-left:3px solid var(--gold);background:linear-gradient(90deg,var(--gold-soft),var(--card) 60%)}

/* level card */
.lvl-badge{
  flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  font-weight:700;font-size:.95rem;background:var(--cobalt-soft);color:var(--cobalt);
  font-family:'Karla',sans-serif;letter-spacing:.01em;
}
.lvl-badge.on{background:var(--cobalt);color:#fff}
.lvl-badge.tested{background:var(--turk-soft);color:var(--turk)}
.meter{height:5px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:.55rem}
.meter i{display:block;height:100%;background:var(--turk);border-radius:99px;transition:width .5s ease}
.meter.gold i{background:var(--gold)}

/* unit row */
.unit{display:flex;gap:.8rem;align-items:flex-start;padding:.8rem .2rem;border-bottom:1px solid var(--line);
  background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.unit:last-child{border-bottom:0}
.tick{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;margin-top:.15rem;color:var(--faint);font-size:.72rem;font-weight:700}
.tick.done{background:var(--turk);border-color:var(--turk);color:#fff}
.tick.done svg{width:12px;height:12px}
.tick.here{border-color:var(--gold);color:var(--gold)}
.unit-t{font-weight:600;font-size:.97rem}
.unit-s{color:var(--ink2);font-size:.8rem;margin-top:.1rem}

/* segmented control */
.segs{display:flex;gap:.3rem;background:var(--sunk);padding:.25rem;border-radius:11px;margin:.2rem 0 1rem}
.segs button{flex:1;border:0;background:none;padding:.5rem .2rem;border-radius:8px;
  font-size:.79rem;font-weight:600;color:var(--ink2);white-space:nowrap}
.segs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.segs button i{display:block;font-style:normal;font-size:.62rem;color:var(--faint);font-weight:500}
.segs button.on i{color:var(--turk)}


/* voice bar */
.vbar{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.7rem .8rem;margin:.2rem 0 .4rem}
.vrow2{display:flex;gap:.4rem}
.vrow2+.vrow2{margin-top:.45rem}
.vb{flex:1;display:flex;align-items:center;justify-content:center;gap:.35rem;background:var(--sunk);
  border:1px solid transparent;border-radius:9px;padding:.5rem .3rem;font-size:.84rem;font-weight:600;color:var(--ink2)}
.vb svg{width:14px;height:14px}
.vb.on{background:var(--turk);color:#fff;border-color:var(--turk)}
.spds{gap:.3rem}
.spd{flex:1;background:none;border:1px solid var(--line);border-radius:8px;padding:.32rem .2rem;font-size:.76rem;color:var(--faint)}
.spd.on{border-color:var(--turk);color:var(--turk);font-weight:700}
.sbtn{display:inline-flex;align-items:center;gap:.3rem;background:none;border:0;padding:.25rem;color:var(--faint);font-size:.78rem}
.sbtn svg{width:17px;height:17px;display:block}
.sbtn:active{color:var(--turk)}
.ln-spk{float:right;margin:.05rem 0 0 .4rem;color:var(--line)}
.ln:hover .ln-spk,.ln.open .ln-spk,.ln.now .ln-spk{color:var(--faint)}
.ln.now{background:var(--turk-soft);border-left-color:var(--turk)}

/* ---------- vocabulary ---------- */
.vrow{display:flex;align-items:center;gap:.7rem;padding:.6rem .1rem;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vtr{font-weight:600;font-size:1.02rem}
.ven{color:var(--ink2);font-size:.86rem}
.star{background:none;border:0;padding:.3rem;color:var(--line);flex:0 0 auto}
.star svg{width:19px;height:19px;display:block}
.star.on{color:var(--gold)}

/* ---------- grammar ---------- */
.gram p{margin:.55rem 0;color:var(--ink2);font-size:.95rem}
.gram p b{color:var(--ink);font-weight:600}
.gram code{background:var(--sunk);border-radius:5px;padding:.08em .38em;font-family:'Karla',sans-serif;
  font-weight:600;font-size:.92em;color:var(--cobalt)}
.egs{margin:.8rem 0 0;border-top:1px solid var(--line)}
.eg{padding:.6rem 0;border-bottom:1px solid var(--line)}
.eg b{display:block;font-family:'Crimson Pro',serif;font-size:1.14rem;font-weight:600;line-height:1.35}
.eg span{color:var(--ink2);font-size:.85rem}
.table{width:100%;border-collapse:collapse;margin:.7rem 0;font-size:.88rem}
.table td{border:1px solid var(--line);padding:.4rem .5rem}
.table td:first-child{font-weight:600;background:var(--sunk);white-space:nowrap}

/* ---------- reading ---------- */
.src{font-size:.78rem;color:var(--faint);margin:-.2rem 0 1rem;line-height:1.45}
.src b{color:var(--ink2);font-weight:600}
.passage{font-family:'Crimson Pro',Georgia,serif;font-size:1.25rem;line-height:1.75}
.ln{margin:0 0 .35rem;padding:.25rem .45rem;border-radius:8px;cursor:pointer;border-left:2px solid transparent}
.ln:hover{background:var(--sunk)}
.ln.open{background:var(--cobalt-soft);border-left-color:var(--cobalt)}
.ln em{display:block;font-family:'Karla',sans-serif;font-style:normal;font-size:.83rem;
  color:var(--ink2);line-height:1.5;margin-top:.3rem}
.gw{border-bottom:1.5px dotted var(--gold);cursor:pointer}
.bubble{position:fixed;z-index:80;max-width:240px;background:var(--ink);color:var(--paper);
  padding:.45rem .65rem;border-radius:9px;font-size:.82rem;line-height:1.35;
  box-shadow:0 6px 24px rgba(0,0,0,.28);font-family:'Karla',sans-serif}
.bubble b{color:var(--gold)}

/* ---------- exercises ---------- */
.qn{color:var(--faint);font-size:.76rem;letter-spacing:.04em;margin-bottom:.4rem}
.q{font-size:1.06rem;font-weight:600;line-height:1.45;margin:0 0 .9rem}
.q .blank{color:var(--turk)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:11px;padding:.7rem .85rem;margin:.4rem 0;font-size:.98rem}
.opt.right{border-color:var(--turk);background:var(--turk-soft)}
.opt.wrong{border-color:var(--bole);background:var(--bole-soft)}
.opt.dim{opacity:.55}
.inp{width:100%;padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--ink);font:inherit;font-size:1rem}
.inp:focus{outline:none;border-color:var(--turk)}
.tiles{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:.42rem .7rem;font-size:.95rem}
.tile.used{opacity:.3;pointer-events:none}
.slot{min-height:52px;border:1.5px dashed var(--line);border-radius:11px;padding:.45rem;
  display:flex;flex-wrap:wrap;gap:.4rem;align-content:flex-start;background:var(--sunk)}
.fb{margin:.8rem 0 0;padding:.65rem .8rem;border-radius:11px;font-size:.87rem;line-height:1.5}
.fb.ok{background:var(--turk-soft);color:var(--ink)}
.fb.no{background:var(--bole-soft);color:var(--ink)}
.fb b{display:block;margin-bottom:.15rem}
.btn{display:block;width:100%;background:var(--cobalt);color:#fff;border:0;border-radius:12px;
  padding:.85rem;font-weight:700;font-size:.97rem;margin-top:1rem}
.btn.ghost{background:none;color:var(--cobalt);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:#241a06}
.btn[disabled]{opacity:.45}
.btn-row{display:flex;gap:.5rem}
.btn-row .btn{margin-top:1rem}
.prog{display:flex;gap:3px;margin:0 0 1.1rem}
.prog i{flex:1;height:3px;border-radius:99px;background:var(--sunk)}
.prog i.ok{background:var(--turk)} .prog i.no{background:var(--bole)}

/* score */
.score{text-align:center;padding:1.6rem 0 .6rem}
.score .big{font-family:'Crimson Pro',serif;font-size:3.4rem;line-height:1;font-weight:600}
.score .big.pass{color:var(--turk)} .score .big.fail{color:var(--bole)}
.ring{display:block;margin:0 auto}
.speak{border:1px dashed var(--line);border-radius:var(--r);padding:.9rem 1rem;background:none}
.speak .lead{font-size:.95rem}
.empty{text-align:center;color:var(--faint);padding:2.5rem 1rem;font-size:.9rem}
.foot{text-align:center;color:var(--faint);font-size:.73rem;margin-top:2.5rem;line-height:1.6}
.stat{display:flex;gap:.5rem;text-align:center;margin:.6rem 0}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .3rem}
.stat b{display:block;font-family:'Crimson Pro',serif;font-size:1.6rem;line-height:1.1;font-weight:600}
.stat span{font-size:.7rem;color:var(--faint)}
.pillrow{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.pill{font-size:.72rem;font-weight:600;padding:.22rem .55rem;border-radius:99px;
  background:var(--sunk);color:var(--ink2)}
.pill.turk{background:var(--turk-soft);color:var(--turk)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.cob{background:var(--cobalt-soft);color:var(--cobalt)}
</style>
</head>

 {id:"B1",tr:"Orta Türkçe 1",en:"Threshold",blurb:"Reported past, conditionals and the participles that replace relative clauses. Folk tales read easily."},
 {id:"B2",tr:"Orta Türkçe 2",en:"Vantage",blurb:"Passive, causative, obligation and the long linking suffixes. You can follow literary prose and argument."},
 {id:"C1",tr:"İleri Türkçe",en:"Advanced",blurb:"Formal and literary register, archaic forms, nominalised academic style. Real novels and essays."},
 {id:"C2",tr:"Akademik Türkçe",en:"Mastery",blurb:"Ottoman lexical layers, rhetoric, idiom and nuance. You read anything and choose your own register."}
];

const UNITS=[
/* ===== A1 — 10 units ===== */
{id:"a1u1",lv:"A1",n:1,tr:"Merhaba",en:"Hello",focus:"Ünlü uyumu · kişi ekleri",
 vocab:[["merhaba","hello"],["günaydın","good morning"],["iyi akşamlar","good evening"],["teşekkür ederim","thank you"],["evet","yes"],["hayır","no"],["ad / isim","name"],["nasılsın?","how are you? (informal)"],["memnun oldum","pleased to meet you"],["görüşürüz","see you"]],
 gram:{t:"Ünlü uyumu ve “-im”",en:"Vowel harmony and the “I am” ending",
  body:["Turkish builds words by gluing endings onto a stem. Which ending you use is decided by the <b>last vowel of the word</b> — this is vowel harmony, and it runs through everything else in the course.",
   "Two-way harmony (e-type): after <code>a ı o u</code> the ending takes <b>a</b>; after <code>e i ö ü</code> it takes <b>e</b>.",
   "Four-way harmony (i-type): after <code>a ı</code> → <b>ı</b>; after <code>e i</code> → <b>i</b>; after <code>o u</code> → <b>u</b>; after <code>ö ü</code> → <b>ü</b>.",
   "“To be” is not a verb but an ending: <code>-(y)Im</code> I am, <code>-sIn</code> you are, nothing at all for he/she/it."],
  tbl:[["ben","öğrenci<b>yim</b> — I am a student"],["sen","öğrenci<b>sin</b> — you are a student"],["o","öğrenci — he/she is a student"],["biz","öğrenci<b>yiz</b>"],["siz","öğrenci<b>siniz</b>"],["onlar","öğrenci<b>ler</b>"]],
  eg:[["Ben Türküm.","I am Turkish."],["Sen iyisin.","You are well."],["Benim adım Deniz.","My name is Deniz."]]},
 read:{t:"Tanışma",kind:"Özgün metin · written for this course",src:"A1 · 45 kelime",
  lines:[["— Merhaba! Benim adım Deniz.","Hello! My name is Deniz."],
   ["— Merhaba Deniz. Ben de Ayşe.","Hello Deniz. I am Ayşe."],
   ["— Memnun oldum. Nasılsın?","Pleased to meet you. How are you?"],
   ["— İyiyim, teşekkür ederim. Sen nasılsın?","I am well, thank you. How are you?"],
   ["— Ben de iyiyim. Sen öğrenci misin?","I am well too. Are you a student?"],

  {t:"mc",q:"Which ending follows “kitap”? (i-type harmony)",a:["-i","-ı","-u","-ü"],c:1,why:"The last vowel is a, so the four-way harmony gives ı."},
  {t:"fill",q:"Sen çok iyi___ .",c:"sin",why:"sen → -sIn; after i the vowel is i."},
  {t:"order",q:"Build: “My name is Ayşe.”",w:["Benim","adım","Ayşe"],c:"Benim adım Ayşe"},
  {t:"mc",q:"Someone says “Memnun oldum.” You reply:",a:["Hayır.","Ben de memnun oldum.","Görüşürüz.","Teşekkür ederim, günaydın."],c:1,why:"“Ben de” = me too."}],
 speak:"Introduce yourself out loud in five sentences: name, where you are from, what you do, how you are, and a goodbye."},

{id:"a1u2",lv:"A1",n:2,tr:"Bu ne?",en:"What is this?",focus:"bu/şu/o · çoğul -lAr · soru mI",
 vocab:[["kitap","book"],["defter","notebook"],["masa","table"],["sandalye","chair"],["kapı","door"],["pencere","window"],["harita","map"],["öğrenci","student"],["öğretmen","teacher"],["sınıf","classroom"]],

   "A yes-no question uses a separate little word <code>mı mi mu mü</code>, harmonised and written apart: <b>Bu kitap mı?</b>",

 read:{t:"Sınıfta",kind:"Özgün metin · written for this course",src:"A1 · 40 kelime",
  lines:[["Bu bir sınıf.","This is a classroom."],

{id:"a1u3",lv:"A1",n:3,tr:"Ailem",en:"My family",focus:"iyelik ekleri · tamlama",
 vocab:[["aile","family"],["anne","mother"],["baba","father"],["kardeş","sibling"],["abla","older sister"],["ağabey (abi)","older brother"],["çocuk","child"],["ev","house, home"],["büyük","big"],["küçük","small"]],
 gram:{t:"İyelik ekleri",en:"Possessive endings",
  body:["Turkish marks the owner on the thing owned. The endings follow four-way harmony, and a buffer <b>-s-</b> or <b>-n-</b> appears after a vowel.",
   "The owner itself takes the genitive <code>-(n)In</code>: <b>Ali<u>nin</u> kitab<u>ı</u></b> — Ali's book. Both halves are marked; that pairing is called a <i>tamlama</i>.",
   "Watch the softening: <b>kitap → kitab<u>ım</u></b>, <b>ağaç → ağac<u>ım</u></b>. Final p ç t k soften to b c d ğ before a vowel."],
  tbl:[["benim","ev<b>im</b> — my house"],["senin","ev<b>in</b>"],["onun","ev<b>i</b>"],["bizim","ev<b>imiz</b>"],["sizin","ev<b>iniz</b>"],["onların","ev<b>leri</b>"]],
  eg:[["Benim annem çok iyi.","My mother is very good."],["Annemin adı Sevgi.","My mother's name is Sevgi."],["Bizim evimiz küçük.","Our house is small."]]},
 read:{t:"Benim ailem",kind:"Özgün metin · written for this course",src:"A1 · 50 kelime",
  lines:[["Benim adım Zeynep. Bu benim ailem.","My name is Zeynep. This is my family."],
   ["Bu benim annem. Annemin adı Sevgi.","This is my mother. My mother's name is Sevgi."],
   ["Bu babam. Babamın adı Kemal.","This is my father. My father's name is Kemal."],
   ["Onlar benim kardeşlerim.","They are my siblings."],
   ["Kardeşimin adı Emre, ablamın adı Elif.","My brother's name is Emre, my sister's is Elif."],
   ["Bizim evimiz küçük ama çok güzel.","Our house is small but very nice."],
   ["Ailem benim için her şey.","My family is everything to me."]],
  gloss:{"ama":"but","her şey":"everything","için":"for"}},
 drill:[
  {t:"mc",q:"“my book” =",a:["kitapım","kitabım","kitabın","kitaplarım"],c:1,why:"p softens to b before the vowel ending: kitabım."},
  {t:"fill",q:"Bizim ev___ büyük. (our house)",c:"imiz",why:"biz → -(I)mIz."},
  {t:"mc",q:"“Ali'nin arabası” means",a:["Ali is a car","Ali's car","the car to Ali","with Ali's car"],c:1,why:"Genitive on the owner + possessive on the thing."},
  {t:"order",q:"Build: “My sister's name is Elif.”",w:["Ablamın","adı","Elif"],c:"Ablamın adı Elif"},
  {t:"mc",q:"Which is the genitive ending?",a:["-lar","-in","-de","-yor"],c:1,why:"-(n)In marks the owner."}],
 speak:"Describe your own family in six sentences, naming each person and one thing about them."},

{id:"a1u4",lv:"A1",n:4,tr:"Ne var, ne yok?",en:"What is there?",focus:"bulunma hâli -DA · var / yok · sayılar",
 vocab:[["var","there is / exists"],["yok","there isn't"],["market","shop"],["sokak","street"],["ağaç","tree"],["kedi","cat"],["su","water"],["ekmek","bread"],["çay","tea"],["oda","room"]],
 gram:{t:"-DA ve var / yok",en:"The locative, and there is / there isn't",
  body:["The locative ending <code>-da -de -ta -te</code> means <i>in, on, at</i>. It hardens to <b>t</b> after the voiceless consonants of the mnemonic <b>fıstıkçı şahap</b> (f s t k ç ş h p): <b>sokak<u>ta</u></b>, <b>ev<u>de</u></b>.",
   "There is no verb “to have”. You say <i>at the place there exists</i>: <b>Evde üç oda var.</b> The negative is <b>yok</b>.",
   "Possession works the same way: <b>Benim bir kedim var.</b> — literally “my cat exists”."],
  tbl:[["1–5","bir, iki, üç, dört, beş"],["6–10","altı, yedi, sekiz, dokuz, on"],["-da/-de","after b c d g ğ j l m n r v y z + vowels"],["-ta/-te","after f s t k ç ş h p"]],
  eg:[["Markette ekmek var.","There is bread in the shop."],["Burada kedi yok.","There is no cat here."],["Benim iki kardeşim var.","I have two siblings."]]},
 read:{t:"Bizim sokakta",kind:"Özgün metin · written for this course",src:"A1 · 50 kelime",
  lines:[["Bizim sokakta bir market var.","There is a shop on our street."],
   ["Markette ekmek, su ve çay var.","In the shop there is bread, water and tea."],
   ["Ama markette peynir yok.","But there is no cheese in the shop."],
   ["Sokakta üç ağaç ve iki kedi var.","On the street there are three trees and two cats."],
   ["Kedilerin adı Pamuk ve Duman.","The cats' names are Pamuk and Duman."],
   ["Okul burada değil, okul uzakta.","The school is not here, the school is far away."],
   ["Evde kaç oda var? Evde dört oda var.","How many rooms are there in the house? Four."]],
  gloss:{"peynir":"cheese","uzakta":"far away","kaç":"how many"}},
 drill:[
  {t:"mc",q:"“at school” =",a:["okulda","okulta","okulde","okuller"],c:0,why:"okul ends in l, which is voiced, so the ending stays soft: okulda."},
  {t:"fill",q:"Sokak___ iki kedi var. (on the street)",c:"ta",why:"sokak ends in k (fıstıkçı şahap) → -ta."},
  {t:"mc",q:"“I have a car.” =",a:["Ben araba var.","Benim arabam var.","Benim araba var.","Arabada ben var."],c:1,why:"Possessive on the thing + var."},
  {t:"order",q:"Build: “There is no bread at home.”",w:["Evde","ekmek","yok"],c:"Evde ekmek yok"},
  {t:"mc",q:"Which number is “yedi”?",a:["5","6","7","8"],c:2,why:"altı 6, yedi 7, sekiz 8."}],
 speak:"Describe your street: five things that are there, and two that are not."},

{id:"a1u5",lv:"A1",n:5,tr:"Her gün",en:"Every day",focus:"şimdiki zaman -(I)yor",
 vocab:[["gitmek","to go"],["gelmek","to come"],["yemek","to eat / food"],["içmek","to drink"],["okumak","to read"],["çalışmak","to work, to study"],["uyumak","to sleep"],["kalkmak","to get up"],["sabah","morning"],["akşam","evening"]],
 gram:{t:"Şimdiki zaman: -(I)yor",en:"The present continuous",
  body:["Drop the <code>-mak / -mek</code> of the infinitive, add <code>-(I)yor</code> and then the person ending. The <b>-yor</b> never changes shape, but the vowel before it harmonises: gel<b>iyor</b>, oku<b>yor</b>, çalış<b>ıyor</b>, uyu<b>yor</b>.",
   "Negative: insert <code>-mI-</code> → <b>gelmiyorum</b> (I am not coming). Question: <b>geliyor muyum?</b>",
   "This tense covers both <i>I am doing</i> and <i>I do these days</i>."],
  tbl:[["ben","gel<b>iyorum</b>"],["sen","gel<b>iyorsun</b>"],["o","gel<b>iyor</b>"],["biz","gel<b>iyoruz</b>"],["siz","gel<b>iyorsunuz</b>"],["onlar","gel<b>iyorlar</b>"]],
  eg:[["Türkçe öğreniyorum.","I am learning Turkish."],["O çalışmıyor.","He is not working."],["Ne yapıyorsun?","What are you doing?"]]},
 read:{t:"Bir gün",kind:"Özgün metin · with a folk proverb",src:"A1 · 55 kelime",
  lines:[["Sabah saat yedide kalkıyorum.","I get up at seven in the morning."],
   ["Kahvaltıda çay içiyorum ve ekmek yiyorum.","At breakfast I drink tea and eat bread."],
   ["Sonra okula gidiyorum ve Türkçe öğreniyorum.","Then I go to school and learn Turkish."],
   ["Öğlen arkadaşlarımla yemek yiyoruz.","At noon we eat with my friends."],
   ["Akşam eve dönüyorum, annem yemek pişiriyor.","In the evening I come home, my mother cooks."],
   ["Gece biraz kitap okuyorum, sonra uyuyorum.","At night I read a little, then I sleep."],
   ["Damlaya damlaya göl olur.","Drop by drop, a lake forms. (proverb)"]],
  gloss:{"kahvaltı":"breakfast","öğlen":"at noon","damla":"drop","göl":"lake"}},
 drill:[
  {t:"mc",q:"okumak → ben",a:["okuyorum","okiyorum","okuyorım","okuyor"],c:0,why:"Stem oku + yor + um."},
  {t:"fill",q:"O şimdi çalış___ . (is working)",c:"ıyor",why:"çalış + ıyor (last vowel ı)."},
  {t:"mc",q:"“I am not going.” =",a:["gitmiyorum","gitmeyorum","gidiyorum değil","gitmiyor"],c:0,why:"git + mi + yor + um; t stays voiceless before m."},
  {t:"order",q:"Build: “What are you doing in the evening?”",w:["Akşam","ne","yapıyorsun"],c:"Akşam ne yapıyorsun"},
  {t:"mc",q:"“Damlaya damlaya göl olur” means",a:["Lakes make rain","Small steady efforts add up","Water is life","Never drink alone"],c:1,why:"The Turkish equivalent of “many a little makes a mickle”."}],
 speak:"Narrate your own day from waking to sleeping, entirely in -(I)yor. Aim for ten sentences."},

{id:"a1u6",lv:"A1",n:6,tr:"Saat kaçta?",en:"At what time?",focus:"saatler · günler · -DA zaman",
 vocab:[["saat","hour, clock"],["dakika","minute"],["gün","day"],["hafta sonu","weekend"],["bugün","today"],["yarın","tomorrow"],["erken","early"],["geç","late"],["buluşmak","to meet"],["başlamak","to begin"]],
 gram:{t:"Saat ve zaman",en:"Telling time and fixing it in the sentence",
  body:["<b>Saat kaç?</b> asks the time; <b>Saat kaçta?</b> asks at what time. The answer takes the locative: <b>saat üç<u>te</u></b>, <b>saat yedi<u>de</u></b>.",
   "Past the hour uses the accusative + <b>geçiyor</b>: <b>üçü on geçiyor</b> (ten past three). Before the hour uses the dative + <b>var</b>: <b>üçe on var</b> (ten to three).",
   "Half past is <b>buçuk</b>: <b>üç buçuk</b>. Half of the <i>next</i> hour is never used, so 3:30 is “three and a half”, as in English.",
   "Days take <b>-DA</b> too: <b>pazartesi günü</b>, <b>hafta sonunda</b>, <b>sabahleyin</b>."],
  tbl:[["Saat kaç?","What time is it?"],["Saat üç.","It is three."],["üç buçuk","half past three"],["üçü çeyrek geçiyor","quarter past three"],["üçe çeyrek var","quarter to three"]],
  eg:[["Saat sekizde başlıyoruz.","We start at eight."],["Yarın erken kalkıyorum.","Tomorrow I am getting up early."],["Hafta sonunda çalışmıyorum.","I don't work at the weekend."]]},
 read:{t:"Randevu",kind:"Özgün metin · dialogue",src:"A1 · 45 kelime",
  lines:[["— Yarın saat kaçta buluşuyoruz?","What time are we meeting tomorrow?"],
   ["— Saat üçte. Kafe yediden ona kadar açık.","At three. The café is open from seven to ten."],
   ["— Üç bana geç. İki buçukta olur mu?","Three is late for me. Is half past two all right?"],
   ["— Olur. Ben biraz erken geliyorum.","That works. I'll come a little early."],
   ["— Peki, cumartesi günü görüşürüz.","Fine, see you on Saturday."],
   ["— Görüşürüz! Geç kalma.","See you! Don't be late."]],
  gloss:{"kadar":"up to, until","olur mu":"is that all right?","peki":"fine, all right","geç kalmak":"to be late"}},
 drill:[
  {t:"mc",q:"“at five o'clock” =",a:["saat beş","saat beşte","saat beşe","saat beşi"],c:1,why:"The time of an event takes the locative."},
  {t:"fill",q:"Saat iki ___ . (half past two)",c:"buçuk",why:"buçuk = half past."},
  {t:"mc",q:"“üçe on var” means",a:["ten past three","ten to three","three ten","at three"],c:1,why:"Dative + var counts down to the hour."},
  {t:"order",q:"Build: “What time are we meeting tomorrow?”",w:["Yarın","saat","kaçta","buluşuyoruz"],c:"Yarın saat kaçta buluşuyoruz"},
  {t:"mc",q:"Which is Saturday?",a:["perşembe","cuma","cumartesi","pazar"],c:2,why:"cumartesi Saturday, pazar Sunday."}],
 speak:"Say your whole week aloud: what you do on each day and at what time."},

{id:"a1u7",lv:"A1",n:7,tr:"Ne renk?",en:"What colour?",focus:"sıfatlar · renkler · çok / az",
 vocab:[["renk","colour"],["beyaz","white"],["siyah","black"],["kırmızı","red"],["mavi","blue"],["yeşil","green"],["sarı","yellow"],["uzun","long, tall"],["kısa","short"],["yeni","new"]],
 gram:{t:"Sıfatlar",en:"Adjectives, and how much",
  body:["Adjectives come before the noun and never change: <b>mavi ev</b>, <b>mavi evler</b>, <b>mavi evlerde</b>.",
   "Degree words sit before the adjective: <b>çok</b> (very), <b>biraz</b> (a bit), <b>az</b> (little), <b>hiç</b> (not at all, with a negative).",
   "<b>Ne renk?</b> asks the colour; <b>nasıl?</b> asks what something is like.",
   "Intensified colours double the first syllable: <b>bembeyaz</b> (snow-white), <b>kapkara</b> (pitch black), <b>masmavi</b> (deep blue) — a favourite move in Turkish description."],
  tbl:[["çok güzel","very beautiful"],["biraz uzun","a bit long"],["hiç kolay değil","not easy at all"],["ne renk?","what colour?"],["nasıl?","what is it like?"]],
  eg:[["Bu araba çok eski.","This car is very old."],["Deniz masmavi.","The sea is deep blue."],["Hiç param yok.","I have no money at all."]]},
 read:{t:"Çarşıda",kind:"Özgün metin · dialogue",src:"A1 · 50 kelime",
  lines:[["— Bu gömlek ne renk?","What colour is this shirt?"],
   ["— Mavi. Şurada beyazı da var.","Blue. There is a white one there too."],
   ["— Kolları biraz uzun.","The sleeves are a bit long."],
   ["— Bu kısa, ama çok pahalı.","This one is short, but very expensive."],
   ["— Hiç ucuz bir şey yok mu?","Isn't there anything cheap at all?"],
   ["— Var tabii. Şu yeşil gömlek yeni ve ucuz.","Of course there is. That green shirt is new and cheap."]],
  gloss:{"gömlek":"shirt","kol":"sleeve, arm","tabii":"of course","bir şey":"something, anything"}},
 drill:[
  {t:"mc",q:"“the blue houses” =",a:["maviler evler","mavi evler","evler mavi","mavi evleri"],c:1,why:"The adjective never takes the plural."},
  {t:"fill",q:"Bu araba ___ eski. (very)",c:"çok",why:"Degree word before the adjective."},
  {t:"mc",q:"“masmavi” is",a:["a shade of grey","deep, intensified blue","a place name","light blue"],c:1,why:"Reduplication intensifies a colour."},
  {t:"order",q:"Build: “Isn't there anything cheap at all?”",w:["Hiç","ucuz","bir","şey","yok","mu"],c:"Hiç ucuz bir şey yok mu"},
  {t:"mc",q:"“Nasıl?” asks",a:["what colour","what it is like","how many","where"],c:1,why:"Ne renk asks the colour."}],
 speak:"Describe five things in the room by colour and size, using çok and biraz."},

{id:"a1u8",lv:"A1",n:8,tr:"Kaç para?",en:"How much?",focus:"alışveriş · sayılar · -DAn",
 vocab:[["para","money"],["lira","lira"],["fiyat","price"],["kilo","kilo"],["tane","item, piece"],["almak","to take, buy"],["satmak","to sell"],["yarım","half"],["hepsi","all of it"],["bakkal","corner shop"]],
 gram:{t:"Alışveriş kalıpları",en:"The shopping frames",
  body:["Quantities use <b>-DAn</b>: <b>elmadan bir kilo</b> — a kilo of the apples; <b>bundan iki tane</b> — two of these.",
   "<b>tane</b> counts individual items: <b>üç tane ekmek</b>. Turkish keeps the noun singular after a number: <b>beş kitap</b>, never <i>beş kitaplar</i>.",
   "Useful frames: <b>Kaç para?</b> / <b>Ne kadar?</b> (how much), <b>Bir tane daha</b> (one more), <b>Başka bir şey?</b> (anything else), <b>Hepsi ne kadar?</b>",
   "Hundreds and thousands: <b>yüz</b>, <b>iki yüz</b>, <b>bin</b>, <b>beş bin</b>."],
  tbl:[["Kaç para?","How much is it?"],["bir kilo","a kilo"],["yarım kilo","half a kilo"],["üç tane","three of them"],["hepsi","all together"]],
  eg:[["Domatesten bir kilo alayım.","Let me take a kilo of tomatoes."],["Beş tane yumurta lütfen.","Five eggs please."],["Hepsi ne kadar?","How much is it altogether?"]]},
 read:{t:"Pazarda",kind:"Özgün metin · dialogue",src:"A1 · 55 kelime",
  lines:[["— Buyurun abla, domates taze!","Here you are, sister — the tomatoes are fresh!"],
   ["— Kaç para kilosu?","How much a kilo?"],
   ["— Otuz lira. Yarım kilo da olur.","Thirty lira. Half a kilo is fine too."],
   ["— Bir kilo domates, üç tane de biber alayım.","Let me take a kilo of tomatoes and three peppers."],
   ["— Başka bir şey? Elmadan da var.","Anything else? There are apples as well."],
   ["— Yok, teşekkürler. Hepsi ne kadar?","No, thank you. How much altogether?"],
   ["— Kırk beş lira abla, afiyet olsun.","Forty-five lira, sister — enjoy it."]],
  gloss:{"buyurun":"here you are / please go ahead","taze":"fresh","biber":"pepper","afiyet olsun":"enjoy your food"}},
 drill:[
  {t:"mc",q:"“five books” =",a:["beş kitaplar","beş kitap","beşi kitap","kitap beş"],c:1,why:"The noun stays singular after a number."},
  {t:"fill",q:"Domates___ bir kilo alayım. (of the tomatoes)",c:"ten",why:"Partitive ablative; domates ends in s → -ten."},
  {t:"mc",q:"“Hepsi ne kadar?” =",a:["Is this everything?","How much altogether?","Where is the rest?","Is it fresh?"],c:1,why:"hepsi = all of it."},
  {t:"order",q:"Build: “Let me take three peppers.”",w:["Üç","tane","biber","alayım"],c:"Üç tane biber alayım"},
  {t:"mc",q:"“Buyurun” is used",a:["only in shops","to offer, invite or hand something over","to say goodbye","to apologise"],c:1,why:"One of the most useful words in Turkish."}],
 speak:"Run a market dialogue aloud, both parts: greet, ask the price, buy three things, pay."},

{id:"a1u9",lv:"A1",n:9,tr:"Hava nasıl?",en:"How is the weather?",focus:"hava · mevsimler · -(y)Iyor",
 vocab:[["hava","weather, air"],["yağmur","rain"],["kar","snow"],["rüzgâr","wind"],["güneş","sun"],["bulut","cloud"],["sıcak","hot"],["soğuk","cold"],["mevsim","season"],["yağmak","to fall (of rain/snow)"]],
 gram:{t:"Hava kalıpları",en:"Weather, and impersonal sentences",
  body:["Weather sentences have no subject you translate: <b>Yağmur yağıyor</b> (rain is falling), <b>Kar yağıyor</b>, <b>Hava soğuk</b>.",
   "<b>Hava nasıl?</b> — what's the weather like. Answers are adjectives: <b>güneşli</b> (sunny), <b>bulutlu</b>, <b>rüzgârlı</b>, <b>yağmurlu</b> — all built with <code>-lI</code>, “having”.",
   "The opposite suffix is <code>-sIz</code>, “without”: <b>şekersiz çay</b>, tea without sugar.",
   "Seasons: <b>ilkbahar, yaz, sonbahar, kış</b>. In a season: <b>yazın</b>, <b>kışın</b> — an old adverbial ending."],
  tbl:[["-lI","yağmurlu — rainy"],["-sIz","şekersiz — without sugar"],["yazın","in summer"],["kışın","in winter"],["Hava nasıl?","What's the weather like?"]],
  eg:[["Bugün hava çok sıcak.","Today the weather is very hot."],["Dışarıda kar yağıyor.","It is snowing outside."],["Kışın burası çok soğuk olur.","In winter it gets very cold here."]]},
 read:{t:"Dört mevsim",kind:"Özgün metin",src:"A1 · 55 kelime",
  lines:[["Türkiye'de dört mevsim vardır.","In Turkey there are four seasons."],
   ["Yazın hava çok sıcak ve güneşlidir.","In summer the weather is very hot and sunny."],
   ["Kışın, özellikle doğuda, çok kar yağar.","In winter, especially in the east, a lot of snow falls."],
   ["İlkbaharda yağmurlu günler çoktur.","In spring there are many rainy days."],
   ["Sonbaharda hava serin ve rüzgârlıdır.","In autumn the weather is cool and windy."],
   ["Karadeniz'de her mevsim yağmur yağar.","On the Black Sea coast it rains in every season."]],
  gloss:{"özellikle":"especially","doğu":"east","serin":"cool","Karadeniz":"the Black Sea"}},
 drill:[
  {t:"mc",q:"“It is raining.” =",a:["Hava yağmur.","Yağmur yağıyor.","Yağmurlu var.","Yağmur oluyor."],c:1,why:"The rain does the falling."},
  {t:"fill",q:"Çayı şeker___ içerim. (without sugar)",c:"siz",why:"-sIz = without."},
  {t:"mc",q:"“bulutlu” means",a:["cloudless","cloudy","cloud","to cloud over"],c:1,why:"-lI = having."},
  {t:"order",q:"Build: “In winter it snows a lot here.”",w:["Kışın","burada","çok","kar","yağar"],c:"Kışın burada çok kar yağar"},
  {t:"mc",q:"“yazın” means",a:["your summer","in summer","summers","summery"],c:1,why:"An old adverbial form, still alive for seasons."}],
 speak:"Describe the weather where you are today, then in each of the four seasons."},

{id:"a1u10",lv:"A1",n:10,tr:"Nereye?",en:"Which way?",focus:"yönler · sıra sayıları · rica",
 vocab:[["sağ","right"],["sol","left"],["düz","straight"],["köşe","corner"],["durak","stop (bus)"],["cadde","avenue"],["dönmek","to turn"],["geçmek","to pass"],["birinci","first"],["yanında","next to"]],
 gram:{t:"Yön tarif etmek",en:"Giving directions",
  body:["Directions run on the dative and the imperative: <b>sağa dönün</b> (turn right), <b>düz gidin</b> (go straight), <b>köşeden geçin</b>.",
   "Ordinals take <code>-(I)ncI</code>: <b>birinci, ikinci, üçüncü, dördüncü, beşinci</b>.",
   "Position words are nouns and take a possessive: <b>ev<u>in</u> yanında</b> (beside the house), <b>masa<u>nın</u> üstünde</b>, <b>kapı<u>nın</u> önünde</b>, <b>arkasında</b>, <b>içinde</b>, <b>karşısında</b>.",
   "Polite openings: <b>Affedersiniz</b> (excuse me), <b>Pardon</b>, <b>… nerede acaba?</b>"],
  tbl:[["yanında","beside"],["önünde","in front of"],["arkasında","behind"],["üstünde","on top of"],["karşısında","opposite"],["içinde","inside"]],
  eg:[["İkinci sokaktan sağa dönün.","Turn right at the second street."],["Banka postanenin karşısında.","The bank is opposite the post office."],["Affedersiniz, durak nerede?","Excuse me, where is the stop?"]]},
 read:{t:"Yol tarifi",kind:"Özgün metin · dialogue",src:"A1 · 55 kelime",
  lines:[["— Affedersiniz, müze nerede acaba?","Excuse me, where is the museum?"],
   ["— Buradan düz gidin, sonra birinci caddeden sola dönün.","Go straight from here, then turn left at the first avenue."],
   ["— Uzak mı?","Is it far?"],
   ["— Yok, beş dakika. Köşede bir cami var.","No, five minutes. There is a mosque on the corner."],
   ["— Müze caminin yanında mı?","Is the museum next to the mosque?"],
   ["— Tam karşısında. Durağın arkasında kalıyor.","Right opposite it. It is behind the bus stop."],
   ["— Çok teşekkür ederim.","Thank you very much."]],
  gloss:{"acaba":"I wonder (softens a question)","tam":"exactly, right","kalmak":"to remain, to be situated"}},
 drill:[
  {t:"mc",q:"“Turn right.” =",a:["Sağ dönün.","Sağa dönün.","Sağda dönün.","Sağdan dönün."],c:1,why:"Turning is motion → dative."},
  {t:"fill",q:"Banka postane___ karşısında. (opposite the post office)",c:"nin",why:"Position words need a genitive owner."},
  {t:"mc",q:"“üçüncü” means",a:["three","third","triple","thirty"],c:1,why:"-(I)ncI makes ordinals."},
  {t:"order",q:"Build: “Go straight, then turn left.”",w:["Düz","gidin","sonra","sola","dönün"],c:"Düz gidin sonra sola dönün"},
  {t:"mc",q:"“acaba” in a question",a:["makes it a command","softens it politely","makes it negative","makes it past"],c:1,why:"“…I wonder?”"}],
 speak:"Give directions aloud from your home to the nearest shop, using at least four position words."},

{id:"a2u1",lv:"A2",n:1,tr:"Dün ne oldu?",en:"What happened yesterday?",focus:"görülen geçmiş zaman -DI",
 vocab:[["dün","yesterday"],["düğün","wedding"],["kürk","fur coat"],["elbise","clothes, dress"],["çorba","soup"],["vermek","to give"],["dönmek","to return"],["giymek","to wear, put on"],["dökmek","to pour, spill"],["herkes","everyone"]],
 gram:{t:"-DI geçmiş zaman",en:"The witnessed past",
  body:["<code>-dı -di -du -dü</code> (and <code>-tı -ti -tu -tü</code> after fıstıkçı şahap) is the past of things you saw or know for a fact.",
   "The person endings here are a different, shorter set: <b>-m, -n, —, -k, -nız, -lar</b>.",
   "Negative: <b>gitmedim</b>. Question: <b>gitti mi?</b>"],
  tbl:[["ben","git<b>tim</b>"],["sen","git<b>tin</b>"],["o","git<b>ti</b>"],["biz","git<b>tik</b>"],["siz","git<b>tiniz</b>"],["onlar","git<b>tiler</b>"]],
  eg:[["Dün sinemaya gittim.","Yesterday I went to the cinema."],["Onu görmedim.","I did not see him."],["Geldin mi?","Did you come?"]]},
 read:{t:"Ye kürküm ye",kind:"Halk anlatısı · Nasreddin Hoca (anonim), sadeleştirilmiş",src:"A2 · folk tale, simplified for this course",
  note:"Nasreddin Hoca is the 13th-century trickster-sage of Anatolian folklore; the stories are anonymous and public property. This is the most quoted of them all.",
  lines:[["Nasreddin Hoca bir düğüne gitti.","Nasreddin Hoca went to a wedding."],
   ["Eski elbiselerini giydi.","He put on his old clothes."],
   ["Kimse ona bakmadı, kimse ona yer vermedi.","Nobody looked at him, nobody gave him a seat."],
   ["Hoca eve döndü ve kürkünü giydi.","The Hoca returned home and put on his fur coat."],
   ["Sonra tekrar düğüne gitti.","Then he went to the wedding again."],
   ["Bu sefer herkes ayağa kalktı ve ona en güzel yeri verdi.","This time everyone stood up and gave him the best seat."],
   ["Hoca çorbayı aldı, kürkünün koluna döktü.","The Hoca took the soup and poured it on the sleeve of his coat."],
   ["“Ye kürküm ye!” dedi. “Bu ikram senin için.”","“Eat, my fur, eat!” he said. “This honour is for you.”"]],
  gloss:{"kimse":"nobody","ayağa kalkmak":"to stand up","tekrar":"again","ikram":"the offering, hospitality","kol":"sleeve, arm"}},
 drill:[
  {t:"mc",q:"gitmek → ben (past)",a:["gittim","gitdim","gidtim","gittin"],c:0,why:"t is voiceless, so the ending hardens: -ti."},
  {t:"fill",q:"Dün onu gör___ . (I did not see)",c:"medim",why:"gör + me + di + m."},
  {t:"mc",q:"Why did nobody give the Hoca a seat at first?",a:["He came late","He wore old clothes","He had no gift","He was a stranger"],c:1,why:"The point of the tale: the coat was honoured, not the man."},
  {t:"order",q:"Build: “Then he went to the wedding again.”",w:["Sonra","tekrar","düğüne","gitti"],c:"Sonra tekrar düğüne gitti"},
  {t:"mc",q:"“Ye kürküm ye” is used today to mean",a:["Food is sacred","People judge by appearances","Never lend clothes","Eat before a party"],c:1,why:"It is a standing idiom about respect given to appearance."}],
 speak:"Retell the Hoca story from memory in the past tense, in your own words."},

{id:"a2u2",lv:"A2",n:2,tr:"Gelecek ay",en:"Next month",focus:"gelecek zaman -(y)AcAk · -mAk istemek",
 vocab:[["gelecek","future; next"],["kalmak","to stay"],["buluşmak","to meet up"],["görmek","to see"],["istemek","to want"],["beklemek","to wait"],["otel","hotel"],["uçak","plane"],["hafta","week"],["belki","maybe"]],
 gram:{t:"-(y)AcAk ve istemek",en:"The future, and wanting to",
  body:["Future: <code>-acak / -ecek</code> plus the person ending. Before the <b>-ım / -ız</b> endings the final k softens to ğ: <b>gideceğim</b>, <b>geleceğiz</b>.",
   "To say you want to do something, keep the infinitive and add <b>istemek</b>: <b>gitmek istiyorum</b>.",
   "To say you like doing something: <b>yüzmeyi seviyorum</b> — the infinitive takes the accusative -yi."],
  tbl:[["ben","gel<b>eceğim</b>"],["sen","gel<b>eceksin</b>"],["o","gel<b>ecek</b>"],["biz","gel<b>eceğiz</b>"],["siz","gel<b>eceksiniz</b>"],["onlar","gel<b>ecekler</b>"]],
  eg:[["Yarın İstanbul'a gideceğim.","Tomorrow I will go to Istanbul."],["Seninle buluşmak istiyorum.","I want to meet with you."],["Balık yemek ister misin?","Would you like to eat fish?"]]},
 read:{t:"Sevgili Ayşe",kind:"Özgün metin · a letter",src:"A2 · 60 kelime",
  lines:[["Sevgili Ayşe,","Dear Ayşe,"],
   ["Gelecek ay İstanbul'a geleceğim ve üç gün kalacağım.","Next month I will come to Istanbul and stay three days."],
   ["Sultanahmet'te küçük bir otelde kalacağım.","I will stay in a small hotel in Sultanahmet."],
   ["İlk gün Ayasofya'yı göreceğim, sonra Kapalıçarşı'ya gideceğim.","The first day I will see Hagia Sophia, then I will go to the Grand Bazaar."],
   ["Seninle buluşmak istiyorum.","I want to meet up with you."],
   ["Birlikte balık yemek ister misin?","Would you like to eat fish together?"],
   ["Cevabını bekliyorum. Sevgiler, Deniz","I await your answer. With love, Deniz"]],
  gloss:{"sevgili":"dear","ilk":"first","birlikte":"together","cevap":"answer"}},
 drill:[
  {t:"mc",q:"gitmek → ben (future)",a:["gideceğim","gitecekim","gideceğim mi","gitiyorum"],c:0,why:"t softens to d, k softens to ğ: gideceğim."},
  {t:"fill",q:"Biz yarın gel___ . (we will come)",c:"eceğiz",why:"gel + eceğ + iz."},
  {t:"mc",q:"“I want to read this book.” =",a:["Bu kitabı okumak istiyorum.","Bu kitap okuyorum istiyorum.","Bu kitabı okuyacağım istiyorum.","Bu kitabı okumayı isterim mi."],c:0,why:"Infinitive + istemek."},
  {t:"order",q:"Build: “Would you like to drink tea?”",w:["Çay","içmek","ister","misin"],c:"Çay içmek ister misin"},
  {t:"mc",q:"In the letter, how long will Deniz stay?",a:["a week","three days","one month","two nights"],c:1,why:"üç gün kalacağım."}],
 speak:"Describe your next trip: where you will go, how long you will stay, three things you will do."},

{id:"a2u3",lv:"A2",n:3,tr:"Yolculuk",en:"The journey",focus:"-(y)A · -(y)I · -DAn",
 vocab:[["yolculuk","journey"],["vadi","valley"],["balon","balloon"],["yükselmek","to rise"],["ayrılmak","to leave, depart"],["bırakmak","to leave behind"],["geçmek","to pass, cross"],["izlemek","to watch"],["erken","early"],["mağara","cave"]],
 gram:{t:"Üç hâl eki",en:"The three movement cases",
  body:["<b>Dative</b> <code>-(y)a / -(y)e</code> — motion towards: <b>eve</b> (to the house), <b>İstanbul'a</b>.",
   "<b>Accusative</b> <code>-(y)ı -i -u -ü</code> — a <i>definite</i> object only: <b>kitabı okudum</b> (I read the book) vs <b>kitap okudum</b> (I read a book / did some reading).",
   "<b>Ablative</b> <code>-dan -den -tan -ten</code> — from, out of, than: <b>evden çıktım</b>.",
   "Proper names take an apostrophe before the ending: <b>Ankara'dan</b>."],
  tbl:[["-(y)A","to — okula, bana"],["-(y)I","the — kapıyı, onu"],["-DAn","from — okuldan, senden"],["-DA","at, in — okulda"]],
  eg:[["Nevşehir'den Göreme'ye gittim.","I went from Nevşehir to Göreme."],["Balonları izledim.","I watched the balloons."],["Senden bir şey istiyorum.","I want something from you."]]},
 read:{t:"Kapadokya",kind:"Özgün metin · travel writing",src:"A2 · 55 kelime",
  lines:[["Geçen yaz Kapadokya'ya gittim.","Last summer I went to Cappadocia."],
   ["Nevşehir'den Göreme'ye otobüsle geçtim.","I crossed from Nevşehir to Göreme by bus."],
   ["Sabah erkenden balonları izledim.","Early in the morning I watched the balloons."],
   ["Balonlar vadinin üstünde yavaşça yükseldi.","The balloons rose slowly above the valley."],
   ["Peri bacalarını fotoğrafladım.","I photographed the fairy chimneys."],
   ["Bir mağarada çay içtim ve uzun uzun baktım.","I drank tea in a cave and looked for a long time."],
   ["Akşam köyden ayrıldım ama kalbimi orada bıraktım.","In the evening I left the village but left my heart there."]],
  gloss:{"geçen yaz":"last summer","yavaşça":"slowly","peri bacası":"fairy chimney (the rock cones of Cappadocia)","kalp":"heart"}},
 drill:[
  {t:"mc",q:"“I am going to school.” =",a:["Okulda gidiyorum.","Okula gidiyorum.","Okuldan gidiyorum.","Okulu gidiyorum."],c:1,why:"Motion towards → dative -a."},
  {t:"fill",q:"Ankara'___ İzmir'e gittim. (from Ankara)",c:"dan",why:"Ablative after a vowel-final proper name: Ankara'dan."},
  {t:"mc",q:"Which sentence means “I read THE book”?",a:["Kitap okudum.","Kitabı okudum.","Kitaba okudum.","Kitapta okudum."],c:1,why:"The accusative marks a definite object."},
  {t:"order",q:"Build: “I watched the balloons in the morning.”",w:["Sabah","balonları","izledim"],c:"Sabah balonları izledim"},
  {t:"mc",q:"“Kalbimi orada bıraktım” is",a:["literal — he lost an organ","an idiom of attachment","a medical complaint","a question"],c:1,why:"The same image as “I left my heart there”."}],
 speak:"Describe a journey you have made, using at least one dative, one ablative and one accusative in every sentence you can."},

{id:"a2u4",lv:"A2",n:4,tr:"Yapabilir misin?",en:"Can you?",focus:"-(y)Abilmek · emir kipi",
 vocab:[["ödünç almak","to borrow"],["komşu","neighbour"],["kazan","cauldron"],["tencere","pot"],["doğurmak","to give birth"],["inanmak","to believe"],["kızmak","to get angry"],["sevinmek","to be glad"],["ölmek","to die"],["gülmek","to laugh"]],
 gram:{t:"-(y)Abilmek",en:"Can, may, might",
  body:["Ability and permission: verb stem + <code>-(y)abil / -(y)ebil</code> + tense. <b>gelebilirim</b> I can come, <b>gelebildim</b> I managed to come.",
   "The negative is irregular and worth memorising: <b>gelemem</b> (I can't come), <b>gelemedim</b> (I couldn't), <b>gelemiyorum</b> (I am unable to).",
   "Commands: bare stem for <i>sen</i> (<b>gel!</b>), <code>-in / -ın</code> for polite <i>siz</i> (<b>gelin</b>, <b>buyurun</b>). Negative: <b>gelme!</b>"],
  tbl:[["yapabilirim","I can do"],["yapamam","I cannot do"],["yapabildim","I managed to do"],["yapamadım","I could not do"],["yap!","do! (sen)"],["yapın!","do! (siz)"]],
  eg:[["Bana yardım edebilir misin?","Can you help me?"],["Bugün gelemem.","I can't come today."],["Lütfen buraya oturun.","Please sit here."]]},
 read:{t:"Kazan doğurdu",kind:"Halk anlatısı · Nasreddin Hoca (anonim), sadeleştirilmiş",src:"A2 · folk tale, simplified for this course",
  lines:[["Nasreddin Hoca komşusundan bir kazan ödünç aldı.","Nasreddin Hoca borrowed a cauldron from his neighbour."],
   ["Birkaç gün sonra kazanı geri götürdü.","A few days later he took the cauldron back."],
   ["Kazanın içine küçük bir tencere koydu.","He had put a small pot inside the cauldron."],
   ["Komşusu sordu: “Bu tencere ne?”","His neighbour asked: “What is this pot?”"],
   ["Hoca, “Kazanın doğurdu,” dedi.","The Hoca said: “Your cauldron gave birth.”"],
   ["Komşu çok sevindi ve ikisini de aldı.","The neighbour was delighted and took them both."],
   ["Bir süre sonra Hoca kazanı yine istedi, ama geri getirmedi.","A while later the Hoca asked for the cauldron again, but did not bring it back."],
   ["Komşu kızdı. Hoca, “Kazan öldü,” dedi.","The neighbour got angry. The Hoca said: “The cauldron died.”"],
   ["“Kazan ölebilir mi?” diye bağırdı komşu.","“Can a cauldron die?” the neighbour shouted."],
   ["Hoca güldü: “Doğurduğuna inanabiliyorsan, öldüğüne de inanabilirsin.”","The Hoca laughed: “If you can believe it gave birth, you can believe it died.”"]],
  gloss:{"birkaç":"a few","geri götürmek":"to take back","bir süre sonra":"a while later","diye":"saying, as"}},
 drill:[
  {t:"mc",q:"“I cannot come tomorrow.” =",a:["Yarın gelebilmem.","Yarın gelemem.","Yarın gelmem bilirim.","Yarın gelmiyorum bilmem."],c:1,why:"The negative of -Abilmek is -AmA-."},
  {t:"fill",q:"Bana yardım ed___ misin? (can you help)",c:"ebilir",why:"et- → ed- + ebilir."},
  {t:"mc",q:"Polite command “please wait” =",a:["Bekle!","Bekleyin.","Beklemek.","Bekliyorsun."],c:1,why:"-in/-ın is the polite plural imperative."},
  {t:"order",q:"Build: “Can a cauldron die?”",w:["Kazan","ölebilir","mi"],c:"Kazan ölebilir mi"},
  {t:"mc",q:"The joke turns on",a:["a borrowed pot","the neighbour's greed","a broken cauldron","the Hoca's poverty"],c:1,why:"He accepted the profitable lie, so he must accept the costly one."}],
 speak:"Ask five polite favours using -(y)Abilir misiniz, then refuse five using -AmAm."},

{id:"a2u5",lv:"A2",n:5,tr:"Daha güzel",en:"More beautiful",focus:"karşılaştırma · sıfatlar",
 vocab:[["daha","more"],["en","most"],["kadar","as much as, until"],["gibi","like"],["kalabalık","crowded"],["sakin","calm, quiet"],["pahalı","expensive"],["ucuz","cheap"],["yorgan","quilt"],["uzatmak","to stretch out"]],
 gram:{t:"daha · en · kadar · gibi",en:"Comparing things",
  body:["Comparative: <b>daha</b> before the adjective, and the thing compared takes the ablative: <b>İstanbul, Ankara'<u>dan</u> daha kalabalık.</b>",
   "Superlative: <b>en</b> — <b>en güzel şehir</b>, the most beautiful city.",
   "Equality: <b>kadar</b> — <b>senin kadar hızlı</b>, as fast as you. Resemblance: <b>gibi</b> — <b>bir çocuk gibi</b>, like a child.",
   "Adjectives never change for number or case: <b>güzel evler</b>, not <i>güzeller evler</i>."],
  tbl:[["A, B'den daha X","A is more X than B"],["en X","the most X"],["A kadar X","as X as A"],["X gibi","like X"]],
  eg:[["Bu ev ondan daha büyük.","This house is bigger than that one."],["En sevdiğim şehir İzmir.","My favourite city is İzmir."],["Baban gibi konuşuyorsun.","You talk like your father."]]},
 read:{t:"İki şehir",kind:"Özgün metin · with a folk proverb",src:"A2 · 60 kelime",
  lines:[["İstanbul, Ankara'dan daha kalabalık.","Istanbul is more crowded than Ankara."],
   ["Ankara ise İstanbul kadar büyük değil, ama daha sakin.","Ankara, on the other hand, is not as big as Istanbul, but calmer."],
   ["İstanbul'da evler çok pahalı; Ankara'da biraz daha ucuz.","In Istanbul houses are very expensive; in Ankara a little cheaper."],
   ["Bence en güzel şehir, insanın kendi şehridir.","In my view the most beautiful city is one's own city."],
   ["Büyük ev her zaman iyi değildir.","A big house is not always good."],
   ["Atalarımız der ki: Ayağını yorganına göre uzat.","Our forebears say: stretch your legs as far as your quilt reaches."]],
  gloss:{"ise":"as for, whereas","bence":"in my opinion","atalarımız":"our ancestors","göre":"according to"}},
 drill:[
  {t:"mc",q:"“Istanbul is bigger than Ankara.” =",a:["İstanbul Ankara daha büyük.","İstanbul Ankara'dan daha büyük.","İstanbul'dan Ankara daha büyük.","İstanbul en Ankara büyük."],c:1,why:"The compared thing takes the ablative."},
  {t:"fill",q:"Bu, en ___ şehir. (beautiful)",c:"güzel",why:"en + adjective, unchanged."},
  {t:"mc",q:"“Ayağını yorganına göre uzat” advises",a:["Sleep more","Live within your means","Buy a longer quilt","Travel light"],c:1,why:"Spend according to what you have."},
  {t:"order",q:"Build: “You talk like your father.”",w:["Baban","gibi","konuşuyorsun"],c:"Baban gibi konuşuyorsun"},
  {t:"mc",q:"“senin kadar” means",a:["more than you","as much as you","without you","after you"],c:1,why:"kadar marks equality."}],
 speak:"Compare two cities you know in eight sentences, using daha, en, kadar and gibi at least once each."},

{id:"a2u6",lv:"A2",n:6,tr:"Her zaman",en:"Always",focus:"geniş zaman -(A)r",
 vocab:[["genellikle","usually"],["bazen","sometimes"],["her zaman","always"],["asla","never"],["alışkanlık","habit"],["inanmak","to believe"],["sevmek","to like, love"],["bilmek","to know"],["anlamak","to understand"],["düşünmek","to think"]],
 gram:{t:"Geniş zaman",en:"The aorist: habits and general truths",
  body:["<code>-(A)r / -Ir</code> states what is generally so, not what is happening now: <b>Her sabah çay içerim.</b>",
   "Single-syllable stems usually take <code>-Ar</code> (<b>yaparım, gelirim</b> — but learn the common ones by ear); longer stems take <code>-Ir</code>: <b>çalışırım, öğrenirim</b>.",
   "The negative is irregular and very common: <b>yapmam, yapmazsın, yapmaz, yapmayız, yapmazsınız, yapmazlar</b>.",
   "It also softens requests and offers: <b>Bir çay alır mısınız?</b>, <b>Yardım eder misiniz?</b> — politer than -(I)yor.",
   "Compare: <b>Sigara içiyorum</b> (I'm smoking right now) vs <b>Sigara içerim</b> (I'm a smoker)."],
  tbl:[["ben","gel<b>irim</b> / yap<b>arım</b>"],["sen","gelirsin"],["o","gelir"],["olumsuz","gelmem, gelmezsin, gelmez"],["rica","gelir misiniz?"]],
  eg:[["Genellikle otobüsle giderim.","I usually go by bus."],["O et yemez.","He doesn't eat meat."],["Bana yardım eder misiniz?","Would you help me?"]]},
 read:{t:"Alışkanlıklar",kind:"Özgün metin",src:"A2 · 60 kelime",
  lines:[["Ben sabahları genellikle erken kalkarım.","I usually get up early in the mornings."],
   ["Kahvaltıda çay içerim, kahve içmem.","At breakfast I drink tea; I don't drink coffee."],
   ["Hafta içi işe yürüyerek giderim, bazen otobüse binerim.","On weekdays I walk to work, sometimes I take the bus."],
   ["Akşamları televizyon izlemem; kitap okumayı tercih ederim.","In the evenings I don't watch television; I prefer reading."],
   ["Türkler misafire her zaman çay ikram eder.","Turks always offer tea to a guest."],
   ["“Bir fincan kahvenin kırk yıl hatırı vardır,” derler.","“A cup of coffee is remembered for forty years,” they say."]],
  gloss:{"hafta içi":"weekdays","tercih etmek":"to prefer","misafir":"guest","hatır":"memory, regard, the claim of friendship"}},
 drill:[
  {t:"mc",q:"“I don't drink coffee (ever).” =",a:["Kahve içmiyorum.","Kahve içmem.","Kahve içmedim.","Kahve içmeyeceğim."],c:1,why:"Habitual negative is the irregular -mAm."},
  {t:"fill",q:"Genellikle otobüsle git___ . (I go)",c:"erim",why:"git- → gider + im."},
  {t:"mc",q:"Which is the politer request?",a:["Yardım ediyor musun?","Yardım eder misiniz?","Yardım edeceksin.","Yardım ettin mi?"],c:1,why:"The aorist softens."},
  {t:"order",q:"Build: “Turks always offer tea to a guest.”",w:["Türkler","misafire","her","zaman","çay","ikram","eder"],c:"Türkler misafire her zaman çay ikram eder"},
  {t:"mc",q:"“Sigara içerim” means",a:["I am smoking now","I smoke / I am a smoker","I will smoke","I used to smoke"],c:1,why:"The aorist states a standing fact."}],
 speak:"Describe your habits in ten aorist sentences, including three negatives."},

{id:"a2u7",lv:"A2",n:7,tr:"Ne zamandır?",en:"For how long?",focus:"-DAn beri · -DIr · süre",
 vocab:[["beri","since"],["önce","ago, before"],["sonra","after"],["hâlâ","still"],["artık","from now on, any more"],["henüz","yet"],["yıl","year"],["ay","month; moon"],["süre","period"],["boyunca","throughout"]],
 gram:{t:"Süre anlatmak",en:"Saying how long",
  body:["A <b>point</b> in time takes <code>-DAn beri</code>: <b>sabahtan beri</b> (since the morning), <b>2019'dan beri</b>.",
   "A <b>length</b> of time takes <code>-DIr</code>: <b>üç yıldır</b> (for three years), <b>iki saattir</b>.",
   "Turkish uses the present tense with both, where English uses the perfect: <b>Üç yıldır burada çalışıyorum</b> — I have been working here for three years.",
   "<b>önce</b> = ago: <b>iki yıl önce</b>. <b>boyunca</b> = throughout: <b>yıllar boyunca</b>.",
   "<b>hâlâ</b> (still), <b>artık</b> (no longer / from now on), <b>henüz</b> (not yet, with a negative)."],
  tbl:[["sabahtan beri","since morning"],["üç saattir","for three hours"],["iki yıl önce","two years ago"],["hâlâ","still"],["artık","any more"],["henüz … değil","not yet"]],
  eg:[["Ne zamandır Türkçe öğreniyorsun?","How long have you been learning Turkish?"],["İki yıldır çalışıyorum.","I have been working for two years."],["Henüz gelmedi.","He hasn't come yet."]]},
 read:{t:"Ne zamandır buradasın?",kind:"Özgün metin · dialogue",src:"A2 · 60 kelime",
  lines:[["— Ne zamandır İstanbul'da yaşıyorsun?","How long have you been living in Istanbul?"],
   ["— Dört yıldır buradayım. Sen?","I have been here four years. You?"],
   ["— Ben geçen sonbahardan beri.","Me since last autumn."],
   ["— Türkçeyi nasıl öğrendin?","How did you learn Turkish?"],
   ["— İki yıl önce kursa başladım, ama hâlâ zorlanıyorum.","I started a course two years ago, but I still struggle."],
   ["— Artık aksanın çok iyi. Henüz farkında değilsin.","Your accent is very good now. You just aren't aware of it yet."]],
  gloss:{"zorlanmak":"to struggle","aksan":"accent","farkında olmak":"to be aware"}},
 drill:[
  {t:"mc",q:"“for three years” =",a:["üç yıldan beri","üç yıldır","üç yıl önce","üç yılda"],c:1,why:"A length takes -DIr; a point takes -DAn beri."},
  {t:"fill",q:"Sabah___ beri seni bekliyorum. (since morning)",c:"tan",why:"sabah ends in h → -tan."},
  {t:"mc",q:"“Henüz gelmedi.” =",a:["He came just now","He hasn't come yet","He no longer comes","He still comes"],c:1,why:"henüz pairs with a negative."},
  {t:"order",q:"Build: “I have been living here for four years.”",w:["Dört","yıldır","burada","yaşıyorum"],c:"Dört yıldır burada yaşıyorum"},
  {t:"mc",q:"Turkish expresses “I have been doing X” with",a:["the past tense","the present tense","the future","the aorist"],c:1,why:"Duration + present."}],
 speak:"Say how long you have been doing six things — job, home, Turkish, a hobby — using -DIr and -DAn beri."},

{id:"a2u8",lv:"A2",n:8,tr:"Kiminle, neyle?",en:"With whom, with what?",focus:"ile · için · edatlar",
 vocab:[["ile (-le/-la)","with, by"],["için","for, in order to"],["göre","according to"],["hakkında","about"],["dolayı","because of"],["rağmen","despite"],["doğru","towards"],["karşı","against, towards"],["birlikte","together with"],["yerine","instead of"]],
 gram:{t:"Edatlar",en:"The postpositions",
  body:["Turkish puts these <i>after</i> the noun. <b>ile</b> attaches as <code>-(y)lA</code>: <b>arabayla</b> (by car), <b>seninle</b> (with you), <b>Ali'yle</b>.",
   "With pronouns, several postpositions demand the genitive: <b>benim için</b>, <b>senin gibi</b>, <b>onun kadar</b>, <b>benimle</b>.",
   "Others take the dative: <b>bana göre</b> (in my view), <b>eve doğru</b> (towards home), <b>sana rağmen</b>.",
   "<b>hakkında</b> (about) takes a possessive: <b>bu konu hakkında</b>, <b>onun hakkında</b>.",
   "<b>için</b> covers both purpose and beneficiary: <b>senin için</b> (for you), <b>görmek için</b> (in order to see)."],
  tbl:[["-(y)lA","with, by means of"],["için","for / in order to"],["gibi","like"],["göre","according to"],["kadar","as … as; until"],["rağmen","despite"]],
  eg:[["Seninle konuşmak istiyorum.","I want to speak with you."],["Bu hediye senin için.","This present is for you."],["Bana göre bu doğru değil.","In my view this isn't right."]]},
 read:{t:"Bir mektup daha",kind:"Özgün metin · letter",src:"A2 · 60 kelime",
  lines:[["Sevgili Deniz, mektubun için çok teşekkür ederim.","Dear Deniz, thank you very much for your letter."],
   ["Geçen hafta ailemle birlikte Bursa'ya gittik.","Last week I went to Bursa together with my family."],
   ["Otobüsle üç saat sürdü, ama yolculuk yorucu değildi.","It took three hours by bus, but the journey wasn't tiring."],
   ["Bana göre Bursa, İstanbul kadar kalabalık değil.","In my view Bursa is not as crowded as Istanbul."],
   ["Yağmura rağmen bütün gün yürüdük.","Despite the rain we walked all day."],
   ["Senin hakkında çok konuştuk; herkes seni soruyor.","We talked a lot about you; everyone asks after you."]],
  gloss:{"sürmek":"to last, to take (time)","yorucu":"tiring","bütün":"whole, all"}},
 drill:[
  {t:"mc",q:"“by car” =",a:["araba ile","arabayla","arabaya","her ikisi de doğru"],c:3,why:"Both the separate ile and the attached -yla are correct; the attached form is commoner."},
  {t:"fill",q:"Bu hediye senin ___ . (for you)",c:"için",why:"Pronoun + genitive + için."},
  {t:"mc",q:"“Yağmura rağmen” =",a:["because of the rain","despite the rain","during the rain","without rain"],c:1,why:"rağmen takes the dative."},
  {t:"order",q:"Build: “I want to speak with you.”",w:["Seninle","konuşmak","istiyorum"],c:"Seninle konuşmak istiyorum"},
  {t:"mc",q:"“Bana göre” means",a:["come to me","in my opinion","towards me","without me"],c:1,why:"göre + dative."}],
 speak:"Say who you did six things with, and why, using -(y)lA and için in every sentence."},

{id:"a2u9",lv:"A2",n:9,tr:"Bir şeyim var",en:"Something hurts",focus:"sağlık · ağrımak · -(y)Im",
 vocab:[["hasta","ill"],["ağrı","ache, pain"],["ağrımak","to hurt"],["baş","head"],["karın","stomach"],["boğaz","throat"],["ateş","fever; fire"],["ilaç","medicine"],["dinlenmek","to rest"],["geçmiş olsun","get well soon"]],
 gram:{t:"Rahatsızlık anlatmak",en:"Saying what's wrong",
  body:["The body part is the subject and does the hurting: <b>Başım ağrıyor</b> — literally “my head is aching”.",
   "Or use <b>var</b>: <b>Ateşim var</b>, <b>Öksürüğüm var</b>, <b>Bir şeyim yok</b> (nothing's wrong with me).",
   "<b>hasta olmak</b> to fall ill, <b>iyileşmek</b> to get better, <b>dinlenmek</b> to rest.",
   "The set phrases matter more than the grammar: <b>Geçmiş olsun</b> (may it pass) to anyone unwell, <b>Şifa olsun</b>, <b>Kendine iyi bak</b> (look after yourself)."],
  tbl:[["Başım ağrıyor.","I have a headache."],["Ateşim var.","I have a fever."],["Hastayım.","I am ill."],["Geçmiş olsun.","Get well soon."],["Kendine iyi bak.","Take care."]],
  eg:[["Boğazım çok ağrıyor.","My throat hurts a lot."],["Dün akşamdan beri hastayım.","I've been ill since last night."],["İlaç aldın mı?","Did you take medicine?"]]},
 read:{t:"Eczanede",kind:"Özgün metin · dialogue",src:"A2 · 55 kelime",
  lines:[["— İyi günler. Boğazım çok ağrıyor.","Good day. My throat hurts a lot."],
   ["— Ne zamandan beri?","Since when?"],
   ["— İki gündür. Ateşim de var.","For two days. I have a fever as well."],
   ["— Doktora gittiniz mi?","Have you been to a doctor?"],
   ["— Henüz gitmedim.","Not yet."],
   ["— O zaman şu ilacı alın ve dinlenin. Geçmiş olsun.","Then take this medicine and rest. Get well soon."]],
  gloss:{"eczane":"pharmacy","o zaman":"in that case","doktor":"doctor"}},
 drill:[
  {t:"mc",q:"“I have a headache.” =",a:["Ben baş ağrıyorum.","Başım ağrıyor.","Başıma ağrı var.","Baş ağrısıyım."],c:1,why:"The body part is the subject."},
  {t:"fill",q:"Ateş___ var. (I have a fever)",c:"im",why:"Possessive + var."},
  {t:"mc",q:"You say “Geçmiş olsun” to someone who",a:["is travelling","has been ill or had trouble","is getting married","is eating"],c:1,why:"“May it be past.”"},
  {t:"order",q:"Build: “I have been ill for two days.”",w:["İki","gündür","hastayım"],c:"İki gündür hastayım"},
  {t:"mc",q:"“Bir şeyim yok.” =",a:["I have nothing","Nothing is wrong with me","I want something","I lost something"],c:1,why:"The standard reply to “are you all right?”"}],
 speak:"Play both sides of a pharmacy visit: symptoms, how long, what you've tried, the reply."},

{id:"a2u10",lv:"A2",n:10,tr:"Rica etsem",en:"If I might ask",focus:"nezaket · siz · -(y)ken",
 vocab:[["rica etmek","to request"],["lütfen","please"],["özür dilemek","to apologise"],["efendim","sir/madam; pardon?"],["müsaade","permission"],["acele","haste"],["beklemek","to wait"],["aramak","to call, to look for"],["müsait","available"],["kolay gelsin","may it go easily"]],
 gram:{t:"Nezaket dili",en:"The register of politeness",
  body:["<b>siz</b> is not only plural; it is the polite singular. Everything agrees with it: <b>Nasılsınız?</b>, <b>buyurun</b>, <b>oturun</b>.",
   "Softening frames, from direct to very polite: <b>Ver.</b> → <b>Verir misin?</b> → <b>Verir misiniz?</b> → <b>Rica etsem verir misiniz?</b> → <b>Zahmet olmazsa…</b>",
   "<code>-(y)ken</code> means <i>while</i> and never harmonises: <b>çalışırken</b>, <b>küçükken</b>, <b>yolda gelirken</b>.",
   "Phone Turkish: <b>Alo, efendim?</b> / <b>… bey ile görüşebilir miyim?</b> / <b>Müsait misiniz?</b> / <b>Sonra arayayım mı?</b>",
   "Work and street formulas worth memorising whole: <b>Kolay gelsin</b> (to anyone working), <b>Eline sağlık</b> (to whoever cooked), <b>Güle güle kullan</b> (about something newly bought)."],
  tbl:[["Verir misiniz?","Would you give…?"],["Rica etsem…","If I might ask…"],["Zahmet olmazsa","If it's no trouble"],["-(y)ken","while"],["Kolay gelsin","May it go easily"]],
  eg:[["Rica etsem pencereyi kapatır mısınız?","Might I ask you to close the window?"],["Çalışırken müzik dinlerim.","I listen to music while working."],["Küçükken burada otururduk.","When I was little we used to live here."]]},
 read:{t:"Telefonda",kind:"Özgün metin · dialogue",src:"A2 · 60 kelime",
  lines:[["— Alo, efendim?","Hello?"],
   ["— İyi günler, Ayşe Hanım ile görüşebilir miyim?","Good day, may I speak with Mrs Ayşe?"],
   ["— Kendisi şu anda toplantıda. Kim aramıştı?","She is in a meeting at the moment. Who was calling?"],
   ["— Ben Deniz. Rica etsem bir not bırakabilir miyim?","This is Deniz. Might I leave a message?"],
   ["— Tabii, buyurun.","Of course, go ahead."],
   ["— Çıkarken beni ararsa sevinirim. Kolay gelsin.","I'd be glad if she called me on her way out. May your work go easily."]],
  gloss:{"kendisi":"she herself (polite third person)","toplantı":"meeting","not bırakmak":"to leave a message","sevinmek":"to be glad"}},
 drill:[
  {t:"mc",q:"The politest of these is",a:["Kapat şunu.","Kapatır mısın?","Kapatır mısınız?","Rica etsem kapatır mısınız?"],c:3,why:"Each step adds distance and softness."},
  {t:"fill",q:"Çalış___ müzik dinlerim. (while working)",c:"ırken",why:"-(y)ken on the aorist stem."},
  {t:"mc",q:"“Kolay gelsin” is said to",a:["someone leaving on a trip","someone at work","someone who is ill","a child"],c:1,why:"Said to anyone mid-task, including strangers."},
  {t:"order",q:"Build: “May I speak with Mrs Ayşe?”",w:["Ayşe","Hanım","ile","görüşebilir","miyim"],c:"Ayşe Hanım ile görüşebilir miyim"},
  {t:"mc",q:"“Küçükken” means",a:["a little","when I was little","the smallest","smaller"],c:1,why:"-ken attaches to nouns too."}],
 speak:"Make the same request five ways, from blunt to extremely polite. Then take a phone call in Turkish, both sides."},
