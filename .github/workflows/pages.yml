# Build the single file, check it, and publish dist/ to GitHub Pages.
#
# Pages can only serve a branch root or /docs, and index.html lives in
# dist/ — so the site is published as an artifact from here rather than by
# moving the build output into the repo layout.
#
# Settings → Pages → Source is still "Deploy from a branch", so every push
# starts GitHub's own legacy builder as well as this workflow. See the wait
# in the deploy job below for why that matters and how it is handled.
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read          # to see whether the legacy Pages builder is still running

# Never let two deploys race; let a newer commit win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # build.sh runs test/parse.js itself, so a stray comma fails here.
      - name: Build
        run: ./build.sh

      - name: Data integrity
        run: node test/validate.js

      - name: Render every screen
        run: node test/sim.js

      - name: Nothing drawn or generated changed
        run: node test/snap.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Two builders publish to one site, and the last one wins.
      #
      # Because the Pages source is a branch rather than "GitHub Actions",
      # every push also starts GitHub's legacy builder, which publishes the
      # repository root. There is no index.html there — dist/ is generated
      # and git-ignored — so that deploy serves a 404. Which of the two
      # lands last has been luck: on the v2.31 merge this workflow finished
      # 12 seconds after it and the app went live, on the merge before that
      # it finished 20 seconds earlier and the site 404'd until the
      # workflow was dispatched by hand.
      #
      # So stop guessing and wait for it. Once the Pages source is switched
      # to "GitHub Actions" the legacy builder stops running at all, this
      # step finds nothing and returns in about ten seconds, so it is safe
      # to leave in place afterwards.
      - name: Wait for the legacy Pages builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inflight() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq '[.workflow_runs[]
                     | select(.path == "dynamic/pages/pages-build-deployment")
                     | select(.status != "completed")] | length'
          }
          # Both runs are queued within a second of the push, but this job
          # starts after a build, so one poll would normally be enough. The
          # grace period is for the case where it has not been created yet.
          sleep 10
          for _ in $(seq 1 40); do          # 40 × 15s, so ten minutes at most
            n="$(inflight)"
            if [ "$n" -eq 0 ]; then
              echo "legacy builder is not running — publishing now"
              exit 0
            fi
            echo "$n legacy run(s) still in flight; waiting"
            sleep 15
          done
          echo "::warning::legacy Pages builder still running after ten minutes — publishing anyway"

      - id: deployment
        uses: actions/deploy-pages@v4
