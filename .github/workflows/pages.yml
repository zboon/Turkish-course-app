# Build the single file, check it, and publish dist/ to GitHub Pages.
#
# Pages can only serve a branch root or /docs, and index.html lives in
# dist/ — so the site is published as an artifact from here rather than by
# moving the build output into the repo layout.
#
# Settings → Pages → Source is "GitHub Actions", so this workflow is the
# only thing that publishes the site. The guard in the deploy job below is
# what catches it if that ever stops being true.
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read          # to see whether the legacy Pages builder is still running

# Never let two deploys race; let a newer commit win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # build.sh runs test/parse.js itself, so a stray comma fails here.
      - name: Build
        run: ./build.sh

      - name: Data integrity
        run: node test/validate.js

      - name: Render every screen
        run: node test/sim.js

      - name: Nothing drawn or generated changed
        run: node test/snap.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A guard against the Pages source being set back to a branch.
      #
      # While the source was "Deploy from a branch", every push also ran
      # GitHub's legacy builder, which publishes the repository root. There
      # is no index.html there — dist/ is generated and git-ignored — so
      # that deploy served a 404, and because both write to one site the
      # last one won. It was luck: one merge went live, the merge before it
      # 404'd until this workflow was dispatched by hand.
      #
      # The source is "GitHub Actions" now, so no legacy run exists and
      # this step costs one API call. It stays because the failure it
      # prevents is silent — the site serves a stale 404 while every check
      # here is green — and because a setting is easier to change back than
      # to notice.
      - name: Guard against the legacy Pages builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Both runs are created from the same push event, so anything in
          # flight is already listed by the time this job starts.
          inflight() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq '[.workflow_runs[]
                     | select(.path == "dynamic/pages/pages-build-deployment")
                     | select(.status != "completed")] | length'
          }
          for _ in $(seq 1 40); do          # 40 × 15s, so ten minutes at most
            n="$(inflight)"
            if [ "$n" -eq 0 ]; then
              echo "no legacy builder in flight — publishing now"
              exit 0
            fi
            echo "::warning::Pages source is a branch again: $n legacy run(s) in flight, waiting so the app lands last"
            sleep 15
          done
          echo "::warning::legacy Pages builder still running after ten minutes — publishing anyway"

      - id: deployment
        uses: actions/deploy-pages@v4
