<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Türkçe Macera</title>
<meta name="description" content="Beginner Turkish for 11–13 year olds: words, phrases and short comics, played as small games. Works offline.">
<meta name="theme-color" content="#0E7C7B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Colours are tokens; the dark set is written twice, for the system
   setting and for the toggle, and kids/test/validate.js holds both to
   WCAG AA on every pair that paints text. */
:root{
  --bg:#FFF7E8;--card:#FFFFFF;--sunk:#F6EEDC;--line:#E6DBC4;
  --ink:#1E2A3A;--ink2:#46536A;--faint:#636C7A;
  --brand:#0E7C7B;--on-brand:#FFFFFF;--brand-soft:#DDF2F0;--brand-ink:#0B6665;
  --blue:#2F55A4;--ok:#17703D;--ok-bg:#E1F5E8;--no:#B63326;--no-bg:#FCE9E6;
  --sun:#E8A317;--sun-ink:#8A5A00;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111827;--card:#1B2436;--sunk:#232E44;--line:#2E3A54;
  --ink:#EEF2F8;--ink2:#C5CEDC;--faint:#9EA8BA;
  --brand:#56C7C1;--on-brand:#0B1320;--brand-soft:#173A3C;--brand-ink:#7FD8D3;
  --blue:#8FB0F2;--ok:#74D69D;--ok-bg:#16301F;--no:#FF9384;--no-bg:#3A1D1A;
  --sun:#F2BD4B;--sun-ink:#F2BD4B;
}}
:root[data-theme="dark"]{
  --bg:#111827;--card:#1B2436;--sunk:#232E44;--line:#2E3A54;
  --ink:#EEF2F8;--ink2:#C5CEDC;--faint:#9EA8BA;
  --brand:#56C7C1;--on-brand:#0B1320;--brand-soft:#173A3C;--brand-ink:#7FD8D3;
  --blue:#8FB0F2;--ok:#74D69D;--ok-bg:#16301F;--no:#FF9384;--no-bg:#3A1D1A;
  --sun:#F2BD4B;--sun-ink:#F2BD4B;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:600 17px/1.45 'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
small{display:block;font-weight:600;font-size:.72em;color:var(--faint);line-height:1.25}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:1.5rem;margin:.3rem 0;font-weight:900}
h2{font-size:1.05rem;font-weight:900;margin:1.4rem .2rem .6rem;display:flex;align-items:baseline;gap:.5rem}
h2 small{display:inline;font-size:.75rem}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:2px solid var(--line)}
.top .tt{flex:1;text-align:center;font-weight:900;font-size:1.05rem;line-height:1.15}
.top.home .brand{flex:1;display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.15rem;line-height:1.1}
.logo{font-size:1.8rem}
.ib{width:42px;height:42px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;flex:0 0 auto}
.ib svg{width:20px;height:20px}
.warn,.note{background:var(--no-bg);color:var(--ink);padding:10px 16px;font-size:.9rem;border-radius:14px;margin:10px 0}
.note{background:var(--sunk)}
.hello{display:flex;gap:10px;align-items:flex-start;margin:8px 0 12px}
.hello .cat{font-size:3rem;line-height:1}
.bubble{flex:1;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px;position:relative}
.bubble p{margin:0 0 .4rem}
.row{display:flex;gap:8px}
.inp{flex:1;width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.inp.big{font-size:1.4rem;text-align:center;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats>div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stats b{display:block;font-size:1rem;font-weight:900}
.task{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:0 0 10px}
.task.main{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.task.main small{color:var(--on-brand);opacity:.85}
.task em{display:block;font-style:normal;font-size:.8rem;color:var(--faint)}
.task.done{justify-content:center}
.ti{font-size:2rem}.grow{flex:1;min-width:0}.go{font-size:1.6rem;font-weight:900}
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.map{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:14px 8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.tile .num{position:absolute;top:8px;left:12px;font-size:.8rem;font-weight:900;color:var(--faint)}
.tile .ico{font-size:2.3rem;line-height:1.1}
.tile .nm{font-weight:800;line-height:1.15}
.tile.locked{background:var(--sunk)}
.tile.won{border-color:var(--sun)}
.tile .cup{position:absolute;top:6px;right:10px}
.stars{display:inline-flex;gap:2px}
.stars i{font-style:normal;color:var(--line);font-size:1.05rem}
.stars i.on{color:var(--sun)}
.link{display:block;margin:22px auto 0;background:none;border:0;color:var(--brand-ink);text-decoration:underline;font-weight:800}
.foot{text-align:center;color:var(--faint);font-size:.8rem;margin-top:14px}
.btn{display:block;width:100%;margin:10px 0 0;padding:14px;border:0;border-radius:18px;background:var(--brand);color:var(--on-brand);font-weight:900;font-size:1.05rem;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn small{color:var(--on-brand);opacity:.85}
.btn:disabled{opacity:.45}
.btn.sm{width:auto;margin:0;padding:10px 16px;font-size:.95rem}
.btn.ghost{background:var(--card);color:var(--brand-ink);border:2px solid var(--line);box-shadow:none}
.btn.ghost small{color:var(--faint)}
.btn.ok{background:var(--ok);color:var(--on-brand)}
.btn.danger{background:var(--no-bg);color:var(--no);box-shadow:none;margin-top:24px}
.btn.danger small{color:var(--no)}
.two{display:flex;gap:10px}.two .btn{flex:1}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:0 0 10px}
.card p{margin:.3rem 0}
.card.lock,.card.new{text-align:center}
.prose p{margin:.5rem 0;color:var(--ink2);font-size:.95rem}
.prose b{color:var(--ink)}
.big{font-size:3.4rem;line-height:1.2}
.uhead{display:flex;align-items:center;gap:12px;font-size:1.3rem;font-weight:900;margin:6px 0 12px}
.uico{font-size:3rem}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:12px 14px;margin:0 0 10px}
.lesson.locked{background:var(--sunk);color:var(--faint)}
.lesson .li{font-size:1.7rem}
.lesson.cupb{border-color:var(--sun)}
.hint{font-size:.88rem;color:var(--ink2);margin:.2rem .2rem 0}
.words{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.word{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.word .em,.opt .em{display:block;font-size:2rem;line-height:1.2}
.word b{display:block}
.tip p{color:var(--ink2)}
.tip p b{color:var(--ink)}
.eg{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.eg:first-of-type{border-top:0}
.spk{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--brand-soft);color:var(--brand-ink);display:inline-grid;place-items:center;flex:0 0 auto;vertical-align:middle}
.spk svg{width:20px;height:20px}
.spk.sm{width:32px;height:32px;margin-right:6px}.spk.sm svg{width:16px;height:16px}
.spk.big{width:84px;height:84px}.spk.big svg{width:40px;height:40px}
/* the game */
.top.play .bar{flex:1;height:14px;border-radius:9px;background:var(--sunk);overflow:hidden}
.top.play .bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.xp{font-weight:900;color:var(--sun-ink)}
.kind{font-size:.85rem;color:var(--faint);margin:.2rem 0 .4rem;text-transform:uppercase;letter-spacing:.06em}
.kind em{font-style:normal;color:var(--no)}
.q{font-size:1.25rem;font-weight:900;margin:.2rem 0 .8rem;line-height:1.2}
.q small{font-size:.65em}
.center{text-align:center}
.hero{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;text-align:center;margin-bottom:12px}
.hero .em{font-size:4.2rem;line-height:1.15}
.hero .tr{font-size:2rem;font-weight:900}
.hero .en{color:var(--ink2);font-size:1.05rem}
.hero .en.big{font-size:1.3rem;color:var(--ink);font-weight:800}
.hero.sm .em{font-size:3.2rem}
.hero .spk{margin-top:10px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.opt{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:12px;min-height:88px}
.opt.txt{font-size:1.2rem;font-weight:900;min-height:64px}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--no-bg);border-color:var(--no)}
.opt.dim{opacity:.5}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.mt{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:6px;font-weight:900;height:68px;font-size:1.05rem}
.mt.pic .em{display:block;font-size:1.5rem;line-height:1.1}
.mt.pic small{font-size:.7rem}
.mt.sel{border-color:var(--blue);background:var(--brand-soft)}
.mt.ok{background:var(--ok-bg);border-color:var(--ok);opacity:.7}
.mt.bad{background:var(--no-bg);border-color:var(--no)}
.slots{min-height:64px;border-bottom:3px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding:8px 0;margin:6px 0 14px}
.slots .ph{color:var(--faint);font-size:.9rem}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lt{width:48px;height:54px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);font-size:1.4rem;font-weight:900}
.wt{padding:10px 14px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);font-weight:900;font-size:1.05rem}
.lt.on,.wt.on{background:var(--brand-soft);border-color:var(--brand)}
.lt.used,.wt.used{visibility:hidden}
.small{font-size:.85rem;color:var(--faint);margin:.4rem .1rem}
.reveal{display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.4rem;margin:12px 0}
.comic{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.say{display:flex;gap:10px;align-items:flex-end;background:none;border:0;padding:0;text-align:left}
.say.r{flex-direction:row-reverse;text-align:right}
.say .who{font-size:2rem;text-align:center;flex:0 0 auto}
.say .who small{font-size:.6rem}
.say .sp{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px}
.say.now .sp{border-color:var(--brand);background:var(--brand-soft)}
.fb{position:sticky;bottom:0;margin:16px -16px -40px;padding:14px 16px 24px;border-radius:22px 22px 0 0}
.fb.ok{background:var(--ok-bg)}
.fb.no{background:var(--no-bg)}
.fb p{margin:.2rem 0}
.fb.ok>p:first-child b{color:var(--ok)}
.fb.no>p:first-child b{color:var(--no)}
.fb .ans{font-size:1.05rem}
.score{font-size:1.1rem;color:var(--ink2)}
.xpgain{font-size:1.4rem;font-weight:900;color:var(--sun-ink)}
.wrap.center{text-align:center;padding-top:30px}
.wrap.center .stars i{font-size:2.2rem}
.sw{display:flex;align-items:center;gap:10px;margin-bottom:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
